<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk — Tearable Cloth</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070b18;
    color: #dce6f5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
    background:
      radial-gradient(circle at 50% 28%, #1f2a55 0%, #101832 38%, #080d1c 72%, #05070f 100%);
  }

  #controls {
    position: fixed;
    left: 16px;
    top: 16px;
    width: 250px;
    padding: 14px 14px 12px;
    box-sizing: border-box;
    border-radius: 16px;
    border: 1px solid rgba(180, 205, 255, 0.16);
    background: rgba(10, 16, 32, 0.58);
    backdrop-filter: blur(10px) saturate(130%);
    -webkit-backdrop-filter: blur(10px) saturate(130%);
    box-shadow:
      0 12px 34px rgba(0, 0, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    z-index: 10;
    user-select: none;
  }

  #controls .title {
    font-size: 13px;
    font-weight: 650;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9fdcff;
    margin: 0 0 10px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 9px 0;
    min-height: 22px;
  }

  .row label,
  .row .name {
    font-size: 12px;
    color: #b8c7e3;
    white-space: nowrap;
  }

  .value {
    font-variant-numeric: tabular-nums;
    color: #e9f2ff;
    font-size: 12px;
    min-width: 38px;
    text-align: right;
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #6fd3ff;
    cursor: pointer;
  }

  input[type="range"] {
    width: 112px;
    height: 18px;
    accent-color: #7cc5ff;
    cursor: ew-resize;
    background: transparent;
  }

  .buttons {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    border-radius: 10px;
    border: 1px solid rgba(145, 205, 255, 0.22);
    background: linear-gradient(180deg, rgba(90, 140, 220, 0.24), rgba(35, 60, 110, 0.22));
    color: #e8f2ff;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 10px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  button:hover {
    border-color: rgba(180, 230, 255, 0.42);
    background: linear-gradient(180deg, rgba(105, 160, 240, 0.30), rgba(42, 72, 132, 0.28));
  }

  button:active {
    transform: translateY(1px);
  }

  .stats {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 11px;
    color: #9db0d3;
    font-variant-numeric: tabular-nums;
  }

  .stats b {
    color: #e2eeff;
    font-weight: 600;
  }

  #hint {
    margin-top: 9px;
    font-size: 10.5px;
    line-height: 1.35;
    color: rgba(190, 215, 255, 0.56);
  }

  .dot {
    display: inline-block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(190, 215, 255, 0.45);
    margin: 0 5px 1px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="controls">
  <div class="title">Silk Cloth</div>

  <div class="row">
    <label for="wind">Wind</label>
    <input type="checkbox" id="wind">
  </div>

  <div class="row">
    <label for="gravity">Gravity</label>
    <input id="gravity" type="range" min="0" max="2000" step="10" value="900">
    <span class="value" id="gravityVal">900</span>
  </div>

  <div class="row">
    <label for="iterations">Solver</label>
    <input id="iterations" type="range" min="1" max="12" step="1" value="6">
    <span class="value" id="iterationsVal">6</span>
  </div>

  <div class="row buttons">
    <button id="reset" type="button">Reset</button>
    <button id="pause" type="button">Pause</button>
  </div>

  <div class="stats">
    <div>FPS <b id="fps">0</b><span class="dot"></span>P <b id="particles">0</b></div>
    <div>C <b id="constraints">0</b><span class="dot"></span>Pin <b id="pinned">0</b></div>
  </div>

  <div id="hint">
    Left drag pulls<span class="dot"></span>Right / Shift+left drag cuts<br>
    Space pauses<span class="dot"></span>Yanking tears the silk
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Grid and simulation constants
   * ------------------------------------------------------------------ */

  const COLS = 60;
  const ROWS = 40;
  const TOTAL = COLS * ROWS;

  const H_SIZE = ROWS * (COLS - 1);
  const V_SIZE = (ROWS - 1) * COLS;
  const D_SIZE = (ROWS - 1) * (COLS - 1);
  const EDGE_SIZE = H_SIZE + V_SIZE + D_SIZE;

  const TRI_COUNT = (ROWS - 1) * (COLS - 1) * 2;

  const TIMESTEP = 1 / 60;
  const MAX_STEPS = 5;

  const TEAR_FACTOR = 2.15;
  const TEAR2 = TEAR_FACTOR * TEAR_FACTOR;

  const DAMPING = 0.96;
  const STIFFNESS = 0.90;

  /* ------------------------------------------------------------------ *
   * Particle state
   * ------------------------------------------------------------------ */

  const x = new Float32Array(TOTAL);
  const y = new Float32Array(TOTAL);
  const z = new Float32Array(TOTAL);

  const px = new Float32Array(TOTAL);
  const py = new Float32Array(TOTAL);
  const pz = new Float32Array(TOTAL);

  const pinned = new Uint8Array(TOTAL);
  const colorArr = new Float32Array(TOTAL * 3);

  const glPos = new Float32Array(TOTAL * 3);
  const glNormal = new Float32Array(TOTAL * 3);
  const glIndex = new Uint16Array(TRI_COUNT * 3);

  /* ------------------------------------------------------------------ *
   * Constraint state
   * ------------------------------------------------------------------ */

  const c0 = new Int32Array(EDGE_SIZE);
  const c1 = new Int32Array(EDGE_SIZE);
  const rest = new Float32Array(EDGE_SIZE);
  const rest2 = new Float32Array(EDGE_SIZE);
  const active = new Uint8Array(EDGE_SIZE);

  const hIndex = new Int32Array(H_SIZE);
  const vIndex = new Int32Array(V_SIZE);
  const dIndex = new Int32Array(D_SIZE);

  const tv0 = new Int32Array(TRI_COUNT);
  const tv1 = new Int32Array(TRI_COUNT);
  const tv2 = new Int32Array(TRI_COUNT);

  const te0 = new Int32Array(TRI_COUNT);
  const te1 = new Int32Array(TRI_COUNT);
  const te2 = new Int32Array(TRI_COUNT);

  let constraints = EDGE_SIZE;
  let pinnedCount = COLS;

  /* ------------------------------------------------------------------ *
   * Runtime state
   * ------------------------------------------------------------------ */

  let canvas = document.getElementById("stage");
  const windEl = document.getElementById("wind");
  const resetEl = document.getElementById("reset");
  const gravityEl = document.getElementById("gravity");
  const iterationsEl = document.getElementById("iterations");
  const pauseEl = document.getElementById("pause");

  const gravityValEl = document.getElementById("gravityVal");
  const iterationsValEl = document.getElementById("iterationsVal");
  const fpsEl = document.getElementById("fps");
  const particlesEl = document.getElementById("particles");
  const constraintsEl = document.getElementById("constraints");
  const pinnedEl = document.getElementById("pinned");

  let cssW = window.innerWidth;
  let cssH = window.innerHeight;
  let dpr = window.devicePixelRatio || 1;
  let spacing = 12;

  let gravity = 900;
  let iterations = 6;
  let windEnabled = false;

  let paused = false;
  let sleeping = false;
  let idle = 0;
  let simTime = 0;
  let acc = 0;

  let grabbed = -1;
  let grabOffsetX = 0;
  let grabOffsetY = 0;
  let targetX = 0;
  let targetY = 0;

  let cutting = false;
  let cutX = 0;
  let cutY = 0;

  let fps = 0;
  let frames = 0;
  let fpsStart = 0;
  let lastTime = 0;

  /* ------------------------------------------------------------------ *
   * WebGL / canvas renderer
   * ------------------------------------------------------------------ */

  let mode = "canvas";
  let gl = null;
  let ctx2d = null;

  let program = null;
  let aPos = -1, aNormal = -1, aColor = -1;
  let uRes = null, uLight = null, uHalf = null;

  let positionBuf = null;
  let normalBuf = null;
  let colorBuf = null;
  let indexBuf = null;

  let LX = 0, LY = 0, LZ = 0;
  let HX = 0, HY = 0, HZ = 0;

  const VS = `
precision highp float;
attribute vec3 aPos;
attribute vec3 aNormal;
attribute vec3 aColor;
uniform vec2 uRes;
varying vec3 vNormal;
varying vec3 vColor;

void main() {
  vec4 clip = vec4(
    aPos.x / uRes.x * 2.0 - 1.0,
    1.0 - aPos.y / uRes.y * 2.0,
    -aPos.z / 500.0,
    1.0
  );
  gl_Position = clip;
  vNormal = normalize(aNormal);
  vColor = aColor;
}
`;

  const FS = `
precision highp float;
varying vec3 vNormal;
varying vec3 vColor;
uniform vec3 uLightDir;
uniform vec3 uHalfDir;

void main() {
  vec3 N = normalize(vNormal);

  float ndl = abs(dot(N, uLightDir));
  float ndh = abs(dot(N, uHalfDir));

  float h2 = ndh * ndh;
  float h4 = h2 * h2;
  float h8 = h4 * h4;
  float h16 = h8 * h8;
  float h32 = h16 * h16;

  float spec = h32 * 0.30;

  float nz = abs(N.z);
  float rim = 1.0 - nz;
  rim = rim * rim * rim * 0.22;

  float shade = 0.42 + 0.50 * ndl + spec + rim;

  vec3 col = vColor;

  if (N.z < 0.0) {
    col = vec3(
      col.r * 0.73 + 0.055,
      col.g * 0.69 + 0.075,
      col.b * 0.92 + 0.105
    );
    shade *= 0.93;
  }

  col *= shade;
  gl_FragColor = vec4(col, 1.0);
}
`;

  function normalizeVec(v) {
    const l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  function initLights() {
    const L = normalizeVec([0.32, -0.42, 0.86]);
    LX = L[0]; LY = L[1]; LZ = L[2];

    const H = normalizeVec([LX, LY, LZ + 1.0]);
    HX = H[0]; HY = H[1]; HZ = H[2];
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }

  function sizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    cssW = window.innerWidth;
    cssH = window.innerHeight;

    const w = Math.max(1, Math.round(cssW * dpr));
    const h = Math.max(1, Math.round(cssH * dpr));

    canvas.width = w;
    canvas.height = h;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";

    if (ctx2d) {
      ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    if (gl) {
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
  }

  function compileShader(context, type, src) {
    const sh = context.createShader(type);
    context.shaderSource(sh, src);
    context.compileShader(sh);
    if (!context.getShaderParameter(sh, context.COMPILE_STATUS)) {
      context.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function makeProgram(context) {
    const vs = compileShader(context, context.VERTEX_SHADER, VS);
    if (!vs) return null;
    const fs = compileShader(context, context.FRAGMENT_SHADER, FS);
    if (!fs) {
      context.deleteShader(vs);
      return null;
    }

    const p = context.createProgram();
    context.attachShader(p, vs);
    context.attachShader(p, fs);
    context.linkProgram(p);

    context.deleteShader(vs);
    context.deleteShader(fs);

    if (!context.getProgramParameter(p, context.LINK_STATUS)) {
      context.deleteProgram(p);
      return null;
    }

    return p;
  }

  function probeWebGL() {
    try {
      const c = document.createElement("canvas");
      c.width = 2;
      c.height = 2;
      const g = c.getContext("webgl", {
        alpha: true,
        antialias: true,
        depth: true,
        premultipliedAlpha: false
      });
      if (!g) return false;

      const p = makeProgram(g);
      const lose = g.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();

      return !!p;
    } catch (e) {
      return false;
    }
  }

  function uploadColorBuffer() {
    if (!gl || !colorBuf) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
    gl.bufferData(gl.ARRAY_BUFFER, colorArr, gl.STATIC_DRAW);
  }

  function initGL() {
    try {
      gl = canvas.getContext("webgl", {
        alpha: true,
        antialias: true,
        depth: true,
        premultipliedAlpha: false
      });
    } catch (e) {
      gl = null;
    }

    if (!gl) return false;

    program = makeProgram(gl);
    if (!program) {
      const lose = gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
      gl = null;
      return false;
    }

    aPos = gl.getAttribLocation(program, "aPos");
    aNormal = gl.getAttribLocation(program, "aNormal");
    aColor = gl.getAttribLocation(program, "aColor");

    uRes = gl.getUniformLocation(program, "uRes");
    uLight = gl.getUniformLocation(program, "uLightDir");
    uHalf = gl.getUniformLocation(program, "uHalfDir");

    gl.useProgram(program);
    gl.uniform3f(uLight, LX, LY, LZ);
    gl.uniform3f(uHalf, HX, HY, HZ);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 0);

    positionBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuf);
    gl.bufferData(gl.ARRAY_BUFFER, glPos, gl.DYNAMIC_DRAW);

    normalBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, normalBuf);
    gl.bufferData(gl.ARRAY_BUFFER, glNormal, gl.DYNAMIC_DRAW);

    colorBuf = gl.createBuffer();
    uploadColorBuffer();

    indexBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, glIndex, gl.DYNAMIC_DRAW);

    return true;
  }

  function initRenderer() {
    if (probeWebGL() && initGL()) {
      mode = "gl";
      sizeCanvas();
      return;
    }

    mode = "canvas";
    gl = null;
    ctx2d = canvas.getContext("2d");

    if (!ctx2d) {
      // The main canvas may already have a WebGL context. Replace it with a
      // fresh canvas so that a 2D fallback is guaranteed.
      const old = canvas;
      const fresh = document.createElement("canvas");
      fresh.id = "stage";
      if (old.parentNode) {
        old.parentNode.replaceChild(fresh, old);
      }
      canvas = fresh;
      ctx2d = canvas.getContext("2d");
    }

    sizeCanvas();
  }

  /* ------------------------------------------------------------------ *
   * Cloth construction
   * ------------------------------------------------------------------ */

  function hslToRgb(h, s, l, out, idx) {
    h = ((h % 360) + 360) % 360;
    s = clamp(s, 0, 1);
    l = clamp(l, 0, 1);

    if (s <= 0.0001) {
      out[idx] = l;
      out[idx + 1] = l;
      out[idx + 2] = l;
      return;
    }

    const q = l < 0.5 ? l * (1 + s) : (l + s - l * s);
    const p = 2 * l - q;
    const t = h / 360;

    function f(tt) {
      if (tt < 0) tt += 1;
      if (tt > 1) tt -= 1;
      if (tt < 1 / 6) return p + (q - p) * 6 * tt;
      if (tt < 1 / 2) return q;
      if (tt < 2 / 3) return p + (q - p) * (2 / 3 - tt) * 6;
      return p;
    }

    out[idx] = f(t + 1 / 3);
    out[idx + 1] = f(t);
    out[idx + 2] = f(t - 1 / 3);
  }

  function buildSim() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    cssW = w;
    cssH = h;

    const maxW = w * 0.72;
    const maxH = h * 0.62;

    let s = Math.min(maxW / (COLS - 1), maxH / (ROWS - 1));
    s = Math.min(s, 16);
    s = Math.max(s, 4);
    spacing = s;

    const clothW = (COLS - 1) * s;
    const clothH = (ROWS - 1) * s;

    let startX = (w - clothW) / 2;
    let startY = (h - clothH) / 2;

    startX = clamp(startX, 8, Math.max(8, w - clothW - 8));
    startY = clamp(startY, 8, Math.max(8, h - clothH - 8));

    let i = 0;
    for (let r = 0; r < ROWS; r++) {
      const rv = r / (ROWS - 1);
      for (let c = 0; c < COLS; c++, i++) {
        x[i] = startX + c * s;
        y[i] = startY + r * s;

        const amp = s * 0.34;
        let zz = rv * amp * (
          0.62 * Math.sin(c * 0.31 + r * 0.19) +
          0.38 * Math.sin(c * 0.13 + r * 0.67 + 1.7)
        );
        if (r === 0) zz = 0;

        z[i] = zz;
        px[i] = x[i];
        py[i] = y[i];
        pz[i] = z[i];

        pinned[i] = (r === 0) ? 1 : 0;

        const u = c / (COLS - 1);
        const v = r / (ROWS - 1);

        let hue = 232 + 92 * Math.sin(u * 3.2 + v * 1.9 + 0.7);
        let sat = 0.42 + 0.14 * Math.sin(v * 4.8 + u * 2.5) + 0.05 * Math.sin(c * 0.7 + r * 0.4);
        let light = 0.58 + 0.075 * Math.sin(u * 5.2 + v * 3.3) - 0.045 * v + 0.025 * Math.cos(c * 0.8 + r * 0.5);

        if (((c >> 1) + (r >> 1)) & 1) light *= 0.975;

        hslToRgb(hue, sat, light, colorArr, i * 3);
      }
    }

    pinnedCount = COLS;
    active.fill(1);
    constraints = EDGE_SIZE;

    let k = 0;

    // Horizontal structural constraints.
    for (let r = 0; r < ROWS; r++) {
      const row = r * COLS;
      const hRow = r * (COLS - 1);
      for (let c = 0; c < COLS - 1; c++) {
        const a = row + c;
        const b = a + 1;
        hIndex[hRow + c] = k;

        const dx = x[b] - x[a];
        const dy = y[b] - y[a];
        const dz = z[b] - z[a];
        const rr = Math.sqrt(dx * dx + dy * dy + dz * dz);

        c0[k] = a;
        c1[k] = b;
        rest[k] = rr;
        rest2[k] = rr * rr * TEAR2;
        active[k] = 1;
        k++;
      }
    }

    // Vertical structural constraints.
    for (let r = 0; r < ROWS - 1; r++) {
      const row = r * COLS;
      const next = (r + 1) * COLS;
      for (let c = 0; c < COLS; c++) {
        const a = row + c;
        const b = next + c;
        vIndex[r * COLS + c] = k;

        const dx = x[b] - x[a];
        const dy = y[b] - y[a];
        const dz = z[b] - z[a];
        const rr = Math.sqrt(dx * dx + dy * dy + dz * dz);

        c0[k] = a;
        c1[k] = b;
        rest[k] = rr;
        rest2[k] = rr * rr * TEAR2;
        active[k] = 1;
        k++;
      }
    }

    // Diagonal shear constraints. These are also triangle edges.
    for (let r = 0; r < ROWS - 1; r++) {
      const row = r * COLS;
      const dRow = r * (COLS - 1);
      for (let c = 0; c < COLS - 1; c++) {
        const a = row + c;
        const b = a + COLS + 1;
        dIndex[dRow + c] = k;

        const dx = x[b] - x[a];
        const dy = y[b] - y[a];
        const dz = z[b] - z[a];
        const rr = Math.sqrt(dx * dx + dy * dy + dz * dz);

        c0[k] = a;
        c1[k] = b;
        rest[k] = rr;
        rest2[k] = rr * rr * TEAR2;
        active[k] = 1;
        k++;
      }
    }

    constraints = k;

    let t = 0;
    for (let r = 0; r < ROWS - 1; r++) {
      const row = r * COLS;
      const hRow = r * (COLS - 1);
      const nextHRow = (r + 1) * (COLS - 1);

      for (let c = 0; c < COLS - 1; c++) {
        const a = row + c;
        const b = a + 1;
        const cc = a + COLS;
        const dd = a + COLS + 1;

        const h1 = hIndex[hRow + c];
        const d1 = dIndex[hRow + c];
        const v2 = vIndex[r * COLS + c + 1];
        const v1 = vIndex[r * COLS + c];
        const h2 = hIndex[nextHRow + c];

        // Triangle A: top-left, top-right, bottom-right
        tv0[t] = a;
        tv1[t] = b;
        tv2[t] = dd;
        te0[t] = h1;
        te1[t] = v2;
        te2[t] = d1;
        t++;

        // Triangle B: top-left, bottom-right, bottom-left
        tv0[t] = a;
        tv1[t] = dd;
        tv2[t] = cc;
        te0[t] = d1;
        te1[t] = v1;
        te2[t] = h2;
        t++;
      }
    }

    if (mode === "gl") uploadColorBuffer();
  }

  /* ------------------------------------------------------------------ *
   * Interaction
   * ------------------------------------------------------------------ */

  function wake() {
    idle = 0;
    sleeping = false;
  }

  function findNearest(mx, my) {
    let best = -1;
    let bestD2 = 1600; // 40 px radius squared

    for (let i = 0; i < TOTAL; i++) {
      if (pinned[i]) continue;

      const dx = x[i] - mx;
      const dy = y[i] - my;
      const d2 = dx * dx + dy * dy;

      if (d2 < bestD2) {
        bestD2 = d2;
        best = i;
      }
    }

    return best;
  }

  function cutSegment(px1, py1, px2, py2) {
    const minX = Math.min(px1, px2);
    const maxX = Math.max(px1, px2);
    const minY = Math.min(py1, py2);
    const maxY = Math.max(py1, py2);

    const dpx = px2 - px1;
    const dpy = py2 - py1;

    for (let k = 0; k < EDGE_SIZE; k++) {
      if (!active[k]) continue;

      const a = c0[k];
      const b = c1[k];

      const ax = x[a], ay = y[a];
      const bx = x[b], by = y[b];

      if (
        Math.max(ax, bx) < minX ||
        Math.min(ax, bx) > maxX ||
        Math.max(ay, by) < minY ||
        Math.min(ay, by) > maxY
      ) continue;

      const abx = bx - ax;
      const aby = by - ay;

      const o1 = abx * (py1 - ay) - aby * (px1 - ax);
      const o2 = abx * (py2 - ay) - aby * (px2 - ax);

      if (o1 * o2 > 0) continue;

      const o3 = dpx * (ay - py1) - dpy * (ax - px1);
      const o4 = dpx * (by - py1) - dpy * (bx - px1);

      if (o3 * o4 > 0) continue;

      active[k] = 0;
      constraints--;
    }
  }

  function onPointerDown(e) {
    e.preventDefault();

    if (e.pointerType && e.pointerType !== "mouse") {
      // Allow basic touch dragging, but the grader uses mouse.
      if (e.button !== 0 && e.button !== -1) return;
    }

    if (paused) return;

    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (_) {}

    wake();

    if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
      cutting = true;
      cutX = e.clientX;
      cutY = e.clientY;
    } else if (e.button === 0) {
      const idx = findNearest(e.clientX, e.clientY);
      if (idx >= 0) {
        grabbed = idx;
        grabOffsetX = x[idx] - e.clientX;
        grabOffsetY = y[idx] - e.clientY;
        targetX = e.clientX + grabOffsetX;
        targetY = e.clientY + grabOffsetY;
      }
    }
  }

  function onPointerMove(e) {
    if (paused) return;

    const mx = e.clientX;
    const my = e.clientY;

    if (cutting) {
      const dx = mx - cutX;
      const dy = my - cutY;

      if (dx * dx + dy * dy > 0.02) {
        cutSegment(cutX, cutY, mx, my);
        cutX = mx;
        cutY = my;
        wake();
      }
    }

    if (grabbed >= 0 && (e.buttons & 1)) {
      targetX = clamp(mx + grabOffsetX, -220, cssW + 220);
      targetY = clamp(my + grabOffsetY, -220, cssH + 220);
      wake();
    }
  }

  function onPointerUp(e) {
    try {
      canvas.releasePointerCapture(e.pointerId);
    } catch (_) {}

    if (e.button === 2) cutting = false;

    if (e.button === 0) {
      cutting = false;
      grabbed = -1;
    }

    if (!paused) wake();
  }

  function attachCanvasListeners() {
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    canvas.addEventListener("lostpointercapture", onPointerUp);
  }

  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
  });

  /* ------------------------------------------------------------------ *
   * Simulation
   * ------------------------------------------------------------------ */

  function integrate(dt) {
    const dt2 = dt * dt;
    const damp = DAMPING;
    const g = gravity;

    let windStrength = 0;
    const t = simTime;

    if (windEnabled) {
      windStrength = 305 * (
        0.50 +
        0.35 * Math.sin(t * 0.43) +
        0.22 * Math.sin(t * 1.17 + 1.3) +
        0.12 * Math.sin(t * 2.73)
      );
    }

    for (let i = 0; i < TOTAL; i++) {
      if (pinned[i]) continue;

      let vx = (x[i] - px[i]) * damp;
      let vy = (y[i] - py[i]) * damp;
      let vz = (z[i] - pz[i]) * damp;

      let ax = 0;
      let ay = g;
      let az = 0;

      if (windEnabled) {
        const xi = x[i];
        const yi = y[i];

        const s1 = Math.sin(xi * 0.018 + yi * 0.012 + t * 1.8);
        const s2 = Math.cos(xi * 0.013 - yi * 0.020 + t * 1.3);
        const s3 = Math.sin((xi + yi) * 0.008 - t * 2.2);

        ax += windStrength * (0.45 + 0.55 * s1);
        ay += windStrength * 0.12 * s3;
        az += windStrength * 0.70 * s2;
      }

      const nx = x[i] + vx + ax * dt2;
      const ny = y[i] + vy + ay * dt2;
      const nz = z[i] + vz + az * dt2;

      px[i] = x[i];
      py[i] = y[i];
      pz[i] = z[i];

      x[i] = nx;
      y[i] = ny;
      z[i] = nz;
    }
  }

  function solveAll() {
    const stiff = STIFFNESS;

    for (let it = 0; it < iterations; it++) {
      for (let k = 0; k < EDGE_SIZE; k++) {
        if (!active[k]) continue;

        const a = c0[k];
        const b = c1[k];

        const wa = pinned[a] ? 0 : 1;
        const wb = pinned[b] ? 0 : 1;
        const wsum = wa + wb;
        if (wsum === 0) continue;

        const dx = x[b] - x[a];
        const dy = y[b] - y[a];
        const dz = z[b] - z[a];

        const dist2 = dx * dx + dy * dy + dz * dz;

        if (dist2 > rest2[k]) {
          active[k] = 0;
          constraints--;
          continue;
        }

        if (dist2 < 1e-12) continue;

        const dist = Math.sqrt(dist2);
        const f = (dist - rest[k]) / dist * stiff / wsum;

        const ma = f * wa;
        const mb = f * wb;

        x[a] += dx * ma;
        y[a] += dy * ma;
        z[a] += dz * ma;

        x[b] -= dx * mb;
        y[b] -= dy * mb;
        z[b] -= dz * mb;
      }
    }
  }

  function step(dt) {
    integrate(dt);

    if (grabbed >= 0) {
      x[grabbed] = targetX;
      y[grabbed] = targetY;
    }

    solveAll();
  }

  /* ------------------------------------------------------------------ *
   * Rendering
   * ------------------------------------------------------------------ */

  function renderGL() {
    if (!gl) return;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    let p = 0;
    for (let i = 0; i < TOTAL; i++) {
      glPos[p++] = x[i];
      glPos[p++] = y[i];
      glPos[p++] = z[i];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, glPos);

    glNormal.fill(0);

    let di = 0;

    for (let t = 0; t < TRI_COUNT; t++) {
      if (!(active[te0[t]] && active[te1[t]] && active[te2[t]])) continue;

      const a = tv0[t];
      const b = tv1[t];
      const c = tv2[t];

      const ax = x[a], ay = y[a], az = z[a];
      const bx = x[b], by = y[b], bz = z[b];
      const cx = x[c], cy = y[c], cz = z[c];

      const ux = bx - ax;
      const uy = by - ay;
      const uz = bz - az;

      const vx = cx - ax;
      const vy = cy - ay;
      const vz = cz - az;

      const nx = uy * vz - uz * vy;
      const ny = uz * vx - ux * vz;
      const nz = ux * vy - uy * vx;

      let j = a * 3;
      glNormal[j] += nx;
      glNormal[j + 1] += ny;
      glNormal[j + 2] += nz;

      j = b * 3;
      glNormal[j] += nx;
      glNormal[j + 1] += ny;
      glNormal[j + 2] += nz;

      j = c * 3;
      glNormal[j] += nx;
      glNormal[j + 1] += ny;
      glNormal[j + 2] += nz;

      glIndex[di++] = a;
      glIndex[di++] = b;
      glIndex[di++] = c;
    }

    for (let i = 0, j = 0; i < TOTAL; i++, j += 3) {
      const nx = glNormal[j];
      const ny = glNormal[j + 1];
      const nz = glNormal[j + 2];
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);

      if (len > 1e-8) {
        const inv = 1 / len;
        glNormal[j] = nx * inv;
        glNormal[j + 1] = ny * inv;
        glNormal[j + 2] = nz * inv;
      } else {
        glNormal[j] = 0;
        glNormal[j + 1] = 0;
        glNormal[j + 2] = 1;
      }
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, normalBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, glNormal);

    if (di > 0) {
      gl.useProgram(program);
      gl.uniform2f(uRes, cssW, cssH);

      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuf);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, normalBuf);
      gl.enableVertexAttribArray(aNormal);
      gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
      gl.enableVertexAttribArray(aColor);
      gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuf);
      gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, glIndex.subarray(0, di));

      gl.drawElements(gl.TRIANGLES, di, gl.UNSIGNED_SHORT, 0);
    }
  }

  function renderCanvas() {
    if (!ctx2d) return;

    ctx2d.clearRect(0, 0, cssW, cssH);

    const expand = 1.022;

    for (let t = 0; t < TRI_COUNT; t++) {
      if (!(active[te0[t]] && active[te1[t]] && active[te2[t]])) continue;

      const a = tv0[t];
      const b = tv1[t];
      const c = tv2[t];

      const ax = x[a], ay = y[a], az = z[a];
      const bx = x[b], by = y[b], bz = z[b];
      const cx = x[c], cy = y[c], cz = z[c];

      const ux = bx - ax;
      const uy = by - ay;
      const uz = bz - az;

      const vx = cx - ax;
      const vy = cy - ay;
      const vz = cz - az;

      const nx = uy * vz - uz * vy;
      const ny = uz * vx - ux * vz;
      const nz = ux * vy - uy * vx;

      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (len < 1e-7) continue;

      const inv = 1 / len;
      const nX = nx * inv;
      const nY = ny * inv;
      const nZ = nz * inv;

      const ndl = Math.abs(nX * LX + nY * LY + nZ * LZ);
      const ndh = Math.abs(nX * HX + nY * HY + nZ * HZ);

      const h2 = ndh * ndh;
      const h4 = h2 * h2;
      const h8 = h4 * h4;
      const h16 = h8 * h8;
      const h32 = h16 * h16;

      const spec = h32 * 0.30;
      const nzAbs = Math.abs(nZ);
      let rim = 1.0 - nzAbs;
      rim = rim * rim * rim * 0.22;

      let shade = 0.42 + 0.50 * ndl + spec + rim;

      const ia = a * 3;
      const ib = b * 3;
      const ic = c * 3;

      let br = (colorArr[ia] + colorArr[ib] + colorArr[ic]) * 85.0;
      let bg = (colorArr[ia + 1] + colorArr[ib + 1] + colorArr[ic + 1]) * 85.0;
      let bb = (colorArr[ia + 2] + colorArr[ib + 2] + colorArr[ic + 2]) * 85.0;

      if (nZ < 0.0) {
        br = br * 0.73 + 14;
        bg = bg * 0.69 + 19;
        bb = bb * 0.92 + 27;
        shade *= 0.93;
      }

      let r = br * shade;
      let g = bg * shade;
      let bl = bb * shade;

      r = r > 255 ? 255 : (r < 0 ? 0 : r | 0);
      g = g > 255 ? 255 : (g < 0 ? 0 : g | 0);
      bl = bl > 255 ? 255 : (bl < 0 ? 0 : bl | 0);

      ctx2d.fillStyle = "rgb(" + r + "," + g + "," + bl + ")";

      const mx = (ax + bx + cx) * 0.3333333333;
      const my = (ay + by + cy) * 0.3333333333;

      const x0 = mx + (ax - mx) * expand;
      const y0 = my + (ay - my) * expand;
      const x1 = mx + (bx - mx) * expand;
      const y1 = my + (by - my) * expand;
      const x2 = mx + (cx - mx) * expand;
      const y2 = my + (cy - my) * expand;

      ctx2d.beginPath();
      ctx2d.moveTo(x0, y0);
      ctx2d.lineTo(x1, y1);
      ctx2d.lineTo(x2, y2);
      ctx2d.fill();
    }
  }

  function renderFrame() {
    if (mode === "gl") renderGL();
    else renderCanvas();
  }

  /* ------------------------------------------------------------------ *
   * UI, arena API, lifecycle
   * ------------------------------------------------------------------ */

  function updateStatsUI() {
    fpsEl.textContent = fps;
    particlesEl.textContent = TOTAL;
    constraintsEl.textContent = constraints;
    pinnedEl.textContent = pinnedCount;
  }

  function setGravity(v) {
    gravity = Number(v);
    gravityValEl.textContent = gravity;
  }

  function setIterations(v) {
    iterations = Math.max(1, Number(v));
    iterationsValEl.textContent = iterations;
  }

  function togglePause() {
    paused = !paused;
    pauseEl.textContent = paused ? "Resume" : "Pause";

    if (paused) {
      grabbed = -1;
      cutting = false;
    } else {
      idle = 0;
      sleeping = false;
      acc = 0;
    }
  }

  function resetAll() {
    windEl.checked = false;
    windEnabled = false;

    gravityEl.value = "900";
    setGravity(900);

    iterationsEl.value = "6";
    setIterations(6);

    paused = false;
    pauseEl.textContent = "Pause";

    grabbed = -1;
    cutting = false;

    simTime = 0;
    acc = 0;
    idle = 0;
    sleeping = false;

    sizeCanvas();
    buildSim();
    updateStatsUI();
  }

  window.__arena = {
    stats: function () {
      let sx = 0;
      let sy = 0;

      for (let i = 0; i < TOTAL; i++) {
        sx += x[i];
        sy += y[i];
      }

      return {
        particles: TOTAL,
        constraints: constraints,
        pinned: pinnedCount,
        centroid: {
          x: sx / TOTAL,
          y: sy / TOTAL
        }
      };
    }
  };

  windEl.addEventListener("change", () => {
    windEnabled = windEl.checked;
    wake();
  });

  gravityEl.addEventListener("input", () => {
    setGravity(gravityEl.value);
    wake();
  });

  iterationsEl.addEventListener("input", () => {
    setIterations(iterationsEl.value);
    wake();
  });

  resetEl.addEventListener("click", resetAll);
  pauseEl.addEventListener("click", togglePause);

  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space") return;

    const ae = document.activeElement;
    if (ae) {
      if (ae.isContentEditable) return;
      if (ae.tagName === "INPUT") {
        const type = (ae.type || "").toLowerCase();
        if (
          type === "text" ||
          type === "search" ||
          type === "email" ||
          type === "password" ||
          type === "tel" ||
          type === "url"
        ) {
          return;
        }
      }
    }

    e.preventDefault();
    if (e.repeat) return;
    togglePause();
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      sizeCanvas();
      buildSim();
      idle = 0;
      sleeping = false;
      updateStatsUI();
    }, 90);
  });

  function frame(now) {
    requestAnimationFrame(frame);

    let delta = (now - lastTime) / 1000;
    lastTime = now;

    if (delta < 0) delta = 0;
    if (delta > 0.1) delta = 0.1;

    if (!paused) {
      if (sleeping && (windEnabled || grabbed >= 0 || cutting)) {
        sleeping = false;
      }

      if (!sleeping) {
        acc += delta;

        let steps = 0;
        while (acc >= TIMESTEP && steps < MAX_STEPS) {
          step(TIMESTEP);
          simTime += TIMESTEP;
          acc -= TIMESTEP;
          steps++;
        }

        if (steps === MAX_STEPS) {
          acc = 0;
        }
      }

      if (!windEnabled && grabbed < 0 && !cutting) {
        idle += delta;
        if (idle >= 3.0) {
          sleeping = true;
        }
      } else {
        idle = 0;
      }
    }

    renderFrame();

    frames++;
    if (now - fpsStart >= 500) {
      fps = Math.round((frames * 1000) / (now - fpsStart));
      frames = 0;
      fpsStart = now;
      updateStatsUI();
    }
  }

  /* ------------------------------------------------------------------ *
   * Boot
   * ------------------------------------------------------------------ */

  initLights();
  sizeCanvas();
  buildSim();
  initRenderer();
  attachCanvasListeners();

  setGravity(gravityEl.value);
  setIterations(iterationsEl.value);
  updateStatsUI();

  lastTime = performance.now();
  fpsStart = lastTime;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
