<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Drum Machine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b14;--panel:#12121f;--panel2:#1a1a2e;
  --text:#e0e0f0;--dim:#555570;
  --t0:#ff4455;--t1:#ff8833;--t2:#ffcc33;--t3:#88ff33;
  --t4:#33ff88;--t5:#33ddff;--t6:#4488ff;--t7:#aa55ff;
  --glow:0 0 8px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;max-width:1280px;margin:0 auto;padding:12px 16px;gap:10px}
header{display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:1.6rem;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#ff4455,#aa55ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#visualizer{flex:1;height:48px;border-radius:6px;background:var(--panel);border:1px solid #222238}
#main{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0}
.track-row{display:flex;align-items:center;gap:6px;min-height:42px}
.track-info{display:flex;align-items:center;gap:6px;width:180px;flex-shrink:0}
.track-name{font-size:.75rem;font-weight:700;letter-spacing:1px;width:70px;text-align:right}
.mute-btn{width:32px;height:32px;border-radius:4px;border:1px solid #333;background:var(--panel2);color:var(--dim);font-size:.6rem;font-weight:700;cursor:pointer;transition:all .15s}
.mute-btn[aria-pressed="true"]{background:#332222;color:#ff4455;border-color:#ff4455;box-shadow:0 0 6px #ff445544}
.vol-slider{width:50px;height:4px;appearance:none;-webkit-appearance:none;background:#222;border-radius:2px;outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;flex:1}
.step-btn{aspect-ratio:1;border-radius:4px;border:1px solid #2a2a40;background:var(--panel);cursor:pointer;transition:all .1s;position:relative;min-width:0;padding:0}
.step-btn:hover{border-color:#444460;transform:scale(1.05)}
.step-btn[aria-pressed="true"]{border-color:transparent}
.step-btn[aria-pressed="true"].t0{background:var(--t0);box-shadow:var(--glow) var(--t0)}
.step-btn[aria-pressed="true"].t1{background:var(--t1);box-shadow:var(--glow) var(--t1)}
.step-btn[aria-pressed="true"].t2{background:var(--t2);box-shadow:var(--glow) var(--t2)}
.step-btn[aria-pressed="true"].t3{background:var(--t3);box-shadow:var(--glow) var(--t3)}
.step-btn[aria-pressed="true"].t4{background:var(--t4);box-shadow:var(--glow) var(--t4)}
.step-btn[aria-pressed="true"].t5{background:var(--t5);box-shadow:var(--glow) var(--t5)}
.step-btn[aria-pressed="true"].t6{background:var(--t6);box-shadow:var(--glow) var(--t6)}
.step-btn[aria-pressed="true"].t7{background:var(--t7);box-shadow:var(--glow) var(--t7)}
.step-btn.beat-start{margin-left:8px}
.step-btn.playhead{transform:scale(1.15);box-shadow:0 0 16px #fff,0 0 32px currentColor;z-index:1}
.step-btn.muted-track{opacity:.3}
#transport{display:flex;align-items:center;gap:14px;flex-shrink:0;padding:10px 0;flex-wrap:wrap}
#play{width:56px;height:56px;border-radius:50%;border:2px solid #333;background:var(--panel2);color:var(--text);font-size:1.4rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
#play.playing{border-color:var(--t0);color:var(--t0);box-shadow:0 0 12px #ff445566;animation:pulse-play 1s infinite}
@keyframes pulse-play{0%,100%{box-shadow:0 0 12px #ff445566}50%{box-shadow:0 0 24px #ff445588}}
#clear{padding:8px 16px;border-radius:6px;border:1px solid #333;background:var(--panel2);color:var(--dim);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s}
#clear:hover{border-color:var(--t0);color:var(--t0)}
.ctrl-group{display:flex;align-items:center;gap:8px}
.ctrl-group label{font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.ctrl-group input[type="range"]{width:120px;height:4px;appearance:none;-webkit-appearance:none;background:#222;border-radius:2px;outline:none;cursor:pointer}
.ctrl-group input[type="range"]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);cursor:pointer;box-shadow:0 0 4px #000}
.ctrl-group .val{font-size:.85rem;font-weight:700;min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PULSE</h1>
    <canvas id="visualizer"></canvas>
  </header>
  <div id="main">
    <div id="sequencer" data-playhead="-1"></div>
  </div>
  <div id="transport">
    <button id="play" aria-label="Play">▶</button>
    <button id="clear">CLEAR</button>
    <div class="ctrl-group">
      <label>Tempo</label>
      <input id="tempo" type="range" min="40" max="240" value="120" step="1">
      <span class="val" id="tempo-val">120</span>
    </div>
    <div class="ctrl-group">
      <label>Swing</label>
      <input id="swing" type="range" min="0" max="100" value="0" step="1">
      <span class="val" id="swing-val">0</span>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
const TRACKS=['Kick','Snare','Closed Hat','Open Hat','Clap','Low Tom','High Tom','Cowbell'];
const NUM_TRACKS=8,NUM_STEPS=16;
let pattern=Array.from({length:NUM_TRACKS},()=>Array(NUM_STEPS).fill(false));
let mutes=Array(NUM_TRACKS).fill(false);
let volumes=Array.from({length:NUM_TRACKS},()=>0.8);
let tempo=120,swing=0;
let isPlaying=false,currentStep=0,nextNoteTime=0;
let ctx=null,noiseBuffer=null,analyser=null,analyserData=null;
let masterGain=null,compressor=null;
let trackGains=[];
let scheduledNotes=[];
let schedulerTimer=null;
const LOOKAHEAD=0.1;

function ensureContext(){
  if(!ctx){
    ctx=new AudioContext();
    const len=ctx.sampleRate*1;
    noiseBuffer=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=noiseBuffer.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    masterGain=ctx.createGain();
    masterGain.gain.value=0.8;
    compressor=ctx.createDynamicsCompressor();
    compressor.threshold.value=-12;
    compressor.knee.value=12;
    compressor.ratio.value=4;
    compressor.attack.value=0.003;
    compressor.release.value=0.25;
    analyser=ctx.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=0.8;
    analyserData=new Uint8Array(analyser.frequencyBinCount);
    masterGain.connect(compressor);
    compressor.connect(analyser);
    analyser.connect(ctx.destination);
    trackGains=[];
    for(let i=0;i<NUM_TRACKS;i++){
      const g=ctx.createGain();
      g.gain.value=volumes[i];
      g.connect(masterGain);
      trackGains.push(g);
    }
  }
  if(ctx.state==='suspended')ctx.resume();
}

function triggerVoice(track,when){
  const tg=trackGains[track];
  switch(track){
    case 0: triggerKick(when,tg);break;
    case 1: triggerSnare(when,tg);break;
    case 2: triggerClosedHat(when,tg);break;
    case 3: triggerOpenHat(when,tg);break;
    case 4: triggerClap(when,tg);break;
    case 5: triggerLowTom(when,tg);break;
    case 6: triggerHighTom(when,tg);break;
    case 7: triggerCowbell(when,tg);break;
  }
}

function triggerKick(when,tg){
  const osc=ctx.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(150,when);
  osc.frequency.exponentialRampToValueAtTime(40,when+0.1);
  const g=ctx.createGain();
  g.gain.setValueAtTime(1,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.35);
  osc.connect(g);g.connect(tg);
  osc.start(when);osc.stop(when+0.35);
  const n=ctx.createBufferSource();n.buffer=noiseBuffer;
  const nf=ctx.createBiquadFilter();nf.type='highpass';nf.frequency.value=3000;
  const ng=ctx.createGain();
  ng.gain.setValueAtTime(0.3,when);
  ng.gain.exponentialRampToValueAtTime(0.001,when+0.015);
  n.connect(nf);nf.connect(ng);ng.connect(tg);
  n.start(when);n.stop(when+0.015);
}

function triggerSnare(when,tg){
  const n=ctx.createBufferSource();n.buffer=noiseBuffer;
  const nf=ctx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1500;nf.Q.value=1;
  const ng=ctx.createGain();
  ng.gain.setValueAtTime(0.7,when);
  ng.gain.exponentialRampToValueAtTime(0.001,when+0.18);
  n.connect(nf);nf.connect(ng);ng.connect(tg);
  n.start(when);n.stop(when+0.18);
  const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=200;
  const og=ctx.createGain();
  og.gain.setValueAtTime(0.5,when);
  og.gain.exponentialRampToValueAtTime(0.001,when+0.08);
  osc.connect(og);og.connect(tg);
  osc.start(when);osc.stop(when+0.08);
}

function triggerClosedHat(when,tg){
  const n=ctx.createBufferSource();n.buffer=noiseBuffer;
  const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=8000;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.4,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.05);
  n.connect(f);f.connect(g);g.connect(tg);
  n.start(when);n.stop(when+0.05);
}

function triggerOpenHat(when,tg){
  const n=ctx.createBufferSource();n.buffer=noiseBuffer;
  const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.35,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.3);
  n.connect(f);f.connect(g);g.connect(tg);
  n.start(when);n.stop(when+0.3);
}

function triggerClap(when,tg){
  const n=ctx.createBufferSource();n.buffer=noiseBuffer;
  const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;f.Q.value=2;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.9,when);
  g.gain.setValueAtTime(0.7,when+0.02);
  g.gain.setValueAtTime(0.5,when+0.04);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.2);
  n.connect(f);f.connect(g);g.connect(tg);
  n.start(when);n.stop(when+0.2);
}

function triggerLowTom(when,tg){
  const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=85;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.8,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.3);
  osc.connect(g);g.connect(tg);
  osc.start(when);osc.stop(when+0.3);
}

function triggerHighTom(when,tg){
  const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=160;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.8,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.2);
  osc.connect(g);g.connect(tg);
  osc.start(when);osc.stop(when+0.2);
}

function triggerCowbell(when,tg){
  const osc1=ctx.createOscillator();osc1.type='square';osc1.frequency.value=540;
  const osc2=ctx.createOscillator();osc2.type='square';osc2.frequency.value=810;
  const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=2;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.25,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+0.35);
  osc1.connect(f);osc2.connect(f);f.connect(g);g.connect(tg);
  osc1.start(when);osc1.stop(when+0.35);
  osc2.start(when);osc2.stop(when+0.35);
}

function scheduleNote(step,time){
  if(!isPlaying)return;
  for(let t=0;t<NUM_TRACKS;t++){
    if(mutes[t])continue;
    if(!pattern[t][step])continue;
    triggerVoice(t,time);
  }
  scheduledNotes.push({step,time});
  if(scheduledNotes.length>64)scheduledNotes.shift();
}

function schedulerTick(){
  if(!isPlaying||!ctx)return;
  const stepDur=60/tempo/4;
  const swingDelay=(swing/100)*(1/3)*stepDur;
  while(nextNoteTime<ctx.currentTime+LOOKAHEAD){
    scheduleNote(currentStep,nextNoteTime);
    if(currentStep%2===0){
      nextNoteTime+=stepDur+swingDelay;
    }else{
      nextNoteTime+=stepDur-swingDelay;
    }
    currentStep=(currentStep+1)%NUM_STEPS;
  }
}

function startPlayback(){
  ensureContext();
  if(isPlaying)return;
  isPlaying=true;
  currentStep=0;
  nextNoteTime=ctx.currentTime+0.05;
  scheduledNotes=[];
  schedulerTimer=setInterval(schedulerTick,25);
  document.getElementById('play').classList.add('playing');
  document.getElementById('play').textContent='■';
}

function stopPlayback(){
  isPlaying=false;
  if(schedulerTimer){clearInterval(schedulerTimer);schedulerTimer=null;}
  document.getElementById('play').classList.remove('playing');
  document.getElementById('play').textContent='▶';
  document.getElementById('sequencer').setAttribute('data-playhead','-1');
  clearPlayheadVisual();
}

function togglePlay(){
  if(isPlaying)stopPlayback();else startPlayback();
}

// Build UI
function buildUI(){
  const seq=document.getElementById('sequencer');
  seq.innerHTML='';
  for(let t=0;t<NUM_TRACKS;t++){
    const row=document.createElement('div');
    row.className='track-row';
    const info=document.createElement('div');
    info.className='track-info';
    const name=document.createElement('span');
    name.className='track-name';
    name.textContent=TRACKS[t];
    name.style.color=`var(--t${t})`;
    const muteBtn=document.createElement('button');
    muteBtn.className='mute-btn';
    muteBtn.setAttribute('data-mute',String(t));
    muteBtn.setAttribute('aria-pressed',mutes[t]?'true':'false');
    muteBtn.textContent='M';
    muteBtn.addEventListener('click',()=>{
      mutes[t]=!mutes[t];
      muteBtn.setAttribute('aria-pressed',mutes[t]?'true':'false');
      updateMuteVisual(t);
      saveState();
    });
    const vol=document.createElement('input');
    vol.type='range';
    vol.min='0';vol.max='1';vol.step='0.01';
    vol.value=volumes[t];
    vol.setAttribute('data-volume',String(t));
    vol.className='vol-slider';
    vol.addEventListener('input',()=>{
      volumes[t]=parseFloat(vol.value);
      if(ctx&&trackGains[t])trackGains[t].gain.value=volumes[t];
      saveState();
    });
    info.appendChild(name);
    info.appendChild(muteBtn);
    info.appendChild(vol);
    row.appendChild(info);
    const steps=document.createElement('div');
    steps.className='steps';
    for(let s=0;s<NUM_STEPS;s++){
      const btn=document.createElement('button');
      btn.className='step-btn t'+t;
      if(s%4===0)btn.classList.add('beat-start');
      btn.setAttribute('data-track',String(t));
      btn.setAttribute('data-step',String(s));
      btn.setAttribute('aria-pressed',pattern[t][s]?'true':'false');
      btn.addEventListener('click',()=>{
        pattern[t][s]=!pattern[t][s];
        btn.setAttribute('aria-pressed',pattern[t][s]?'true':'false');
        saveState();
      });
      steps.appendChild(btn);
    }
    row.appendChild(steps);
    seq.appendChild(row);
  }
  updateMuteVisualAll();
}

function updateMuteVisual(t){
  const seq=document.getElementById('sequencer');
  const row=seq.children[t];
  const btns=row.querySelectorAll('.step-btn');
  btns.forEach(b=>b.classList.toggle('muted-track',mutes[t]));
}

function updateMuteVisualAll(){
  for(let t=0;t<NUM_TRACKS;t++)updateMuteVisual(t);
}

function clearPlayheadVisual(){
  const seq=document.getElementById('sequencer');
  seq.querySelectorAll('.playhead').forEach(el=>el.classList.remove('playhead'));
}

function updatePlayhead(){
  if(!isPlaying||!ctx)return;
  const now=ctx.currentTime;
  let currentStepIdx=-1;
  for(let i=scheduledNotes.length-1;i>=0;i--){
    if(scheduledNotes[i].time<=now){
      currentStepIdx=scheduledNotes[i].step;
      break;
    }
  }
  const seq=document.getElementById('sequencer');
  seq.setAttribute('data-playhead',String(currentStepIdx));
  if(currentStepIdx>=0){
    clearPlayheadVisual();
    for(let t=0;t<NUM_TRACKS;t++){
      const row=seq.children[t];
      const btn=row.querySelectorAll('.step-btn')[currentStepIdx];
      if(btn)btn.classList.add('playhead');
    }
  }
}

// Visualizer
function drawVisualizer(){
  const canvas=document.getElementById('visualizer');
  const c=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  c.clearRect(0,0,w,h);
  if(analyser){
    analyser.getByteFrequencyData(analyserData);
    const bars=64;
    const step=analyserData.length/bars;
    for(let i=0;i<bars;i++){
      const v=analyserData[Math.floor(i*step)]/255;
      const bh=v*h*0.9;
      const x=i*(w/bars);
      const grad=c.createLinearGradient(0,h-bh,0,h);
      grad.addColorStop(0,'#aa55ff');
      grad.addColorStop(1,'#ff4455');
      c.fillStyle=grad;
      c.fillRect(x+1,h-bh-2,(w/bars)-2,bh+2);
    }
  }
  requestAnimationFrame(drawVisualizer);
}

// State persistence
function saveState(){
  try{
    const state={pattern,mutes,volumes,tempo,swing};
    localStorage.setItem('pulse-state',JSON.stringify(state));
  }catch(e){}
}

function loadState(){
  try{
    const s=localStorage.getItem('pulse-state');
    if(s){
      const state=JSON.parse(s);
      if(state.pattern)pattern=state.pattern;
      if(state.mutes)mutes=state.mutes;
      if(state.volumes)volumes=state.volumes;
      if(state.tempo)tempo=state.tempo;
      if(state.swing)swing=state.swing;
    }else{
      // Demo pattern
      pattern[0]=[true,false,false,false,true,false,false,false,true,false,false,false,true,false,false,false];
      pattern[1]=[false,false,false,false,true,false,false,false,false,false,false,false,true,false,false,false];
      pattern[2]=[true,false,true,false,true,false,true,false,true,false,true,false,true,false,true,false];
      pattern[3]=[false,false,true,false,false,false,false,false,false,false,true,false,false,false,false,false];
      pattern[4]=[false,false,false,false,true,false,false,false,false,false,false,false,true,false,false,false];
      pattern[5]=[false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,true];
      pattern[6]=[false,false,false,false,false,false,false,false,true,false,false,false,false,false,false,false];
      pattern[7]=[false,false,false,false,false,false,false,false,true,false,false,false,false,false,false,true];
    }
  }catch(e){}
}

function clearPattern(){
  for(let t=0;t<NUM_TRACKS;t++)for(let s=0;s<NUM_STEPS;s++)pattern[t][s]=false;
  buildUI();
  saveState();
}

// Event handlers
document.getElementById('play').addEventListener('click',()=>{
  ensureContext();
  togglePlay();
});

document.getElementById('clear').addEventListener('click',()=>{
  clearPattern();
});

document.getElementById('tempo').addEventListener('input',function(){
  tempo=parseInt(this.value);
  document.getElementById('tempo-val').textContent=tempo;
  saveState();
});

document.getElementById('swing').addEventListener('input',function(){
  swing=parseInt(this.value);
  document.getElementById('swing-val').textContent=swing;
  saveState();
});

document.addEventListener('keydown',function(e){
  if(e.code==='Space'){
    const tag=document.activeElement.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    e.preventDefault();
    ensureContext();
    togglePlay();
  }
});

// Init
loadState();
buildUI();
document.getElementById('tempo').value=tempo;
document.getElementById('tempo-val').textContent=tempo;
document.getElementById('swing').value=swing;
document.getElementById('swing-val').textContent=swing;

// Resize visualizer
function resizeCanvas(){
  const c=document.getElementById('visualizer');
  c.width=c.clientWidth*window.devicePixelRatio;
  c.height=c.clientHeight*window.devicePixelRatio;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// Playhead update loop
setInterval(updatePlayhead,16);
drawVisualizer();
})();
</script>
</body>
</html>
