<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horizon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--fg:#eef3ff;--dim:rgba(238,243,255,.62);--panel:rgba(10,14,26,.40);--line:rgba(255,255,255,.14);--acc:#ffc98a}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;color:var(--fg);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;outline:none}
canvas.drag{cursor:grabbing}
#hud{position:fixed;left:18px;top:18px;width:236px;padding:14px 16px 14px;border-radius:16px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 8px 30px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;transition:opacity .4s ease}
#hud.hidden{opacity:0;pointer-events:none}
#hud .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
#hud .brand b{font-size:12px;letter-spacing:.34em;font-weight:600}
#fps{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hud .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#clock{font-size:15px;letter-spacing:.06em;color:var(--fg);font-variant-numeric:tabular-nums;text-transform:none}
#phase{font-size:10px;letter-spacing:.14em;color:var(--acc);margin:2px 0 6px;text-transform:uppercase;height:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0 0 12px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
  background:linear-gradient(90deg,#0a1230 0%,#14224f 14%,#e8946a 25%,#79b3ee 36%,#8cc3ff 50%,#79b3ee 64%,#f07a52 75%,#14224f 86%,#0a1230 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.45);border:0}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#0a1230,#e8946a 25%,#8cc3ff 50%,#f07a52 75%,#0a1230)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:0}
#seedrow{margin-bottom:12px}
#seed{width:92px;box-sizing:border-box;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--fg);
  font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right;outline:none;-moz-appearance:textfield}
#seed:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
#seed::-webkit-inner-spin-button,#seed::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#dice{margin-left:6px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--fg);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
#dice:hover{background:rgba(255,255,255,.16)}
#ap{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);cursor:pointer}
#ap i{width:8px;height:8px;border-radius:50%;background:#59616f;box-shadow:0 0 0 3px rgba(255,255,255,.08);transition:all .3s}
#ap.on{color:var(--fg)}
#ap.on i{background:#7dffb2;box-shadow:0 0 0 3px rgba(125,255,178,.2),0 0 10px rgba(125,255,178,.8)}
#ap kbd{margin-left:auto;font:inherit;font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px;letter-spacing:.1em;color:var(--dim);white-space:nowrap;
  transition:opacity 1.2s ease;pointer-events:none}
#hint.gone{opacity:0}
#hint b{color:var(--fg);font-weight:600}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:15px;color:#cfd8ea;background:#05070d;text-align:center}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="hud">
  <div class="brand"><b>HORIZON</b><span id="fps">-- fps</span></div>
  <div class="row"><label for="time">Time of day</label><span id="clock">07:00</span></div>
  <div id="phase"></div>
  <input id="time" type="range" min="0" max="24" step="any" value="7.2">
  <div class="row" id="seedrow"><label for="seed">Seed</label><span><input id="seed" type="number" step="1" value="1"><button id="dice" type="button" tabindex="-1">Random</button></span></div>
  <div id="ap" class="on"><i></i><span id="aptext">Autopilot on</span><kbd>F</kbd></div>
</div>
<div id="hint"><b>W A S D</b> move &nbsp;·&nbsp; <b>Q E</b> / <b>Shift Space</b> down up &nbsp;·&nbsp; <b>drag</b> look &nbsp;·&nbsp; <b>F</b> autopilot &nbsp;·&nbsp; <b>H</b> hide ui</div>
<div id="nogl">WebGL 2 is not available in this browser.</div>
<script>
(() => {
'use strict';

/* ======================================================================================
   Horizon - infinite procedural terrain flyover, raw WebGL2.
   ====================================================================================== */

const DEFAULT_SEED = 1;
const N = 48;                    // cells per chunk side
const S0 = 64;                   // level-0 chunk size (m)
const LEVELS = 7;                // LOD levels 0..6
const TOP = LEVELS - 1;
const RANGE0 = 3 * S0;           // level-0 range
const RANGES = [], MORPH_START = [];
for (let l = 0; l < LEVELS; l++) RANGES[l] = RANGE0 * Math.pow(2, l);
for (let l = 0; l < LEVELS; l++) MORPH_START[l] = l === 0 ? RANGES[0] * 0.6 : RANGES[l - 1] + 0.72 * (RANGES[l] - RANGES[l - 1]);
const MAX_LAYERS = 640;
const NEAR = 1.0, FAR = 26000.0;
const FOG_END = RANGES[TOP] * 0.97;
const CAM_MARGIN = 2.5;
const FOV_Y = 62 * Math.PI / 180;
const LOAD_BUDGET_MS = 5.0;
const DAY_SECONDS = 120;

const $ = (id) => document.getElementById(id);
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: true, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
if (!gl) { $('nogl').style.display = 'flex'; return; }

/* ======================================================================================
   Terrain function (CPU, double precision, deterministic from seed)
   ====================================================================================== */
const SH = new Int32Array(32);
let WORLD_SEED = 0;
function mix32(h) {
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) | 0;
}
function setWorldSeed(s) {
  s = Math.floor(Number(s));
  if (!isFinite(s)) s = 0;
  WORLD_SEED = s;
  const hi = Math.floor(s / 4294967296);
  let h = mix32(((s | 0) ^ 0x5bd1e995) | 0);
  h = mix32((h + mix32(hi | 0)) | 0);
  for (let i = 0; i < SH.length; i++) { h = mix32((h + 0x9e3779b9 + i * 0x7f4a7c15) | 0); SH[i] = h; }
}
function hv(ix, iz, s) {
  let h = (Math.imul(ix, 0x1b873593) ^ Math.imul(iz, 0x85ebca6b) ^ s) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  h ^= h >>> 15;
  return (h >>> 8) * (1 / 8388608) - 1;
}
let gx_ = 0, gz_ = 0;
function vn(x, z, s) {                                 // value noise in [-1,1] + derivatives (gx_, gz_)
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const a = hv(ix, iz, s), b = hv(ix + 1, iz, s), c = hv(ix, iz + 1, s), d = hv(ix + 1, iz + 1, s);
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uz = fz * fz * fz * (fz * (fz * 6 - 15) + 10);
  const dx = 30 * fx * fx * (fx - 1) * (fx - 1), dz = 30 * fz * fz * (fz - 1) * (fz - 1);
  const k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  gx_ = dx * (k1 + k4 * uz); gz_ = dz * (k2 + k4 * ux);
  return a + k1 * ux + k2 * uz + k4 * ux * uz;
}
function sstep(a, b, x) { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }

function terrainH(x, z) {
  // domain warp
  const w1 = vn(x * 0.00065, z * 0.00065, SH[0]);
  const w2 = vn(x * 0.00065 + 43.1, z * 0.00065 + 17.9, SH[1]);
  const px = x + w1 * 520, pz = z + w2 * 520;

  // continents: low frequency
  const c = vn(px * 0.00008, pz * 0.00008, SH[2]) * 0.62 + vn(px * 0.00019 + 3.3, pz * 0.00019 + 8.1, SH[3]) * 0.28 + vn(px * 0.00046, pz * 0.00046, SH[4]) * 0.10;
  const land = c * 260 + 34;
  const landF = sstep(-40, 50, land);

  // mountain mask
  const mm = vn(px * 0.00017 + 9.1, pz * 0.00017 + 2.7, SH[5]) * 0.68 + vn(px * 0.00041 - 5.0, pz * 0.00041, SH[6]) * 0.32;
  const mask = sstep(-0.12, 0.42, mm);

  // ridged, erosion-damped multifractal
  let r = 0, amp = 1, norm = 0, f = 0.00062, xx = px, zz = pz, ddx = 0, ddz = 0;
  for (let i = 0; i < 6; i++) {
    const n = vn(xx * f, zz * f, SH[8 + i]);
    const sg = n < 0 ? 1 : -1;
    ddx += amp * sg * gx_ * f; ddz += amp * sg * gz_ * f;
    const ab = (Math.sqrt(n * n + 0.014) - 0.11832) / 0.88873;
    let rg = 1 - ab;
    rg = rg * rg;
    const damp = 1 / (1 + (ddx * ddx + ddz * ddz) * 120000);
    r += amp * rg * (0.35 + 0.65 * damp);
    norm += amp;
    amp *= 0.5;
    const nx = xx * 0.8 - zz * 0.6, nz = xx * 0.6 + zz * 0.8;
    xx = nx + 713.0; zz = nz - 211.0; f *= 2.07;
  }
  r /= norm;                                    // ~[0..1]
  const rr = r * r * (1.0 + 0.6 * r);
  const mountain = mask * (0.25 + 0.75 * landF) * rr * 560;

  // rolling hills
  const hl = vn(px * 0.0014, pz * 0.0014, SH[16]) * 0.5 + vn(px * 0.0033 + 5, pz * 0.0033, SH[17]) * 0.28 + vn(px * 0.0079, pz * 0.0079 + 3, SH[18]) * 0.14 + vn(px * 0.019, pz * 0.019, SH[19]) * 0.08;
  const hills = hl * 46 * (0.25 + 0.75 * landF);
  // fine detail
  const dt = vn(px * 0.045, pz * 0.045, SH[20]) * 1.6 + vn(px * 0.12, pz * 0.12 + 7, SH[21]) * 0.7 + vn(px * 0.31, pz * 0.31, SH[22]) * 0.3;

  let h = land * (0.55 + 0.45 * landF) + mountain + hills + dt * (0.5 + 0.5 * landF);
  if (h < 0) h = -50 * (1 - Math.exp(h / 50));
  else if (h > 330) h = 330 + 100 * Math.tanh((h - 330) / 100);
  return h;
}

/* ======================================================================================
   Math helpers
   ====================================================================================== */
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  out.fill(0);
  out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
  return out;
}
function mat4Mul(out, a, b) {
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    out[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return out;
}
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function smoothDamp(cur, target, st, smoothTime, maxSpeed, dt) {   // st = {v}
  smoothTime = Math.max(0.0001, smoothTime);
  const omega = 2 / smoothTime, x = omega * dt;
  const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const maxChange = maxSpeed * smoothTime;
  const change = clamp(cur - target, -maxChange, maxChange);
  const tgt = cur - change;
  const temp = (st.v + omega * change) * dt;
  st.v = (st.v - omega * temp) * e;
  let out = tgt + (change + temp) * e;
  if ((target - cur > 0) === (out > target)) { out = target; st.v = (out - target) / dt; }
  return out;
}

/* ======================================================================================
   Shaders
   ====================================================================================== */
const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2DArray;
`;

const VS_TERRAIN = HDR + `
layout(location=0) in vec3 a_grid;
layout(location=1) in vec4 a_i0;
layout(location=2) in vec2 a_i1;
uniform mat4 u_vp;
uniform vec3 u_cam;
uniform float u_N;
uniform sampler2DArray u_hmap;
out vec3 v_rel; out float v_h; out vec2 v_uv; flat out float v_layer; flat out float v_size; out float v_morph; out float v_skirt;
void main(){
  int layer = int(a_i0.w + 0.5);
  ivec2 ij = ivec2(a_grid.xy + 0.5);
  vec2 hh = texelFetch(u_hmap, ivec3(ij, layer), 0).rg;
  float cell = a_i0.z / u_N;
  vec2 rxz = a_i0.xy + a_grid.xy * cell;
  float d = length(vec3(rxz.x, hh.x - u_cam.y, rxz.y));
  float k = clamp((d - a_i1.x) / max(a_i1.y - a_i1.x, 1.0), 0.0, 1.0);
  float h = mix(hh.x, hh.y, k);
  float sk = a_grid.z * (a_i0.z * 0.06 + 4.0);
  vec3 rel = vec3(rxz.x, h - u_cam.y - sk, rxz.y);
  v_rel = rel; v_h = h;
  v_uv = (a_grid.xy + 0.5) / (u_N + 1.0);
  v_layer = float(layer); v_size = a_i0.z; v_morph = k; v_skirt = a_grid.z;
  gl_Position = u_vp * vec4(rel, 1.0);
}`;

const VS_SKY = HDR + `
layout(location=0) in vec2 a_pos;
uniform vec3 u_right, u_up, u_fwd; uniform vec2 u_tan;
out vec3 v_dir;
void main(){
  v_dir = u_fwd + u_right * (a_pos.x * u_tan.x) + u_up * (a_pos.y * u_tan.y);
  gl_Position = vec4(a_pos, 1.0, 1.0);
}`;

const FS_COMMON = HDR + `
uniform vec3 u_cam;
uniform vec3 u_sunDir, u_sunCol, u_moonDir, u_moonCol;
uniform vec3 u_zenith, u_horSun, u_horOpp, u_glow, u_ambSky, u_ambGnd;
uniform float u_star, u_time, u_cloud, u_fogB, u_fogEnd, u_exposure;
uniform vec2 u_wind, u_res, u_seedOff;
const float CLOUD_H = 2300.0;
const float PI = 3.14159265;

uint pcg(uint v){ uint s = v*747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float h21(ivec2 p){ uint h = pcg(uint(p.x) + pcg(uint(p.y) + 0x9E3779B9u)); return float(h >> 8) * (1.0/16777216.0); }
float h31(ivec3 p){ uint h = pcg(uint(p.x) + pcg(uint(p.y) + pcg(uint(p.z) + 0x85EBCA6Bu))); return float(h >> 8) * (1.0/16777216.0); }
float vn(vec2 p){
  vec2 i = floor(p); vec2 f = p - i; vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0); ivec2 ii = ivec2(i);
  float a = h21(ii), b = h21(ii+ivec2(1,0)), c = h21(ii+ivec2(0,1)), d = h21(ii+ivec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
vec3 vnd(vec2 p){
  vec2 i = floor(p); vec2 f = p - i; vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0); vec2 du = 30.0*f*f*(f-1.0)*(f-1.0); ivec2 ii = ivec2(i);
  float a = h21(ii), b = h21(ii+ivec2(1,0)), c = h21(ii+ivec2(0,1)), d = h21(ii+ivec2(1,1));
  float k1 = b-a, k2 = c-a, k4 = a-b-c+d;
  return vec3(a + k1*u.x + k2*u.y + k4*u.x*u.y, du * vec2(k1 + k4*u.y, k2 + k4*u.x));
}
const mat2 ROT = mat2(0.8, 0.6, -0.6, 0.8);
float fbm(vec2 p, int oct){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 8; i++){ if (i >= oct) break; s += a * vn(p); p = ROT * p * 2.03 + 17.1; a *= 0.5; }
  return s / (1.0 - exp2(-float(oct)));
}

/* ---------- atmosphere ---------- */
vec3 horizonCol(vec3 d){
  vec2 hz = d.xz; float hl = length(hz); hz = hl > 1e-4 ? hz / hl : vec2(1.0, 0.0);
  vec2 sz = u_sunDir.xz; float sl = length(sz); sz = sl > 1e-4 ? sz / sl : vec2(1.0, 0.0);
  float az = dot(hz, sz) * 0.5 + 0.5;
  return mix(u_horOpp, u_horSun, az * az * (3.0 - 2.0 * az));
}
vec3 atmo(vec3 d){
  float y = max(d.y, 0.0);
  vec3 hc = horizonCol(d);
  vec3 col = mix(hc, u_zenith, pow(y, 0.42));
  float mu = max(dot(d, u_sunDir), 0.0);
  col += u_glow * (0.22 * pow(mu, 3.0) + 0.55 * pow(mu, 24.0) + 1.1 * pow(mu, 260.0));
  return col;
}
vec3 stars(vec3 d){
  if (u_star < 0.01 || d.y < 0.0) return vec3(0.0);
  vec3 col = vec3(0.0);
  for (int s = 0; s < 2; s++){
    float sc = s == 0 ? 70.0 : 170.0;
    vec3 p = d * sc; vec3 ip = floor(p); vec3 fp = p - ip;
    float h = h31(ivec3(ip) + ivec3(s * 71));
    if (h > 0.972){
      vec3 sp = vec3(h31(ivec3(ip) + ivec3(11, 3, 5)), h31(ivec3(ip) + ivec3(7, 19, 2)), h31(ivec3(ip) + ivec3(23, 5, 13))) * 0.6 + 0.2;
      float dd = length(fp - sp);
      float b = smoothstep(s == 0 ? 0.16 : 0.12, 0.0, dd) * (h - 0.972) / 0.028;
      float tw = 0.75 + 0.25 * sin(u_time * (1.5 + 3.0 * h) + h * 90.0);
      vec3 tint = mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.85, 0.7), fract(h * 37.0));
      col += tint * b * tw * (s == 0 ? 1.6 : 0.9);
    }
  }
  vec3 gn = normalize(vec3(0.35, 0.8, 0.5));
  float band = exp(-pow(dot(d, gn) * 3.2, 2.0));
  float cl = fbm(d.xz / (d.y + 0.6) * 5.0, 4);
  col += vec3(0.30, 0.35, 0.55) * band * (0.012 + 0.07 * cl * cl) * 1.1;
  return col * u_star * smoothstep(0.0, 0.18, d.y);
}
vec3 moon(vec3 d){
  if (u_star < 0.01) return vec3(0.0);
  float mu = dot(d, u_moonDir);
  float x = 1.0 - mu;
  float disc = 1.0 - smoothstep(1.0e-4, 1.45e-4, x);
  vec3 t1 = normalize(cross(u_moonDir, vec3(0.0, 1.0, 0.0)));
  vec3 t2 = cross(t1, u_moonDir);
  vec2 q = vec2(dot(d, t1), dot(d, t2)) * 75.0;
  float tex = 0.78 + 0.34 * fbm(q * 2.2 + 3.0, 4);
  vec3 c = vec3(0.92, 0.95, 1.0) * disc * tex * 2.2;
  c += vec3(0.35, 0.45, 0.8) * (0.55 * pow(max(mu, 0.0), 300.0) + 0.12 * pow(max(mu, 0.0), 40.0));
  return c * u_star * smoothstep(-0.05, 0.08, u_moonDir.y);
}
vec3 sunDisc(vec3 d){
  float mu = dot(d, u_sunDir);
  float x = 1.0 - mu;
  float disc = 1.0 - smoothstep(4.2e-5, 6.8e-5, x);
  return u_sunCol * disc * 22.0 * smoothstep(-0.02, 0.01, d.y);
}
float cloudDens(vec2 p, int oct){
  float f = fbm((p + u_wind) * 0.00034 + vec2(7.3, 2.1), oct);
  float th = 1.0 - u_cloud;
  return smoothstep(th, th + 0.28, f);
}
vec4 clouds(vec3 d, vec3 o, int oct){
  float hgt = CLOUD_H - o.y;
  if (d.y < 0.01 || hgt < 20.0 || u_cloud < 0.01) return vec4(0.0);
  float t = hgt / d.y;

let lastTris = 0, lastDrawn = 0;
const planes = new Float32Array(24);
function extractPlanes(m) {
  const row = (i) => [m[i], m[4 + i], m[8 + i], m[12 + i]];
  const r0 = row(0), r1 = row(1), r2 = row(2), r3 = row(3);
  const ps = [
    [r3[0] + r0[0], r3[1] + r0[1], r3[2] + r0[2], r3[3] + r0[3]],
    [r3[0] - r0[0], r3[1] - r0[1], r3[2] - r0[2], r3[3] - r0[3]],
    [r3[0] + r1[0], r3[1] + r1[1], r3[2] + r1[2], r3[3] + r1[3]],
    [r3[0] - r1[0], r3[1] - r1[1], r3[2] - r1[2], r3[3] - r1[3]],
    [r3[0] + r2[0], r3[1] + r2[1], r3[2] + r2[2], r3[3] + r2[3]],
    [r3[0] - r2[0], r3[1] - r2[1], r3[2] - r2[2], r3[3] - r2[3]],
  ];
  for (let i = 0; i < 6; i++) { planes.set(ps[i], i * 4); }
}
function boxVisible(x0, y0, z0, x1, y1, z1) {
  for (let i = 0; i < 6; i++) {
    const a = planes[i * 4], b = planes[i * 4 + 1], c = planes[i * 4 + 2], d = planes[i * 4 + 3];
    const px = a > 0 ? x1 : x0, py = b > 0 ? y1 : y0, pz = c > 0 ? z1 : z0;
    if (a * px + b * py + c * pz + d < 0) return false;
  }
  return true;
}

function setU3(u, name, v) { const l = u[name]; if (l) gl.uniform3f(l, v[0], v[1], v[2]); }
function setCommonUniforms(u) {
  setU3(u, 'u_cam', [cam.x, cam.y, cam.z]);
  setU3(u, 'u_sunDir', A.sunDir); setU3(u, 'u_sunCol', A.sunCol);
  setU3(u, 'u_moonDir', A.moonDir); setU3(u, 'u_moonCol', A.moonCol);
  setU3(u, 'u_zenith', A.zen); setU3(u, 'u_horSun', A.hs); setU3(u, 'u_horOpp', A.ho);
  setU3(u, 'u_glow', A.glow); setU3(u, 'u_ambSky', A.ambSky); setU3(u, 'u_ambGnd', A.ambGnd);
  gl.uniform1f(u.u_star, A.star); gl.uniform1f(u.u_time, animT);
  gl.uniform1f(u.u_cloud, A.cloud); gl.uniform1f(u.u_fogB, A.fogB); gl.uniform1f(u.u_fogEnd, FOG_END);
  gl.uniform1f(u.u_exposure, 1.0);
  gl.uniform2f(u.u_wind, animT * 9.0, animT * 3.5);
  gl.uniform2f(u.u_res, cw, ch);
  gl.uniform2f(u.u_seedOff, (SH[30] & 1023) / 7.0, (SH[31] & 1023) / 7.0);
}

function render() {
  const aspect = cw / ch;
  const b = camBasis();
  mat4Perspective(proj, FOV_Y, aspect, NEAR, FAR);
  view.fill(0);
  view[0] = b.r[0]; view[4] = b.r[1]; view[8] = b.r[2];
  view[1] = b.u[0]; view[5] = b.u[1]; view[9] = b.u[2];
  view[2] = -b.f[0]; view[6] = -b.f[1]; view[10] = -b.f[2];
  view[15] = 1;
  mat4Mul(vp, proj, view);
  extractPlanes(vp);

  gl.viewport(0, 0, cw, ch);
  gl.clearColor(A.ho[0], A.ho[1], A.ho[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // instances
  let n = 0;
  for (let i = 0; i < visible.length && n < MAX_INST; i++) {
    const c = visible[i];
    const pad = c.size * 0.06 + 5;
    if (!boxVisible(c.x0 - cam.x, c.minY - pad - cam.y, c.z0 - cam.z, c.x0 + c.size - cam.x, c.maxY + 1 - cam.y, c.z0 + c.size - cam.z)) continue;
    const o = n * 6;
    instData[o] = c.x0 - cam.x; instData[o + 1] = c.z0 - cam.z; instData[o + 2] = c.size; instData[o + 3] = c.layer;
    if (c.level === TOP) { instData[o + 4] = 1e9; instData[o + 5] = 2e9; }
    else { instData[o + 4] = MORPH_START[c.level]; instData[o + 5] = RANGES[c.level]; }
    n++;
  }
  lastDrawn = n; lastTris = n * TRIS_PER_CHUNK + 1;

  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.depthMask(true);
  gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
  if (n > 0) {
    const u = progTerrain.u;
    gl.useProgram(progTerrain.p);
    gl.bindVertexArray(vaoTerrain);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData, 0, n * 6);
    setCommonUniforms(u);
    gl.uniformMatrix4fv(u.u_vp, false, vp);
    gl.uniform1f(u.u_N, N);
    gl.uniform1f(u.u_dbg, window.__dbg || 0);
    gl.uniform1i(u.u_hmap, 0); gl.uniform1i(u.u_nmap, 1);
    gl.uniform4fv(u.u_wave, waveData);
    gl.uniform1fv(u.u_wph, wavePhase);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texH);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, texN);
    gl.drawElementsInstanced(gl.TRIANGLES, INDEX_COUNT, gl.UNSIGNED_SHORT, 0, n);
  }

  // sky
  {
    const u = progSky.u;
    gl.useProgram(progSky.p);
    gl.bindVertexArray(vaoSky);
    setCommonUniforms(u);
    setU3(u, 'u_right', b.r); setU3(u, 'u_up', b.u); setU3(u, 'u_fwd', b.f);
    const ty = Math.tan(FOV_Y / 2);
    gl.uniform2f(u.u_tan, ty * aspect, ty);
    gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true); gl.depthFunc(gl.LESS);
  }
  gl.bindVertexArray(null);
}

/* ======================================================================================
   Main loop
   ====================================================================================== */
let lastT = performance.now();
let fpsFrames = 0, fpsT = lastT, slowFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 1 / 60;
  dt = Math.min(dt, 0.1);
  const sim = frozen ? 0 : dt;
  if (sim > 0) {
    animT += sim;
    if (!sliderHeld) { timeH += sim * 24 / DAY_SECONDS; if (timeH >= 24) timeH -= 24; }
  }
  computeAtmosphere();
  updateCamera(dt, sim);
  computeWavePhases();
  frameNo++;
  if (needSync) { streamChunks(true); needSync = false; } else streamChunks(false);
  selectAll();
  render();
  clockT += dt;
  if (clockT > 0.1) { clockT = 0; updateTimeUI(); }

  fpsFrames++;
  if (now - fpsT >= 500) {
    const fps = fpsFrames * 1000 / (now - fpsT);
    elFps.textContent = Math.round(fps) + ' fps';
    fpsFrames = 0; fpsT = now;
    if (fps < 24 && performance.now() > 6000) { if (++slowFrames >= 4 && pixelScale > 0.6) { pixelScale *= 0.85; slowFrames = 0; resize(); } }
    else slowFrames = 0;
  }
}

/* ======================================================================================
   Public API for the grader
   ====================================================================================== */
const api = {
  freeze(on) { frozen = !!on; },
  setSeed(n) { applySeed(n); },
  setTime(h) {
    h = Number(h);
    if (!isFinite(h)) return;
    h = h % 24; if (h < 0) h += 24;
    timeH = h; computeAtmosphere(); updateTimeUI();
    elTime.value = String(timeH);
  },
  setCamera(c) {
    if (!c) return;
    if (isFinite(c.x)) cam.x = +c.x;
    if (isFinite(c.z)) cam.z = +c.z;
    if (isFinite(c.y)) cam.y = +c.y;
    if (isFinite(c.yaw)) cam.yaw = +c.yaw;
    if (isFinite(c.pitch)) cam.pitch = clamp(+c.pitch, -1.55, 1.55);
    vel[0] = vel[1] = vel[2] = 0;
    apHeading = cam.yaw; yawOff = 0; pitchOff = 0; apPitch = cam.pitch; apTarget = apHeading; apAlt.v = 0; apVy = 0; apTimer = 0;
    clampCamera();
    needSync = true;
  },
  getCamera() { return { x: cam.x, y: cam.y, z: cam.z, yaw: cam.yaw, pitch: cam.pitch }; },
  terrainHeight(x, z) { x = Number(x); z = Number(z); return (isFinite(x) && isFinite(z)) ? terrainH(x, z) : 0; },
  stats() { return { chunks: chunks.size, triangles: lastTris }; },
  _dbg() { return { visible: visible.map(c => ({level:c.level,ix:c.ix,iz:c.iz,x0:c.x0,z0:c.z0,size:c.size,minY:c.minY,maxY:c.maxY})), cam: {...cam}, RANGES, MORPH_START }; },
};
Object.defineProperty(window, '__arena', { value: api, writable: false, configurable: true });

/* ======================================================================================
   Init
   ====================================================================================== */
setWorldSeed(DEFAULT_SEED);
elSeed.value = String(DEFAULT_SEED);
elTime.value = String(timeH);
resize();
computeAtmosphere();
// start position & heading
cam.x = 0; cam.z = 0; cam.yaw = -1.1; cam.pitch = -0.14;
apHeading = cam.yaw; apTarget = apHeading; apPitch = cam.pitch;
cam.y = minAltitude(cam.x, cam.z) + 120;
updateApUI();
updateTimeUI();
computeWavePhases();
streamChunks(true);
needSync = false;
selectAll();
render();
requestAnimationFrame((t) => { lastT = t; fpsT = t; requestAnimationFrame(frame); });
setTimeout(() => { $('hint').classList.add('gone'); }, 14000);
})();
</script>
</body>
</html>
