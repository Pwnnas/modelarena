<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gridcalc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 12h16M8 20h16M14 8v16M20 8v16' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#2563eb; --accent-d:#1d4ed8; --accent-soft:#e6eefc;
  --ink:#1b2230; --ink-2:#475467; --ink-3:#8791a3;
  --line:#e5e8ee; --line-strong:#d3d8e0; --chrome:#f6f7f9;
  --hdr-bg:#f6f7f9; --hdr-line:#dde1e8;
  --err:#c2272d; --err-bg:#fdf1f1;
  --rowh:24px; --hdrh:26px; --rhw:50px;
  --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--chrome);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;min-width:480px}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4f8cff,#1d4ed8);display:grid;place-items:center;box-shadow:0 1px 3px rgba(29,78,216,.4),inset 0 0 0 1px rgba(255,255,255,.18)}
.brand{font-weight:650;font-size:15px;letter-spacing:-.015em}
.vsep{width:1px;height:20px;background:var(--line)}
.doc{color:var(--ink-2);font-size:13px}
.spacer{flex:1}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.saved i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}

/* ---------- toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:2px;height:40px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.tb{height:28px;min-width:28px;padding:0 8px;border:0;background:transparent;border-radius:6px;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 12.5px var(--font);cursor:pointer;transition:background .12s}
.tb:hover{background:#eff1f5;color:var(--ink)}
.tb:active{background:#e4e8ee}
.tb[disabled]{opacity:.35;pointer-events:none}
.tb svg{flex:none}
.tsep{width:1px;height:18px;background:var(--line);margin:0 6px}
.hint{font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px var(--font);background:#f1f3f6;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2)}

/* ---------- formula row ---------- */
#fxrow{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
#name-box{width:72px;height:28px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:6px;font-weight:600;font-size:12.5px;background:#fff;color:var(--ink);flex:none;letter-spacing:.01em}
.fx{font:italic 600 15px Georgia,"Times New Roman",serif;color:var(--ink-3);padding:0 2px;flex:none}
#bar-wrap{position:relative;flex:1;height:28px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;overflow:hidden;transition:border-color .12s,box-shadow .12s}
#bar-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
#bar-hl,#formula-bar{font:13.5px/26px var(--font);padding:0 10px;letter-spacing:0;word-spacing:0}
#bar-hl{position:absolute;left:0;top:0;white-space:pre;pointer-events:none;color:var(--ink)}
#formula-bar{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;margin:0;background:transparent;color:transparent;caret-color:var(--ink);-webkit-user-select:text;user-select:text}
#formula-bar::selection,#ed::selection{background:rgba(37,99,235,.28);color:transparent}
#formula-bar::placeholder{color:#a3acbb}

/* ---------- grid ---------- */
#grid-scroll{flex:1;min-height:0;position:relative;overflow:auto;background:#fff;scrollbar-gutter:auto}
#grid-scroll::-webkit-scrollbar{width:13px;height:13px}
#grid-scroll::-webkit-scrollbar-track{background:#f6f7f9}
#grid-scroll::-webkit-scrollbar-thumb{background:#cdd2db;border-radius:8px;border:3px solid #f6f7f9}
#grid-scroll::-webkit-scrollbar-thumb:hover{background:#b3bac6}
#grid-scroll::-webkit-scrollbar-corner{background:#f6f7f9}
#sheet{position:relative;width:max-content;min-width:100%}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
#grid th,#grid td{margin:0;height:var(--rowh);padding:0 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:calc(var(--rowh) - 1px);font-weight:400}
#grid td{background:transparent;cursor:cell;text-align:left;color:var(--ink)}
#grid td[data-t=n]{text-align:right;text-overflow:clip}
#grid td[data-t=t]{text-align:left}
#grid td[data-t=b]{text-align:center}
#grid td[data-t=e]{text-align:center;color:var(--err);background:var(--err-bg);font-weight:500;font-size:12px;position:relative;cursor:help;text-overflow:clip}
#grid td[data-t=e]::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #e5484d transparent transparent}
#grid td.spill{overflow:visible;text-overflow:clip;position:relative;z-index:1}
#grid td.in-range{background:rgba(37,99,235,.085)}
#grid td[aria-selected=true]{background:transparent}
#grid td[data-t=e].in-range{background:#fbe4e4}
#grid td[data-t=e][aria-selected=true]{background:var(--err-bg)}
#grid thead th{position:sticky;top:0;z-index:5;height:var(--hdrh);line-height:calc(var(--hdrh) - 1px);background:var(--hdr-bg);color:var(--ink-2);font-size:11.5px;font-weight:500;text-align:center;border-right-color:var(--hdr-line);border-bottom-color:var(--hdr-line);padding:0;overflow:hidden;cursor:default}
#grid tbody th{position:sticky;left:0;z-index:4;background:var(--hdr-bg);color:var(--ink-2);font-size:11.5px;font-weight:500;text-align:center;border-right-color:var(--hdr-line);border-bottom-color:var(--hdr-line);padding:0;cursor:default}
#grid thead th.corner{left:0;z-index:7}
#grid thead th.corner::after{content:"";position:absolute;right:6px;bottom:5px;border-style:solid;border-width:0 0 10px 10px;border-color:transparent transparent #c0c6d1 transparent}
#grid thead th.ch:hover,#grid tbody th.rh:hover,#grid thead th.corner:hover{background:#eceff3}
#grid thead th.ch.sel,#grid tbody th.rh.sel{background:#e9eefa;color:var(--accent-d)}
#grid thead th.ch.act,#grid tbody th.rh.act{background:#d9e5fc;color:var(--accent-d);font-weight:600}
#grid thead th.ch.act{box-shadow:inset 0 -2px 0 var(--accent)}
#grid tbody th.rh.act{box-shadow:inset -2px 0 0 var(--accent)}
#grid thead th.ch{position:sticky}
.rz{position:absolute;top:0;right:0;bottom:0;width:6px;cursor:col-resize;z-index:2}
.rz:hover,.rz.on{background:rgba(37,99,235,.55)}

/* overlays */
.ov{position:absolute;pointer-events:none;display:none}
#cursor{z-index:3;border:2px solid var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.7)}
#range-box{z-index:2;border:1px solid var(--accent)}
#ants{z-index:2;background-image:linear-gradient(90deg,var(--accent) 50%,transparent 50%),linear-gradient(90deg,var(--accent) 50%,transparent 50%),linear-gradient(0deg,var(--accent) 50%,transparent 50%),linear-gradient(0deg,var(--accent) 50%,transparent 50%);background-size:8px 2px,8px 2px,2px 8px,2px 8px;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-position:0 0,0 100%,0 0,100% 0;animation:ants .5s linear infinite}
@keyframes ants{to{background-position:8px 0,-8px 100%,0 -8px,100% 8px}}
.refbox{position:absolute;z-index:2;pointer-events:none;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:1px}
#editor{position:absolute;z-index:4;display:none;background:#fff;border:2px solid var(--accent);box-shadow:0 4px 14px rgba(20,30,60,.18);pointer-events:none}
#ed-hl,#ed{font:13px/21px var(--font);padding:0 8px 0 5px;letter-spacing:0;word-spacing:0}
#ed-hl{white-space:pre;min-height:21px;color:var(--ink);pointer-events:none}
#ed{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;margin:0;background:transparent;color:transparent;caret-color:var(--ink);pointer-events:none;-webkit-user-select:text;user-select:text}

/* syntax colouring */
.k-fn,.k-bool{color:#7c3aed}.k-str{color:#0f766e}.k-num{color:#b45309}.k-op{color:#64748b}.k-ref{color:#2563eb}.k-name,.k-bad{color:#dc2626;text-decoration:underline wavy #dc2626}

/* ---------- status ---------- */
#status{display:flex;align-items:center;gap:12px;height:28px;padding:0 14px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);flex:none;white-space:nowrap;overflow:hidden}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#eef1f5;color:var(--ink-2);font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.pill.edit{background:var(--accent-soft);color:var(--accent-d)}
#msg{overflow:hidden;text-overflow:ellipsis;color:var(--ink-3)}
#msg.err{color:var(--err)}
.sp{flex:1}
.stat{display:inline-flex;gap:5px;padding:2px 9px;border-radius:6px;background:#f3f5f8;color:var(--ink)}
.stat b{font-weight:500;color:var(--ink-3)}
#stats{display:flex;gap:6px;font-variant-numeric:tabular-nums}
#sink{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;outline:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="1.8" y="1.8" width="12.4" height="12.4" rx="2.4"/><path d="M1.8 6h12.4M1.8 10h12.4M6 1.8v12.4M10 1.8v12.4"/></svg></div>
    <div class="brand">Gridcalc</div>
    <div class="vsep"></div>
    <div class="doc">Untitled spreadsheet</div>
    <div class="spacer"></div>
    <div class="saved"><i></i>Saved in this browser</div>
  </header>
  <div id="toolbar">
    <button class="tb" id="b-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h6a3.5 3.5 0 0 1 0 7H6"/><path d="M6 3.5 3 6.5l3 3"/></svg></button>
    <button class="tb" id="b-redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 6.5h-6a3.5 3.5 0 0 0 0 7H10"/><path d="M10 3.5l3 3-3 3"/></svg></button>
    <div class="tsep"></div>
    <button class="tb" id="b-clear" title="Clear selected cells (Delete)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8"/></svg>Clear</button>
    <button class="tb" id="b-sample" title="Fill the sheet with an example budget"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 6.5h12M6.5 6.5v7"/></svg>Load example</button>
    <div class="spacer"></div>
    <div class="hint">Type to edit &middot; <kbd>F2</kbd> edit in place &middot; <kbd>Enter</kbd> / <kbd>Tab</kbd> commit &middot; <kbd>Esc</kbd> cancel</div>
  </div>
  <div id="fxrow">
    <div id="name-box">A1</div>
    <div class="fx" aria-hidden="true">fx</div>
    <div id="bar-wrap"><div id="bar-hl" aria-hidden="true"></div><input id="formula-bar" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Enter a value or a formula, e.g. =SUM(A1:A3)" aria-label="Formula bar"></div>
  </div>
  <div id="grid-scroll">
    <div id="sheet">
      <table id="grid" role="grid" aria-label="Spreadsheet"></table>
      <div id="refs"></div>
      <div class="ov" id="ants"></div>
      <div class="ov" id="range-box"></div>
      <div class="ov" id="cursor"></div>
      <div id="editor"><div id="ed-hl" aria-hidden="true"></div><input id="ed" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Cell editor"></div>
    </div>
  </div>
  <footer id="status">
    <span class="pill" id="mode">Ready</span>
    <span id="msg"></span>
    <span class="sp"></span>
    <span id="stats"></span>
  </footer>
</div>
<input id="sink" type="text" autocomplete="off" spellcheck="false" aria-label="Grid keyboard input">
<script>
(() => {
'use strict';

/* =====================================================================
 *  Constants
 * =================================================================== */
const COLS = 26, ROWS = 100, N = COLS * ROWS;
const DEF_W = 100, MIN_W = 44, MAX_W = 520, RHW = 50;
const LS_CELLS = 'gridcalc.cells.v1', LS_COLS = 'gridcalc.cols.v1';
const PALETTE = ['#2563eb', '#dc2626', '#16a34a', '#ea580c', '#c026d3', '#0891b2', '#ca8a04', '#475569'];

/* =====================================================================
 *  Errors & value helpers
 * =================================================================== */
class Err { constructor(code, msg) { this.code = code; this.msg = msg; } }
const E = {
  DIV0:  new Err('#DIV/0!', 'Division by zero.'),
  VALUE: new Err('#VALUE!', 'Wrong type of value: text cannot be used in arithmetic.'),
  REF:   new Err('#REF!',   'Invalid reference: the cell lies outside A1:Z100.'),
  ERROR: new Err('#ERROR!', 'The formula cannot be parsed or uses an unknown function.'),
  CYCLE: new Err('#CYCLE!', 'Circular reference: this cell is part of, or depends on, a cycle.'),
  NUM:   new Err('#NUM!',   'The result is not a valid finite number.')
};

function fmtNum(x) {
  if (x === 0) return '0';
  const s = String(Number(x.toPrecision(10)));
  return s.indexOf('e') >= 0 ? s.replace('e', 'E') : s;
}
const round15 = x => Number(x.toPrecision(15));
const RE_NUMBER = /^\s*[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?\s*$/;

function colLetters(n) { let s = ''; while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); } return s; }
const addrOf = i => String.fromCharCode(65 + (i % COLS)) + (Math.floor(i / COLS) + 1);
function idxOfAddr(a) {
  const m = /^([A-Z])(\d{1,3})$/.exec(a);
  if (!m) return -1;
  const r = parseInt(m[2], 10) - 1, c = m[1].charCodeAt(0) - 65;
  return (r < 0 || r >= ROWS) ? -1 : r * COLS + c;
}

/* =====================================================================
 *  Tokenizer
 * =================================================================== */
const RE_NUM = /(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/y;
const RE_REF = /\$?[A-Za-z]+\$?\d+(?![A-Za-z0-9_(])/y;
const RE_ID = /[A-Za-z_][A-Za-z0-9_.]*/y;
const RE_REF_PARTS = /^(\$?)([A-Za-z]+)(\$?)(\d+)$/;

function tokenize(src, from) {
  const toks = [], n = src.length;
  let i = from || 0;
  while (i < n) {
    const ch = src[i];
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { i++; continue; }
    const s = i;
    if ((ch >= '0' && ch <= '9') || (ch === '.' && src[i + 1] >= '0' && src[i + 1] <= '9')) {
      RE_NUM.lastIndex = i; RE_NUM.exec(src);
      i = RE_NUM.lastIndex;
      toks.push({ k: 'num', s, e: i, v: Number(src.slice(s, i)) });
      continue;
    }
    if (ch === '"') {
      let j = i + 1, out = '', closed = false;
      while (j < n) {
        if (src[j] === '"') {
          if (src[j + 1] === '"') { out += '"'; j += 2; continue; }
          closed = true; j++; break;
        }
        out += src[j++];
      }
      i = j;
      toks.push({ k: closed ? 'str' : 'bad', s, e: i, v: out });
      continue;
    }
    if (ch === '$' || (ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || ch === '_') {
      RE_REF.lastIndex = i;
      if (RE_REF.exec(src)) {
        i = RE_REF.lastIndex;
        const m = RE_REF_PARTS.exec(src.slice(s, i));
        const letters = m[2].toUpperCase();
        let col = 0;
        for (let q = 0; q < letters.length; q++) col = col * 26 + (letters.charCodeAt(q) - 64);
        if (letters.length > 3) col = 999999;
        const row = parseInt(m[4], 10);
        toks.push({ k: 'ref', s, e: i, ac: m[1] === '$', ar: m[3] === '$', c: col, r: row,
                    bad: col < 1 || col > COLS || row < 1 || row > ROWS });
        continue;
      }
      RE_ID.lastIndex = i;
      if (RE_ID.exec(src)) {
        i = RE_ID.lastIndex;
        const name = src.slice(s, i), up = name.toUpperCase();
        let j = i; while (j < n && (src[j] === ' ' || src[j] === '\t')) j++;
        if (src[j] === '(') toks.push({ k: 'fn', s, e: i, v: up });
        else if (up === 'TRUE' || up === 'FALSE') toks.push({ k: 'bool', s, e: i, v: up === 'TRUE' });
        else toks.push({ k: 'name', s, e: i, v: name });
        continue;
      }
      i++; toks.push({ k: 'bad', s, e: i }); continue;
    }
    const two = src.substr(i, 2);
    if (two === '<>' || two === '<=' || two === '>=') { i += 2; toks.push({ k: 'op', s, e: i, v: two }); continue; }
    if ('+-*/^&=<>(),:'.indexOf(ch) >= 0) { i++; toks.push({ k: 'op', s, e: i, v: ch }); continue; }
    i++; toks.push({ k: 'bad', s, e: i });
  }
  return toks;
}

/* =====================================================================
 *  Parser (recursive descent, precedence per spec)
 * =================================================================== */
const ARITY = { SUM: [1, 99], AVERAGE: [1, 99], MIN: [1, 99], MAX: [1, 99], COUNT: [1, 99], IF: [2, 3], ABS: [1, 1], ROUND: [1, 2] };
const CMP_OPS = new Set(['=', '<>', '<', '>', '<=', '>=']);

function parse(toks) {
  let p = 0;
  const bad = () => { throw new SyntaxError('parse'); };
  const isOp = s => p < toks.length && toks[p].k === 'op' && toks[p].v === s;
  function cmp() {
    let l = cat();
    while (p < toks.length && toks[p].k === 'op' && CMP_OPS.has(toks[p].v)) { const op = toks[p++].v; l = { t: 'c', op, a: l, b: cat() }; }
    return l;
  }
  function cat() { let l = add(); while (isOp('&')) { p++; l = { t: '&', a: l, b: add() }; } return l; }
  function add() { let l = mul(); while (isOp('+') || isOp('-')) { const op = toks[p++].v; l = { t: 'a', op, a: l, b: mul() }; } return l; }
  function mul() { let l = unary(); while (isOp('*') || isOp('/')) { const op = toks[p++].v; l = { t: 'a', op, a: l, b: unary() }; } return l; }
  function unary() {
    if (isOp('-') || isOp('+')) { const op = toks[p++].v; return { t: 'u', op, a: unary() }; }
    return pow();
  }
  function pow() {
    const base = primary();
    if (isOp('^')) { p++; return { t: 'a', op: '^', a: base, b: unary() }; }
    return base;
  }
  function primary() {
    const t = toks[p];
    if (!t) bad();
    switch (t.k) {
      case 'num': p++; return { t: 'n', v: t.v };
      case 'str': p++; return { t: 's', v: t.v };
      case 'bool': p++; return { t: 'b', v: t.v };
      case 'ref': {
        p++;
        if (isOp(':')) {
          p++;
          const u = toks[p];
          if (!u || u.k !== 'ref') bad();
          p++;
          return { t: 'g', r1: Math.min(t.r, u.r) - 1, r2: Math.max(t.r, u.r) - 1, c1: Math.min(t.c, u.c) - 1, c2: Math.max(t.c, u.c) - 1, bad: t.bad || u.bad };
        }
        return { t: 'r', i: t.bad ? -1 : (t.r - 1) * COLS + (t.c - 1), bad: t.bad };
      }
      case 'fn': {
        p++;
        const ar = ARITY[t.v];
        if (!ar || !isOp('(')) bad();
        p++;
        const args = [];
        if (isOp(')')) { p++; } else {
          for (;;) {
            args.push(cmp());
            if (isOp(',')) { p++; continue; }
            if (isOp(')')) { p++; break; }
            bad();
          }
        }
        if (args.length < ar[0] || args.length > ar[1]) bad();
        return { t: 'f', name: t.v, args };
      }
      case 'op':
        if (t.v === '(') { p++; const e = cmp(); if (!isOp(')')) bad(); p++; return e; }
        bad();
    }

/* =====================================================================
 *  Editing

/* =====================================================================
 *  Clipboard (internal, with relative reference shifting)
 * =================================================================== */
let clip = null; // { rows: string[][], r0, c0 }

function refText(t, dr, dc) {

  if (!t.ac) c += dc;
  if (!t.ar) r += dr;
  if (c < 1 || r < 1) return (t.ac ? '$' : '') + 'A' + (t.ar ? '$' : '') + '0';
  return (t.ac ? '$' : '') + colLetters(c) + (t.ar ? '$' : '') + r;

  clip = { rows, r0: b.r1, c0: b.c1 };

/* =====================================================================
 *  Keyboard
 * =================================================================== */
function jumpTarget(r, c, dr, dc) {
  const ne = (rr, cc) => kinds[rr * COLS + cc] !== 0;
  const inb = (rr, cc) => rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS;
  let nr = r + dr, nc = c + dc;
  if (!inb(nr, nc)) return [r, c];
  if (ne(r, c) && ne(nr, nc)) {
    while (inb(nr + dr, nc + dc) && ne(nr + dr, nc + dc)) { nr += dr; nc += dc; }
    return [nr, nc];
  }
  while (inb(nr, nc) && !ne(nr, nc)) { nr += dr; nc += dc; }
  if (!inb(nr, nc)) { nr = clampR(nr); nc = clampC(nc); }
  return [nr, nc];
}

const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };

function onGridKey(e) {

    if (lk === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (lk === 'y') { e.preventDefault(); redo(); return; }

    if (k === 'Home') { e.preventDefault(); moveTo(0, 0, e.shiftKey); return; }
    if (k === 'End') { e.preventDefault(); moveTo(ROWS - 1, COLS - 1, e.shiftKey); return; }
    return;
  }

    e.preventDefault();
    const d = ARROWS[k];

    else moveTo(sel.r + d[0], sel.c + d[1], false);
    return;
  }

    case 'Enter': e.preventDefault(); moveTo(sel.r + (e.shiftKey ? -1 : 1), sel.c, false); return;
    case 'Tab': e.preventDefault(); moveTo(sel.r, sel.c + (e.shiftKey ? -1 : 1), false); return;
    case 'Home': e.preventDefault(); moveTo(sel.r, 0, e.shiftKey); return;
    case 'End': e.preventDefault(); moveTo(sel.r, COLS - 1, e.shiftKey); return;

function onEditKey(e) {

document.addEventListener('keydown', e => {

  if (t === ed) return onEditKey(e);

sink.addEventListener('input', () => {

sink.addEventListener('compositionend', e => {

/* =====================================================================
 *  Mouse
 * =================================================================== */
let drag = null, textDrag = null, resizing = null, lastMouse = null, scrollTimer = null;

function charIndexAt(x, y) {
  const len = ed.value.length;

  if (x <= hr.left + 5) return 0;
  edHl.style.pointerEvents = 'auto';
  let r = null;
  try { r = document.caretRangeFromPoint(x, Math.min(Math.max(y, hr.top + 3), hr.bottom - 3)); } catch (_) {}
  edHl.style.pointerEvents = '';

  if (r.startContainer.nodeType !== 3) return r.startOffset > 0 ? len : 0;

function extendTo(el) {

  else {

    else if (th && drag.type === 'row' && th.classList.contains('rh')) { r = th._r; c = COLS - 1; }
    else if (td && drag.type === 'col') { c = td._i % COLS; r = ROWS - 1; }

function autoScroll() {

    ['A5', 'Hardware'], ['B5', '8200'], ['C5', '7900'], ['D5', '9100'], ['E5', '8800'],
    ['A6', 'Services'], ['B6', '15600'], ['C6', '16200'], ['D6', '15900'], ['E6', '17400'],
    ['A7', 'Marketing'], ['B7', '5400'], ['C7', '6100'], ['D7', '5800'], ['E7', '7200'],
    ['A8', 'Support'], ['B8', '3900'], ['C8', '4100'], ['D8', '4400'], ['E8', '4300'],
    ['A9', 'Total'], ['B9', '=SUM(B4:B8)'], ['C9', '=SUM(C4:C8)'], ['D9', '=SUM(D4:D8)'], ['E9', '=SUM(E4:E8)'], ['F9', '=SUM(F4:F8)'], ['G9', '=SUM(G4:G8)'],
    ['A11', 'Average quarter'], ['B11', '=AVERAGE(B9:E9)'],
    ['A12', 'Best quarter'], ['B12', '=MAX(B9:E9)'],
    ['A13', 'Worst quarter'], ['B13', '=MIN(B9:E9)'],
    ['A14', 'Growth Q1 to Q4 %'], ['B14', '=ROUND((E9-B9)/B9*100,1)'],
    ['A15', 'Tax rate'], ['B15', '0.2'],
    ['A16', 'Tax due'], ['B16', '=ROUND(F9*B15,2)'],
    ['A17', 'Summary'], ['B17', '="Total of "&F9&" with tax "&B16']
  ];
  for (let r = 4; r <= 8; r++) {
    d.push(['F' + r, '=SUM(B' + r + ':E' + r + ')']);
    d.push(['G' + r, '=ROUND(F' + r + '/F$9*100,1)']);
    d.push(['H' + r, '=IF(F' + r + '>50000,"Strong","Watch")']);
  }
  applyBatch(d.map(([a, v]) => [idxOfAddr(a), v]));
  moveTo(0, 0, false);
}

/* =====================================================================
 *  Boot
 * =================================================================== */
(function boot() {
  const seeds = [];
  try {
    const o = JSON.parse(localStorage.getItem(LS_CELLS) || '{}');
    if (o && typeof o === 'object') for (const a of Object.keys(o)) {
      const i = idxOfAddr(a), raw = o[a];
      if (i >= 0 && typeof raw === 'string' && raw !== '') { installCell(i, raw); seeds.push(i); }
    }
  } catch (_) {}
  const aff = recalc(seeds);
  for (let k = 0; k < aff.length; k++) renderCell(aff[k]);
  flushSpill();
  syncHistoryButtons();
  renderSelection();
  sink.focus({ preventScroll: true });
})();
})();
</script>
