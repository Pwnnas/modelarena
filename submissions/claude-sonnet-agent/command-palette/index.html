<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Cpath d='M12 11.5h8a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-8a.5.5 0 0 1 .5-.5z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  --accent-c: var(--accent, #5b5bd6);
  --on-accent: #fff;
  --accent-soft: color-mix(in srgb, var(--accent-c) 12%, transparent);
  --accent-ink: color-mix(in srgb, var(--accent-c) 78%, var(--text));
  --font: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.4, 0, .2, 1);
  --zoom: 1;
}
:root, html[data-theme="light"] {
  color-scheme: light;
  --bg: #fcfcfb;
  --bg-side: #f5f5f3;
  --surface: #ffffff;
  --text: #1d1d20;
  --text-2: #5d5d66;
  --text-3: #8d8d97;
  --line: rgba(24, 24, 40, .085);
  --line-strong: rgba(24, 24, 40, .15);
  --hover: rgba(24, 24, 40, .05);
  --press: rgba(24, 24, 40, .08);
  --tile: rgba(24, 24, 40, .055);
  --scrim: rgba(24, 24, 38, .30);
  --pal-bg: rgba(255, 255, 255, .86);
  --pal-foot: rgba(244, 244, 247, .72);
  --pal-line: rgba(24, 24, 40, .08);
  --pal-shadow: 0 0 0 .5px rgba(24, 24, 40, .14), 0 2px 4px rgba(24, 24, 40, .04), 0 14px 28px -8px rgba(24, 24, 50, .14), 0 36px 90px -14px rgba(24, 24, 60, .34);
  --key-bg: linear-gradient(#ffffff, #f2f2f5);
  --key-line: rgba(24, 24, 40, .16);
  --key-text: #5a5a63;
  --key-hi: rgba(255, 255, 255, .9);
  --toast-bg: #1e1e24;
  --toast-text: #f6f6f8;
  --toast-sub: #a9a9b4;
  --toast-shadow: 0 0 0 .5px rgba(255, 255, 255, .08), 0 8px 24px -6px rgba(14, 14, 30, .34), 0 2px 6px rgba(14, 14, 30, .16);
  --card-shadow: 0 1px 2px rgba(24, 24, 40, .06), 0 0 0 1px rgba(24, 24, 40, .06);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f12;
  --bg-side: #131418;
  --surface: #181a1f;
  --text: #ececf1;
  --text-2: #a2a2ae;
  --text-3: #70707c;
  --line: rgba(255, 255, 255, .075);
  --line-strong: rgba(255, 255, 255, .14);
  --hover: rgba(255, 255, 255, .055);
  --press: rgba(255, 255, 255, .09);
  --tile: rgba(255, 255, 255, .065);
  --scrim: rgba(2, 2, 6, .56);
  --pal-bg: rgba(25, 26, 32, .86);
  --pal-foot: rgba(15, 16, 20, .62);
  --pal-line: rgba(255, 255, 255, .08);
  --pal-shadow: 0 0 0 .5px rgba(255, 255, 255, .13), inset 0 1px 0 rgba(255, 255, 255, .05), 0 2px 4px rgba(0, 0, 0, .3), 0 18px 36px -8px rgba(0, 0, 0, .5), 0 40px 100px -16px rgba(0, 0, 0, .75);
  --key-bg: linear-gradient(#34353d, #292a31);
  --key-line: rgba(255, 255, 255, .13);
  --key-text: #c3c3cd;
  --key-hi: rgba(255, 255, 255, .08);
  --toast-bg: #f3f3f6;
  --toast-text: #17171b;
  --toast-sub: #6b6b76;
  --toast-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 10px 30px -6px rgba(0, 0, 0, .6), 0 3px 8px rgba(0, 0, 0, .3);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .07);
}

/* ------------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { display: block; flex: none; }
::selection { background: color-mix(in srgb, var(--accent-c) 28%, transparent); }
:focus-visible { outline: 2px solid var(--accent-c); outline-offset: 2px; }

html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
  transition: background-color .38s ease, color .38s ease, border-color .38s ease, fill .38s ease, stroke .38s ease, box-shadow .38s ease, outline-color .38s ease, caret-color .38s ease;
}

kbd {
  font: 600 11px/1 var(--font);
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 21px; height: 21px; padding: 0 6px;
  color: var(--key-text);
  background: var(--key-bg);
  border: 1px solid var(--key-line);
  border-bottom-width: 2px;
  border-radius: 6px;
  box-shadow: inset 0 1px 0 var(--key-hi);
  letter-spacing: .01em;
  white-space: nowrap;
}
.keys { display: inline-flex; gap: 3px; align-items: center; }

/* -------------------------------------------------------------- app shell */
.app {
  --sbw: 272px;
  display: grid;
  grid-template-columns: var(--sbw) minmax(0, 1fr);
  height: 100vh;
  transition: grid-template-columns .36s var(--ease-out);
}
.app.no-sidebar, .app.focus { --sbw: 0px; }

.sidebar { min-width: 0; overflow: hidden; background: var(--bg-side); }
.sb-inner {
  width: 272px; height: 100%;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
}
.sb-head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; flex: 1; min-width: 0; }
.logo {
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  display: grid; place-items: center; color: var(--on-accent);
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent-c) 82%, #fff), var(--accent-c));
  box-shadow: 0 1px 2px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .28);
}
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  color: var(--text-2); transition: background-color .15s, color .15s;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn:active { background: var(--press); }

.sb-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3);
}
.sb-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 12px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.note-list li { display: block; }
.note {
  position: relative; width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px; color: var(--text-2);
  transition: background-color .15s, color .15s;
}
.note:hover { background: var(--hover); color: var(--text); }
.note.active { background: var(--surface); color: var(--text); box-shadow: var(--card-shadow); }
.note.active::before {
  content: ""; position: absolute; left: -1px; top: 11px; bottom: 11px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-c);
}
.note-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--tile); color: var(--text-2); flex: none; transition: background-color .2s, color .2s; }
.note.active .note-ico { background: var(--accent-soft); color: var(--accent-ink); }
.note-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.note-title { font-weight: 560; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
.note-snip { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11px; color: var(--text-3); flex: none; }
.note-meta svg { color: var(--accent-c); }
.note-list li.enter { animation: note-in .42s var(--ease-out) backwards; overflow: hidden; }
@keyframes note-in { from { opacity: 0; max-height: 0; transform: translateX(-10px); } to { opacity: 1; max-height: 64px; transform: none; } }

.sb-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(145deg, #f59e0b, #e11d48); color: #fff; font-weight: 650; font-size: 11px; display: grid; place-items: center; flex: none; }
.sb-foot b { font-weight: 600; color: var(--text); display: block; line-height: 1.2; }
.sb-foot span.sub { font-size: 11.5px; color: var(--text-3); line-height: 1.2; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; background: var(--bg); }
.topbar { height: 54px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 14px; transition: opacity .3s; }
.crumbs-trail { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-3); font-size: 13px; }
.crumbs-trail b { font-weight: 560; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.search-btn {
  margin-left: auto; width: 300px; max-width: 46vw; height: 34px; padding: 0 6px 0 11px;
  display: flex; align-items: center; gap: 9px; border-radius: 10px;
  background: var(--surface); color: var(--text-3);
  box-shadow: var(--card-shadow);
  transition: box-shadow .2s, color .2s, transform .15s var(--ease-out);
}
.search-btn:hover { color: var(--text-2); box-shadow: 0 1px 3px rgba(24,24,40,.08), 0 0 0 1px var(--line-strong); }
.search-btn:active { transform: scale(.985); }
.search-btn .lbl { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.doc { flex: 1; min-height: 0; width: 100%; max-width: 780px; margin: 0 auto; padding: 22px 44px 8px; display: flex; flex-direction: column; transition: max-width .36s var(--ease-out); }
.app.focus .doc { max-width: 700px; }
.app.focus .topbar, .app.focus .statusbar { opacity: .35; }
.app.focus .topbar:hover, .app.focus .statusbar:hover { opacity: 1; }
.doc-title {
  width: 100%; border: 0; outline: 0; background: transparent; padding: 0;
  font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; color: var(--text);
}
.doc-title::placeholder { color: var(--text-3); }
.doc-meta { display: flex; align-items: center; gap: 8px; margin: 10px 0 18px; font-size: 12.5px; color: var(--text-3); }
.doc-meta .chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--tile); color: var(--text-2); font-weight: 520; }
.doc-meta .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-c); display: block; }
#editor {
  flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: 0; background: transparent; padding: 0 0 24px;
  font-size: calc(15.5px * var(--zoom)); line-height: 1.75; color: var(--text); letter-spacing: -.003em;
  caret-color: var(--accent-c);
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
#editor::placeholder { color: var(--text-3); }
.statusbar { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; color: var(--text-3); transition: opacity .3s; }
.statusbar .hintline { display: inline-flex; align-items: center; gap: 6px; }
.statusbar kbd { height: 18px; min-width: 18px; font-size: 10.5px; padding: 0 5px; }

/* ---------------------------------------------------------------- palette */
.pal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; justify-content: center; align-items: flex-start;
  padding: clamp(20px, 13vh, 140px) 16px 16px;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(5px) saturate(1.2); backdrop-filter: blur(5px) saturate(1.2);
  animation: ov-in .2s ease-out backwards;
}
.pal-overlay.closing { animation: ov-out .15s ease-in forwards; pointer-events: none; }
@keyframes ov-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes ov-out { from { opacity: 1; } to { opacity: 0; } }

.pal {
  width: 640px; max-width: 100%;
  display: flex; flex-direction: column;
  border-radius: 16px; overflow: hidden;
  background: var(--pal-bg);
  -webkit-backdrop-filter: blur(34px) saturate(1.8); backdrop-filter: blur(34px) saturate(1.8);
  box-shadow: var(--pal-shadow);
  transform-origin: 50% 20%;
  animation: pal-in .2s var(--ease-out) backwards;
}
.pal-overlay.closing .pal { animation: pal-out .15s cubic-bezier(.4, 0, 1, 1) forwards; }
@keyframes pal-in { from { opacity: 0; transform: translateY(-8px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes pal-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-4px) scale(.97); } }

.pal-head { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 16px 0 18px; border-bottom: 1px solid var(--pal-line); flex: none; }
.pal-head > svg { color: var(--text-3); }
.pal-input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0;
  font-size: 16.5px; letter-spacing: -.01em; color: var(--text); caret-color: var(--accent-c);
}
.pal-input::placeholder { color: var(--text-3); }
.pal-esc { flex: none; }
.pal-crumbs { display: flex; align-items: center; gap: 4px; flex: none; animation: crumb-in .24s var(--ease-out) backwards; }
.pal-crumbs .crumb { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 8px; font-size: 12.5px; font-weight: 560; white-space: nowrap; }
.pal-crumbs .crumb-root { color: var(--text-2); background: var(--tile); transition: background-color .15s, color .15s; }
.pal-crumbs .crumb-root:hover { background: var(--press); color: var(--text); }
.pal-crumbs .crumb-cur { color: var(--accent-ink); background: var(--accent-soft); }
.pal-crumbs svg { color: var(--text-3); }
@keyframes crumb-in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

.pal-body {
  position: relative; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  height: 0; scrollbar-width: none;
  transition: height .24s var(--ease-out);
  --mt: 0px; --mb: 0px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--mt), #000 calc(100% - var(--mb)), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 var(--mt), #000 calc(100% - var(--mb)), transparent 100%);
}
.pal-body::-webkit-scrollbar { display: none; }
.pal-inner { position: relative; padding: 6px 8px 8px; }
.pal-hl {
  position: absolute; left: 8px; right: 8px; top: 0; height: 40px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent-c) 11%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-c) 10%, transparent);
  transform: translateY(6px);
  transition: transform .22s var(--ease-out), height .22s var(--ease-out), opacity .15s ease, background-color .3s;
  pointer-events: none;
}
.pal-hl::before { content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-c); }
.pal-hl.off { opacity: 0; }

.grp-title { padding: 12px 10px 5px; font-size: 11px; font-weight: 600; letter-spacing: .065em; text-transform: uppercase; color: var(--text-3); height: 31px; }
.grp:first-child .grp-title { padding-top: 6px; height: 25px; }
.opt {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px 0 10px; border-radius: 10px;
  cursor: pointer; color: var(--text); font-size: 14px; letter-spacing: -.005em; user-select: none;
}
.opt-ico { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--tile); color: var(--text-2); transition: background-color .18s, color .18s; }
.opt[aria-selected="true"] .opt-ico { background: color-mix(in srgb, var(--accent-c) 17%, transparent); color: var(--accent-ink); }
.opt-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-weight: 480; }
.opt-kw { flex: none; max-width: 150px; height: 19px; padding: 0 7px; display: inline-flex; align-items: center; border-radius: 999px; font-size: 11px; color: var(--text-3); background: var(--tile); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .keys, .opt-meta { margin-left: auto; flex: none; }
.opt-meta { font: 500 12px var(--mono); color: var(--text-3); display: inline-flex; align-items: center; gap: 8px; }
.opt-meta svg { color: var(--accent-c); }
.swatch i { width: 14px; height: 14px; border-radius: 50%; background: var(--sw); display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 1px 2px rgba(0, 0, 0, .18); }
.opt[aria-selected="true"] .swatch { background: var(--tile); }
mark {
  background: color-mix(in srgb, var(--accent-c) 18%, transparent); color: var(--accent-ink);
  border-radius: 3px; padding: 0 1px; margin: 0 -1px; font-weight: 650;
}

.pal-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 34px 20px 36px; color: var(--text-3); animation: empty-in .3s var(--ease-out) backwards; }
.pal-empty .ei { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--tile); color: var(--text-2); margin-bottom: 8px; }
.pal-empty b { color: var(--text); font-size: 14.5px; font-weight: 600; }
.pal-empty span { font-size: 13px; max-width: 460px; overflow-wrap: anywhere; }
@keyframes empty-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.pal-foot { flex: none; height: 42px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-top: 1px solid var(--pal-line); background: var(--pal-foot); font-size: 12px; color: var(--text-3); }
.pal-foot .hint { display: inline-flex; align-items: center; gap: 6px; }
.pal-foot kbd { height: 19px; min-width: 19px; font-size: 10.5px; padding: 0 5px; }
.pal-foot .count { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ toasts */
.toasts { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.toast-wrap { display: grid; grid-template-rows: 1fr; animation: tw-in .34s var(--ease-out) backwards; }
.toast-clip { min-height: 0; overflow: clip; overflow-clip-margin: 34px; padding: 5px 0; }
.toast {
  display: flex; align-items: center; gap: 11px; min-width: 232px; max-width: 420px; padding: 10px 16px 10px 11px;
  border-radius: 14px; background: var(--toast-bg); color: var(--toast-text); box-shadow: var(--toast-shadow);
  animation: t-in .38s var(--ease-out) backwards;
}
.toast .ti { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent-c); color: var(--on-accent); }
.toast .tt { font-size: 13.5px; font-weight: 580; line-height: 1.25; letter-spacing: -.005em; }
.toast .td { font-size: 12px; color: var(--toast-sub); line-height: 1.25; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.toast .td i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.toast-wrap.leaving { grid-template-rows: 0fr; transition: grid-template-rows .24s var(--ease-io) .05s; }
.toast-wrap.leaving .toast { opacity: 0; transform: translateY(10px) scale(.95); transition: opacity .18s ease, transform .24s var(--ease-io); }
@keyframes tw-in { from { grid-template-rows: 0fr; } to { grid-template-rows: 1fr; } }
@keyframes t-in { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }

/* ----------------------------------------------------------- reduced motion */
@media (prefers-reduced-motion: reduce) {
  .app { transition: none; }
  .doc { transition: none; }
  .search-btn:active { transform: none; }
  .pal-overlay { animation: fade-in .12s linear backwards; }
  .pal-overlay.closing { animation: fade-out .12s linear forwards; }
  .pal { animation: fade-in .12s linear backwards; }
  .pal-overlay.closing .pal { animation: fade-out .12s linear forwards; }
  .pal-body { transition: none; }
  .pal-hl { transition: opacity .12s linear, background-color .3s; }
  .pal-crumbs { animation: fade-in .12s linear backwards; }
  .pal-empty { animation: fade-in .12s linear backwards; }
  .note-list li.enter { animation: fade-in .2s linear backwards; }
  .toast-wrap { animation: none; }
  .toast { animation: fade-in .15s linear backwards; }
  .toast-wrap.leaving { transition: none; }
  .toast-wrap.leaving .toast { transform: none; transition: opacity .15s linear; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  if (performance.now() - state.guardAt < 140 && e.movementX === 0 && e.movementY === 0) return;
  const i = +opt.dataset.index;
  if (i !== state.active) { state.active = i; applyActive({ scroll: false }); }
});
listEl.addEventListener('click', e => {
  const opt = e.target.closest('[role="option"]');
  if (!opt) return;
  state.active = +opt.dataset.index;
  execute(state.entries[state.active]);
});
input.addEventListener('input', () => { state.query = input.value; render(); });
input.addEventListener('blur', () => {
  if (!state.open) return;
  setTimeout(() => { if (state.open && document.activeElement !== input) input.focus({ preventScroll: true }); }, 0);
});
panel.addEventListener('mousedown', e => { if (e.target !== input) e.preventDefault(); });
$('#crumb-root').addEventListener('click', backToRoot);
let downOnOverlay = false;
overlay.addEventListener('mousedown', e => { downOnOverlay = e.target === overlay; });
overlay.addEventListener('click', e => { if (e.target === overlay && downOnOverlay) closePalette(); downOnOverlay = false; });
document.addEventListener('focusin', e => { if (state.open && !overlay.contains(e.target)) input.focus({ preventScroll: true }); });
window.addEventListener('resize', () => { if (state.open) setHeight(false); });

function onKey(e) {
  if (e.isComposing) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && (k.toLowerCase() === 'k' || e.code === 'KeyK')) {
    e.preventDefault(); e.stopPropagation();
    if (!e.repeat) togglePalette();
    return;
  }
  if (state.open) {
    switch (k) {
      case 'Escape': e.preventDefault(); if (state.page) backToRoot(); else closePalette(); break;
      case 'ArrowDown': e.preventDefault(); move(1); break;
      case 'ArrowUp': e.preventDefault(); move(-1); break;
      case 'Home': e.preventDefault(); setIndex(0); break;
      case 'End': e.preventDefault(); setIndex(state.options.length - 1); break;
      case 'PageDown': e.preventDefault(); setIndex(Math.min(state.options.length - 1, state.active + 6)); break;
      case 'PageUp': e.preventDefault(); setIndex(Math.max(0, state.active - 6)); break;
      case 'Enter': e.preventDefault(); if (!e.repeat && state.active >= 0) execute(state.entries[state.active]); break;
      case 'Tab': e.preventDefault(); input.focus({ preventScroll: true }); break;
      case 'Backspace': if (state.page && input.value === '') { e.preventDefault(); backToRoot(); } break;
      default: break;
    }
    return;
  }
  if (mod && e.shiftKey && !e.altKey && k.toLowerCase() === 'l') { e.preventDefault(); runById('toggle-dark-mode'); }
  else if (mod && !e.shiftKey && !e.altKey && k === '\\') { e.preventDefault(); runById('toggle-sidebar'); }
}
function runById(id) {
  const c = COMMANDS.find(x => x.id === id);
  recordRecent(id);
  const d = EFFECTS[id] && EFFECTS[id]();
  toast(c.title, d);
}
window.addEventListener('keydown', onKey, true);
$('#open-palette').addEventListener('click', openPalette);

/* ======================================================================= init */
paintPaletteKeys($('#open-keys'));
paintPaletteKeys($('#status-keys'));
renderNotes();
selectNote('welcome', true);
})();
</script>
