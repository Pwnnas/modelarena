<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vectorly — Vector Editor</title>
<style>
:root{
  --accent:#2d6bff; --accent-d:#1d54dd; --accent-soft:#eaf0ff; --accent-line:#c4d4ff;
  --text:#1a2030; --muted:#6a7389; --faint:#9aa2b5; --line:#e4e8f0; --panel:#ffffff;
  --stage:#f1f3f8; --hover:#eef1f7; --field:#f4f6fa; --danger:#e5484d;
  --shadow:0 6px 22px rgba(24,36,72,.10),0 1px 3px rgba(24,36,72,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:grid;
  grid-template-columns:58px minmax(0,1fr) 276px;
  grid-template-rows:52px minmax(0,1fr);
  grid-template-areas:"top top top" "tools stage props";
  overflow:hidden;background:var(--panel);color:var(--text);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input{-webkit-user-select:text;user-select:text}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.2px;margin-right:6px}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(140deg,#4f86ff,#6a4dff);box-shadow:0 2px 6px rgba(70,90,255,.35)}
.logo svg{width:18px;height:18px}
.vsep{width:1px;height:22px;background:var(--line);margin:0 8px}
.spacer{flex:1}
.ibtn{width:32px;height:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;color:#46506a;transition:background .12s,color .12s}
.ibtn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.ibtn:active:not(:disabled){background:#e3e8f2}
.ibtn:disabled{opacity:.35;cursor:default}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-right:8px}
.status i{width:7px;height:7px;border-radius:50%;background:#2fb67c;box-shadow:0 0 0 3px rgba(47,182,124,.16);transition:background .2s}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:8px;font-weight:600;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(30,70,200,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.primary:active{transform:translateY(.5px)}
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;z-index:50;white-space:pre;pointer-events:none;
  background:#161b2a;color:#fff;font-size:11.5px;font-weight:500;padding:5px 8px;border-radius:6px;
  opacity:0;transition:opacity .12s;transition-delay:0s;box-shadow:0 4px 12px rgba(0,0,0,.2)
}
[data-tip]:hover::after{opacity:1;transition-delay:.45s}
#topbar [data-tip]::after{top:calc(100% + 8px);left:50%;transform:translateX(-50%)}
#toolbar [data-tip]::after{left:calc(100% + 10px);top:50%;transform:translateY(-50%)}
.zoombar [data-tip]::after{bottom:calc(100% + 10px);left:50%;transform:translateX(-50%)}

/* ---------- toolbar ---------- */
#toolbar{grid-area:tools;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--panel);border-right:1px solid var(--line);z-index:4}
.tool{width:40px;height:40px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:#46506a;position:relative;transition:background .12s,color .12s,box-shadow .12s}
.tool svg.i{width:20px;height:20px}
.tool:hover{background:var(--hover);color:var(--text)}
.tool[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(45,107,255,.38)}
.tool kbd{position:absolute;right:4px;bottom:2px;font-size:8.5px;font-weight:600;line-height:1;font-family:inherit;opacity:.5}
.tool[aria-pressed="true"] kbd{opacity:.8}
.tsep{width:24px;height:1px;background:var(--line);margin:4px 0}

/* ---------- stage ---------- */
#stage-wrap{grid-area:stage;position:relative;overflow:hidden;background:var(--stage)}
#stage{
  position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none;
  background-color:var(--stage);
  background-image:radial-gradient(circle,rgba(70,84,122,.34) .9px,transparent 1.4px);
  background-size:20px 20px;
}
#overlay{pointer-events:none}
#overlay [data-handle]{pointer-events:all}
.float{position:absolute;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.zoombar{right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:3px}
.zoombar .ibtn{width:30px;height:30px}
#zoom-level{min-width:56px;height:30px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text)}
#zoom-level:hover{background:var(--hover)}
.zdiv{width:1px;height:18px;background:var(--line);margin:0 3px}
#hint{left:50%;bottom:14px;transform:translateX(-50%);padding:7px 14px;color:var(--muted);font-size:12px;white-space:nowrap;pointer-events:none;max-width:calc(100% - 340px);overflow:hidden;text-overflow:ellipsis}
#hint b{color:var(--text);font-weight:600}
#coords{left:14px;bottom:16px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;letter-spacing:.2px}
#empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;color:var(--muted);transition:opacity .2s}
#empty.hide{opacity:0}
#empty .eicon{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}
#empty .eicon svg{width:30px;height:30px}
#empty h2{margin:0 0 6px;font-size:17px;color:var(--text);font-weight:650}
#empty p{margin:0;font-size:13px;line-height:1.6}
#empty kbd,.help kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid #d6dbe7;border-bottom-width:2px;border-radius:5px;background:#fff;font-size:11px;font-weight:600;line-height:1.5;font-family:inherit;color:#3a4460;text-align:center}
#toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-14px);background:#161b2a;color:#fff;padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.help{right:14px;bottom:62px;width:288px;padding:14px 16px 12px;z-index:30}
.help[hidden]{display:none}
.help h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.help dl{display:grid;grid-template-columns:1fr auto;gap:7px 10px;margin:0;font-size:12.5px}
.help dt{color:#3b4560}
.help dd{margin:0;text-align:right;color:var(--muted);white-space:nowrap}

/* ---------- properties ---------- */
#props{grid-area:props;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4;overflow-y:auto}
.p-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.p-title{font-weight:700;font-size:13.5px;letter-spacing:-.1px}
.p-sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;align-items:center;gap:6px;min-height:16px}
.p-sec{padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.p-sec h3{margin:0 0 9px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.7px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;align-items:center;height:32px;background:var(--field);border:1px solid transparent;border-radius:8px;transition:border-color .12s,background .12s,box-shadow .12s;min-width:0}
.field:hover{border-color:var(--line);background:#f0f3f9}
.field:focus-within{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,107,255,.14)}
.field>span{width:26px;text-align:center;color:var(--faint);font-size:11.5px;font-weight:600;flex:none}
.field input{width:100%;min-width:0;height:100%;border:0;background:transparent;outline:none;font:inherit;color:var(--text);padding:0 8px 0 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input:disabled{color:var(--faint)}
.field.dis{opacity:.55}
.colorrow{display:flex;align-items:center;gap:8px}
.colorrow .field{flex:1}
.colorrow .field input{padding-left:10px;text-transform:uppercase;letter-spacing:.3px;font-size:12.5px}
input[type=color]{-webkit-appearance:none;appearance:none;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;flex:none;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:7px}
input[type=color]:hover{border-color:#c8cfdf}
.nonebtn{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--muted);flex:none;transition:all .12s}
.nonebtn:hover{background:var(--hover)}
.nonebtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.swatches{display:flex;gap:4px;margin-top:10px;justify-content:space-between}
.swatches button{width:20px;height:20px;border-radius:6px;border:1px solid rgba(0,0,0,.12);padding:0;transition:transform .1s}
.swatches button:hover{transform:scale(1.15)}
.swrow{display:flex;gap:8px;margin-top:9px;align-items:center}
.swrow label{color:var(--muted);font-size:12px;flex:1}
.swrow .field{width:96px}
.arrange{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.arrange.two{grid-template-columns:1fr 1fr;margin-top:6px}
.abtn{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;color:#3b4560;font-size:12px;font-weight:550;transition:background .12s,border-color .12s}
.abtn:hover:not(:disabled){background:var(--hover);border-color:#d3d9e6}
.abtn:disabled{opacity:.4;cursor:default}
.abtn.danger:hover:not(:disabled){background:#fff0f0;border-color:#f5c2c4;color:var(--danger)}
.abtn svg.i{width:16px;height:16px}
.p-sec.grow{flex:1;min-height:150px;border-bottom:0;display:flex;flex-direction:column}
#layers{list-style:none;margin:0 -6px;padding:0 6px 0 6px;overflow-y:auto;flex:1;min-height:0}
.layer{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;cursor:pointer;color:#2a3249}
.layer:hover{background:var(--hover)}
.layer.sel{background:var(--accent-soft);color:#1a47c4}
.layer svg.i{width:15px;height:15px;color:var(--muted)}
.layer.sel svg.i{color:var(--accent)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .sw{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:none}
.layer .sw.none{background:linear-gradient(135deg,transparent 45%,#e5484d 45%,#e5484d 55%,transparent 55%)!important}
.no-layers{color:var(--faint);text-align:center;padding:18px 0;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:550}
.badge svg.i{width:14px;height:14px;color:var(--accent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d5dae6;border-radius:6px;border:2px solid #fff}
::-webkit-scrollbar-thumb:hover{background:#bcc3d4}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M5 18C5 8.5 12.5 16 19 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="2.8" y="15.8" width="4.4" height="4.4" rx="1" fill="#fff"/><rect x="16.8" y="3.8" width="4.4" height="4.4" rx="1" fill="#fff"/></svg></span>
    <span>Vectorly</span>
  </div>
  <span class="vsep"></span>
  <button class="ibtn" id="undo" aria-label="Undo" data-tip="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ibtn" id="redo" aria-label="Redo" data-tip="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <div class="spacer"></div>
  <span class="status" id="save-status"><i></i><span>Saved</span></span>
  <button class="ibtn" id="help-btn" aria-label="Keyboard shortcuts" data-tip="Shortcuts  ?"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7"/><path d="M12 17h.01"/></svg></button>
  <button class="btn primary" id="export-svg" aria-label="Export SVG"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></svg>Export SVG</button>
</header>

<nav id="toolbar" aria-label="Tools">
  <button class="tool" data-tool="select" aria-label="Select" aria-pressed="true" data-tip="Select  V"><svg class="i" viewBox="0 0 24 24"><path d="M6 3.5v15.2l4.1-3.7 2.9 5.8 2.5-1.2-2.8-5.6H18.4z"/></svg><kbd>V</kbd></button>
  <div class="tsep"></div>
  <button class="tool" data-tool="rect" aria-label="Rectangle" aria-pressed="false" data-tip="Rectangle  R"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/></svg><kbd>R</kbd></button>
  <button class="tool" data-tool="ellipse" aria-label="Ellipse" aria-pressed="false" data-tip="Ellipse  E"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="7"/></svg><kbd>E</kbd></button>
  <button class="tool" data-tool="line" aria-label="Line" aria-pressed="false" data-tip="Line  L"><svg class="i" viewBox="0 0 24 24"><path d="M5.5 18.5 18.5 5.5"/><circle cx="5.5" cy="18.5" r="1.7" fill="currentColor"/><circle cx="18.5" cy="5.5" r="1.7" fill="currentColor"/></svg><kbd>L</kbd></button>
</nav>

<main id="stage-wrap">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-label="Drawing stage"><g id="overlay"></g></svg>
  <div id="empty">
    <div class="eicon"><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><rect x="3.5" y="9" width="9" height="9" rx="1.5"/><circle cx="16.5" cy="8.5" r="4.5"/><path d="M13 20.5 20.5 14"/></svg></div>
    <h2>Start drawing</h2>
    <p>Pick a tool &mdash; <kbd>R</kbd> rectangle &nbsp;<kbd>E</kbd> ellipse &nbsp;<kbd>L</kbd> line<br>then drag anywhere on the canvas.</p>
  </div>
  <div id="coords" class="coords">X 0 &nbsp; Y 0</div>
  <div id="hint" class="float"></div>
  <div class="float zoombar">
    <button class="ibtn" id="zoom-out" aria-label="Zoom out" data-tip="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoom-level" aria-label="Zoom level, click to reset to 100%">100%</button>
    <button class="ibtn" id="zoom-in" aria-label="Zoom in" data-tip="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="zdiv"></span>
    <button class="ibtn" id="zoom-fit" aria-label="Zoom to fit" data-tip="Fit content  ⇧1"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="help" class="float help" hidden>
    <h3>Keyboard shortcuts</h3>
    <dl id="help-list"></dl>
  </div>
  <div id="toast" role="status"></div>
</main>

<aside id="props" aria-label="Properties">
  <div class="p-head">
    <div class="p-title">Properties</div>
    <div class="p-sub" id="sel-label">Nothing selected</div>
  </div>

  <section class="p-sec">
    <h3>Position &amp; size</h3>
    <div class="grid2">
      <label class="field"><span>X</span><input type="number" id="prop-x" step="any" data-prop="x" aria-label="X"></label>
      <label class="field"><span>Y</span><input type="number" id="prop-y" step="any" data-prop="y" aria-label="Y"></label>
      <label class="field"><span>W</span><input type="number" id="prop-w" step="any" min="0" data-prop="w" aria-label="Width"></label>
      <label class="field"><span>H</span><input type="number" id="prop-h" step="any" min="0" data-prop="h" aria-label="Height"></label>
    </div>
  </section>

  <section class="p-sec">
    <h3>Fill</h3>
    <div class="colorrow">
      <input type="color" id="fill-color" value="#6c8cff" aria-label="Fill color">
      <label class="field"><input type="text" id="fill-hex" maxlength="7" spellcheck="false" aria-label="Fill hex"></label>
      <button class="nonebtn" id="fill-none" aria-pressed="false" aria-label="No fill" data-tip="No fill"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M5 19 19 5"/></svg></button>
    </div>
    <div class="swatches" id="palette"></div>
  </section>

  <section class="p-sec">
    <h3>Stroke</h3>
    <div class="colorrow">
      <input type="color" id="stroke-color" value="#1f2a5a" aria-label="Stroke color">
      <label class="field"><input type="text" id="stroke-hex" maxlength="7" spellcheck="false" aria-label="Stroke hex"></label>
      <button class="nonebtn" id="stroke-none" aria-pressed="false" aria-label="No stroke" data-tip="No stroke"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M5 19 19 5"/></svg></button>
    </div>
    <div class="swrow">
      <label for="stroke-width">Stroke width</label>
      <label class="field"><span>&#9644;</span><input type="number" id="stroke-width" min="0" max="500" step="any" value="2" aria-label="Stroke width"></label>
    </div>
  </section>

  <section class="p-sec">
    <h3>Arrange</h3>
    <div class="arrange">
      <button class="abtn" id="act-front" aria-label="Bring to front" data-tip="Bring to front"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h14M12 20V9M6.5 14.5 12 9l5.5 5.5"/></svg></button>
      <button class="abtn" id="act-forward" aria-label="Bring forward" data-tip="Bring forward  ]"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg></button>
      <button class="abtn" id="act-backward" aria-label="Send backward" data-tip="Send backward  ["><svg class="i" viewBox="0 0 24 24"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg></button>
      <button class="abtn" id="act-back" aria-label="Send to back" data-tip="Send to back"><svg class="i" viewBox="0 0 24 24"><path d="M5 20h14M12 4v11M6.5 9.5 12 15l5.5-5.5"/></svg></button>
    </div>
    <div class="arrange two">
      <button class="abtn" id="act-dup" aria-label="Duplicate"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>Duplicate</button>
      <button class="abtn danger" id="act-del" aria-label="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1.5 1.5 0 0 0 1.5 1.4h7A1.5 1.5 0 0 0 17 19l1-12M9 7V4.5A.5.5 0 0 1 9.5 4h5a.5.5 0 0 1 .5.5V7"/></svg>Delete</button>
    </div>
  </section>

  <section class="p-sec grow">
    <h3>Layers</h3>
    <ul id="layers"></ul>
  </section>
</aside>

<script>
(() => {
'use strict';

/* =====================================================================
   Constants & helpers
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const STORE_KEY = 'vectorly.doc.v1';
const ACCENT = '#2d6bff', GUIDE = '#ff3b7a';

    if (s.type === 'rect') return `  <rect x="${r3(s.x)}" y="${r3(s.y)}" width="${r3(s.w)}" height="${r3(s.h)}" ${paintAttr(s)}/>`;
    if (s.type === 'ellipse') return `  <ellipse cx="${r3(s.x + s.w / 2)}" cy="${r3(s.y + s.h / 2)}" rx="${r3(s.w / 2)}" ry="${r3(s.h / 2)}" ${paintAttr(s)}/>`;
    const e = lineEnds(s);
    return `  <line x1="${r3(e.x1)}" y1="${r3(e.y1)}" x2="${r3(e.x2)}" y2="${r3(e.y2)}" ${paintAttr(s)} stroke-linecap="round"/>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${x0} ${y0} ${W} ${H}">\n${body}\n</svg>\n`;
}
function exportSVG() {
  flushGesture();
  const blob = new Blob([buildSVG()], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'drawing.svg'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Exported drawing.svg');
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* =====================================================================
   Properties panel
   ===================================================================== */
const P = {
  x: $('#prop-x'), y: $('#prop-y'), w: $('#prop-w'), h: $('#prop-h'),
  fill: $('#fill-color'), fillHex: $('#fill-hex'), fillNone: $('#fill-none'),
  stroke: $('#stroke-color'), strokeHex: $('#stroke-hex'), strokeNone: $('#stroke-none'),
  sw: $('#stroke-width'), label: $('#sel-label')
};
function setVal(input, v, force) {
  if (!force && document.activeElement === input) return;
  if (input.value !== v) input.value = v;
}
function updatePanelGeom() {
  const list = selectedShapes(); const b = bboxOf(list);
  for (const k of ['x', 'y', 'w', 'h']) { P[k].disabled = !b; setVal(P[k], b ? r2(b[k]) : ''); P[k].parentElement.classList.toggle('dis', !b); }
}
function updatePanel(force) {
  const list = selectedShapes();
  updatePanelGeom();
  if (force) { const b = bboxOf(list); for (const k of ['x', 'y', 'w', 'h']) setVal(P[k], b ? r2(b[k]) : '', true); }
  // label
  if (!list.length) P.label.textContent = 'Nothing selected';
  else if (list.length === 1) P.label.innerHTML = `<span class="badge">${ICONS[list[0].type]}${esc(list[0].name)}</span>`;
  else P.label.innerHTML = `<span class="badge">${list.length} shapes selected</span>`;
  // style
  const src = list.length ? list : [doc.style];
  for (const prop of ['fill', 'stroke']) {
    const first = src[0][prop];
    const mixed = src.some(s => s[prop] !== first);
    const color = P[prop], hex = P[prop + 'Hex'], none = P[prop + 'None'];
    if (first !== 'none' && isHex(first)) color.value = first;
    none.setAttribute('aria-pressed', !mixed && first === 'none' ? 'true' : 'false');
    const txt = mixed ? '' : (first === 'none' ? 'None' : first.toUpperCase());
    setVal(hex, txt, force); hex.placeholder = mixed ? 'Mixed' : '';
  }
  const w0 = src[0].sw, wm = src.some(s => s.sw !== w0);
  setVal(P.sw, wm ? '' : r2(w0), force); P.sw.placeholder = wm ? 'Mixed' : '';
}
function setStyleProp(prop, val) {
  doc.style[prop] = val;
  const list = selectedShapes();
  if (list.length) {
    const g = beginGesture('style:' + prop);
    for (const s of list) if (s[prop] !== val) { s[prop] = val; paintStyle(els.get(s.id), s); }
    void g; scheduleLayers();
  }
  save(); updatePanel(); renderOverlay();
}
function bindStyle() {
  for (const prop of ['fill', 'stroke']) {
    const color = P[prop], hex = P[prop + 'Hex'], none = P[prop + 'None'];
    const onColor = () => { if (isHex(color.value)) setStyleProp(prop, color.value.toLowerCase()); };
    color.addEventListener('input', onColor);
    color.addEventListener('change', () => { onColor(); flushGesture(); });
    hex.addEventListener('change', () => {
      const h = normHex(hex.value);
      if (h) { color.value = h; setStyleProp(prop, h); }
      flushGesture(); updatePanel(true);
    });
    hex.addEventListener('keydown', e => { if (e.key === 'Enter') { hex.blur(); } });
    none.addEventListener('click', () => {
      flushGesture();
      const list = selectedShapes();
      const cur = list.length ? list[0][prop] : doc.style[prop];
      setStyleProp(prop, cur === 'none' ? (isHex(color.value) ? color.value.toLowerCase() : '#6c8cff') : 'none');
      flushGesture();
    });
  }
  const onSw = () => {
    const v = parseFloat(P.sw.value);
    if (!Number.isFinite(v)) return;
    setStyleProp('sw', clamp(v, 0, 500));
  };
  P.sw.addEventListener('input', onSw);
  P.sw.addEventListener('change', () => { onSw(); flushGesture(); updatePanel(true); });
  P.sw.addEventListener('keydown', e => { if (e.key === 'Enter') P.sw.blur(); });
}
function applyBox(list, orig, ob, nb) {
  for (const s of list) {
    const o = orig.get(s.id);
    if (ob.w > 1e-9) { const k = nb.w / ob.w; s.x = nb.x + (o.x - ob.x) * k; s.w = o.w * k; } else { s.x = nb.x + (o.x - ob.x); s.w = o.w + (nb.w - ob.w); }
    if (ob.h > 1e-9) { const k = nb.h / ob.h; s.y = nb.y + (o.y - ob.y) * k; s.h = o.h * k; } else { s.y = nb.y + (o.y - ob.y); s.h = o.h + (nb.h - ob.h); }
    paintGeom(els.get(s.id), s);
  }
}
function bindGeom() {
  for (const key of ['x', 'y', 'w', 'h']) {
    const input = P[key];
    input.addEventListener('input', () => {
      const v = parseFloat(input.value); if (!Number.isFinite(v)) return;
      const list = selectedShapes(); if (!list.length) return;
      const g = beginGesture('geom');
      if (!g.orig) { g.orig = new Map(list.map(s => [s.id, { ...s }])); g.ob = bboxOf(list); g.nb = { ...g.ob }; }
      const min = list.every(s => s.type === 'line') ? 0 : 1;
      g.nb[key] = (key === 'w' || key === 'h') ? Math.max(v, min) : v;
      applyBox(list, g.orig, g.ob, g.nb);
      renderOverlay(); updatePanelGeom();
    });
    input.addEventListener('change', () => { flushGesture(); updatePanel(true); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  }
}

/* ---- layers ---- */
let layersQueued = false;
function scheduleLayers() { if (layersQueued) return; layersQueued = true; requestAnimationFrame(renderLayers); }
function renderLayers() {
  layersQueued = false;
  const ul = $('#layers'), arr = doc.shapes, MAX = 250;
  if (!arr.length) { ul.innerHTML = '<li class="no-layers">No layers yet</li>'; return; }
  let html = '';
  for (let i = arr.length - 1, c = 0; i >= 0 && c < MAX; i--, c++) {
    const s = arr[i];
    const swc = s.type === 'line' ? s.stroke : s.fill;
    html += `<li class="layer${selection.has(s.id) ? ' sel' : ''}" data-layer="${s.id}">${ICONS[s.type]}<span class="nm">${esc(s.name)}</span><i class="sw${swc === 'none' ? ' none' : ''}" style="background:${swc === 'none' ? 'transparent' : swc}"></i></li>`;
  }
  if (arr.length > MAX) html += `<li class="no-layers">+ ${arr.length - MAX} more</li>`;
  ul.innerHTML = html;
}
function updateButtons() {
  $('#undo').disabled = hi <= 0;
  $('#redo').disabled = hi >= hist.length - 1;
  const has = selection.size > 0;
  for (const id of ['act-front', 'act-forward', 'act-backward', 'act-back', 'act-dup', 'act-del']) $('#' + id).disabled = !has;
}
function updateEmpty() { $('#empty').classList.toggle('hide', doc.shapes.length > 0); }

/* =====================================================================
   Keyboard
   ===================================================================== */
function isTyping(t) {
  if (!t || !t.tagName) return false;
  if (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return true;
  if (t.tagName === 'INPUT') {
    const ty = (t.type || 'text').toLowerCase();
    return !['color', 'checkbox', 'radio', 'button', 'range', 'submit', 'reset', 'file', 'image'].includes(ty);
  }
  return false;
}
let helpOpen = false;
function toggleHelp(force) {
  helpOpen = force === undefined ? !helpOpen : force;
  $('#help').hidden = !helpOpen;
}
function buildHelp() {
  const rows = [
    ['Select / Rectangle / Ellipse / Line', 'V  R  E  L'],
    ['Constrain (square, circle, 45°)', 'Shift'],
    ['Add to selection', 'Shift+click'],
    ['Select all', MOD + 'A'], ['Duplicate', MOD + 'D'],
    ['Copy / Paste', MOD + 'C / ' + MOD + 'V'],
    ['Undo / Redo', MOD + 'Z / ' + (IS_MAC ? '⇧⌘Z' : 'Ctrl+Y')],
    ['Nudge 1px / 10px', 'Arrows / Shift+Arrows'],
    ['Forward / Backward', '] / ['],
    ['Delete', 'Del'],
    ['Zoom', MOD + 'scroll / pinch'],
    ['Pan', 'Space+drag / middle-drag'],
    ['Zoom 100% / Fit', MOD + '0 / Shift+1'],
    ['Disable snapping', MOD + 'drag'],
    ['Resize from center', 'Alt+drag handle']
  ];
  $('#help-list').innerHTML = rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
}

function onKey(e) {
  const t = e.target, typing = isTyping(t);
  const m = e.ctrlKey || e.metaKey;
  const k = e.key, kl = k && k.length === 1 ? k.toLowerCase() : k;

  if (k === 'Escape') {
    if (helpOpen) { toggleHelp(false); return; }
    if (drag) { cancelDrag(); e.preventDefault(); return; }
    if (typing) { t.blur(); return; }
    if (tool !== 'select') { setTool('select'); return; }
    if (selection.size) setSelection([]);
    return;
  }
  if (k === 'Shift' || k === 'Alt' || k === 'Control' || k === 'Meta') { modifierChanged(e); return; }

  if (typing) {
    // allow document undo/redo from numeric fields (their native undo is of little use)
    if (m && t.type === 'number' && (kl === 'z' || kl === 'y')) {
      e.preventDefault(); if (kl === 'y' || e.shiftKey) redo(); else undo(); updatePanel(true);
    }
    return;
  }
  if (e.code === 'Space' || k === ' ') {
    e.preventDefault();
    if (!spaceDown) { spaceDown = true; setHover(null); updateCursor(); }
    return;
  }
  if (drag) return;
  flushGesture();

  if (m) {
    switch (kl) {
      case 'z': e.preventDefault(); if (e.shiftKey) redo(); else undo(); return;
      case 'y': e.preventDefault(); redo(); return;
      case 'a': e.preventDefault(); selectAll(); return;
      case 'd': e.preventDefault(); duplicateSelection(); return;
      case 'c': e.preventDefault(); copySel(false); return;
      case 'x': e.preventDefault(); copySel(true); return;
      case 'v': e.preventDefault(); pasteClip(); return;
      case '=': case '+': e.preventDefault(); zoomStep(1); return;
      case '-': case '_': e.preventDefault(); zoomStep(-1); return;
      case '0': e.preventDefault(); zoomAt(1, view.w / 2, view.h / 2); return;
      case ']': e.preventDefault(); reorder('front'); return;
      case '[': e.preventDefault(); reorder('back'); return;
    }
    return;
  }
  if (e.altKey) return;
  if (e.code === 'BracketRight' || k === ']') { e.preventDefault(); reorder('forward'); return; }
  if (e.code === 'BracketLeft' || k === '[') { e.preventDefault(); reorder('backward'); return; }
  if (e.code === 'Digit1' && e.shiftKey) { e.preventDefault(); zoomFit(false); return; }
  if (e.code === 'Digit2' && e.shiftKey) { e.preventDefault(); zoomFit(true); return; }
  switch (kl) {
    case 'v': setTool('select'); break;
    case 'r': setTool('rect'); break;
    case 'e': setTool('ellipse'); break;
    case 'l': setTool('line'); break;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSelection(); break;
    case 'ArrowLeft': e.preventDefault(); nudge(e.shiftKey ? -10 : -1, 0, e.repeat); break;
    case 'ArrowRight': e.preventDefault(); nudge(e.shiftKey ? 10 : 1, 0, e.repeat); break;
    case 'ArrowUp': e.preventDefault(); nudge(0, e.shiftKey ? -10 : -1, e.repeat); break;
    case 'ArrowDown': e.preventDefault(); nudge(0, e.shiftKey ? 10 : 1, e.repeat); break;
    case '?': toggleHelp(); break;
  }
}
function onKeyUp(e) {
  if (e.code === 'Space' || e.key === ' ') { spaceDown = false; updateCursor(); if (!drag) hoverRefresh(); return; }
  if (e.key === 'Shift' || e.key === 'Alt' || e.key === 'Control' || e.key === 'Meta') modifierChanged(e);
}
let lastPtr = null;
function modifierChanged(e) {
  if (!drag || !lastPtr || drag.type === 'pan') return;
  stepDrag({ clientX: lastPtr.clientX, clientY: lastPtr.clientY, shiftKey: e.shiftKey, altKey: e.altKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey, target: stage });
}

/* =====================================================================
   Init
   ===================================================================== */
function resizeStage() {
  stageRect = stage.getBoundingClientRect();
  view.w = stageRect.width; view.h = stageRect.height;
  applyView();
}

function init() {
  buildOverlay();
  loadDoc();
  reindex();
  syncAll();
  hist.push({ json: snap(), selBefore: [], selAfter: [], key: null }); hi = 0;

  // palette
  $('#palette').innerHTML = PALETTE.map(c => `<button style="background:${c}" data-c="${c}" aria-label="Fill ${c}"></button>`).join('');
  $('#palette').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    flushGesture(); setStyleProp('fill', b.dataset.c); flushGesture();
  });

  // tooltips with platform shortcuts
  $('#undo').dataset.tip = 'Undo  ' + MOD + 'Z';
  $('#redo').dataset.tip = 'Redo  ' + (IS_MAC ? '⇧⌘Z' : 'Ctrl+Y');
  buildHelp();

  // tools
  document.querySelectorAll('.tool').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { setTool(b.dataset.tool); b.blur(); });
  });
  const press = (id, fn) => { const b = $('#' + id); b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', () => { flushGesture(); fn(); b.blur(); }); };
  press('undo', undo); press('redo', redo);
  press('act-front', () => reorder('front')); press('act-forward', () => reorder('forward'));
  press('act-backward', () => reorder('backward')); press('act-back', () => reorder('back'));
  press('act-dup', duplicateSelection); press('act-del', deleteSelection);
  press('zoom-in', () => zoomStep(1)); press('zoom-out', () => zoomStep(-1));
  press('zoom-fit', () => zoomFit(false)); press('zoom-level', () => zoomAt(1, view.w / 2, view.h / 2));
  press('help-btn', () => toggleHelp());
  $('#export-svg').addEventListener('mousedown', e => e.preventDefault());
  $('#export-svg').addEventListener('click', e => { exportSVG(); e.currentTarget.blur(); });

  bindStyle(); bindGeom();
  $('#props').addEventListener('focusout', () => setTimeout(() => { if (!isTyping(document.activeElement) && document.activeElement !== P.fill && document.activeElement !== P.stroke) flushGesture(); }, 0));

  $('#layers').addEventListener('click', e => {
    const li = e.target.closest('[data-layer]'); if (!li) return;
    flushGesture();
    const id = li.getAttribute('data-layer');
    if (e.shiftKey) setSelection(selection.has(id) ? [...selection].filter(x => x !== id) : [...selection, id]);
    else setSelection([id]);
  });

  // stage
  stage.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', e => { lastPtr = e; onMove(e); });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  stage.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
  stage.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('pointerleave', () => { if (!drag) setHover(null); });
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { spaceDown = false; updateCursor(); });
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  document.addEventListener('mousedown', e => { if (helpOpen && !e.target.closest('#help') && !e.target.closest('#help-btn')) toggleHelp(false); });
  // Chrome page-zoom shortcuts shouldn't fight the editor
  window.addEventListener('gesturestart', e => e.preventDefault());

  new ResizeObserver(resizeStage).observe(wrap);
  setTool('select');
  resizeStage();
  updateEmpty(); updateButtons(); updatePanel(true); renderLayers();
  document.body.dataset.ready = '1';
}
init();
})();
</script>
</body>
</html>
