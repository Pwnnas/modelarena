<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f1a;color:#e0e0f0}

#palette button:hover{background:#3a3a5a}

#inspector{width:210px;background:#16162a;border-left:1px solid #2a2a4a;padding:12px;overflow-y:auto;font-size:12px}
#inspector h3{font-size:13px;margin-bottom:8px;color:#8888cc}
#inspector label{display:block;margin:6px 0 2px;color:#8888aa}
#inspector input{width:100%;background:#1a1a2e;color:#e0e0f0;border:1px solid #3a3a5a;border-radius:4px;padding:4px 8px;font-size:12px}
#inspector .node-type{font-size:14px;font-weight:bold;color:#aaaaff;margin-bottom:4px}
#inspector .node-id{font-size:11px;color:#6666aa;margin-bottom:8px}
#bottom{display:flex;gap:8px;padding:8px;background:#1a1a2e;border-top:1px solid #2a2a4a;height:180px;overflow:hidden}
#bottom-left{flex:1;display:flex;flex-direction:column;gap:4px}
#status{font-size:11px;color:#8888aa;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status[data-error="import"]{color:#ff6644}
#status[data-error="truth-unsupported"]{color:#ff6644}
#json{flex:1;background:#0d0d18;color:#a0a0c0;border:1px solid #2a2a4a;border-radius:4px;padding:6px;font-family:'Consolas','Monaco',monospace;font-size:11px;resize:none}
#bottom-right{width:320px;display:flex;flex-direction:column;gap:4px}

.port-ind{cursor:crosshair;transition:opacity .15s}

<body>
<div id="app">
<div id="topbar">

<div class="sep"></div>

<button id="run" aria-pressed="false">Run</button>
<button id="reset-state">Reset State</button>
<div class="sep"></div>
<button id="zoom-in">Zoom +</button>
<button id="zoom-out">Zoom −</button>
<button id="fit">Fit</button>
<div class="sep"></div>
<button id="import">Import</button>
<button id="export">Export</button>

<button id="demo-btn">Demo</button>
<div class="sep"></div>
<label>Step:</label><input type="number" id="step-count" value="1" min="1" max="4096">
<label>Tick:</label><span id="tick">0</span>
</div>
<div id="main">
<div id="palette">
<button data-add="INPUT">INPUT</button>
<button data-add="CLOCK">CLOCK</button>

<button data-add="AND">AND</button>
<button data-add="OR">OR</button>
<button data-add="XOR">XOR</button>
<button data-add="MUX">MUX</button>
<button data-add="TRI">TRI</button>
<button data-add="ADD">ADD</button>
<button data-add="DFF">DFF</button>

<script>
(function(){
"use strict";

// ===== CONSTANTS =====
const NODE_W = 120;
const PORT_SPACING = 18;
const PORT_R = 7;

const PORT_DEFS = {
  INPUT:{inputs:[],outputs:['out']},
  CLOCK:{inputs:[],outputs:['out']},
  NOT:{inputs:['in'],outputs:['out']},
  AND:{inputs:['a','b'],outputs:['out']},
  OR:{inputs:['a','b'],outputs:['out']},
  XOR:{inputs:['a','b'],outputs:['out']},
  MUX:{inputs:['a','b','s'],outputs:['out']},
  TRI:{inputs:['in','en'],outputs:['out']},
  ADD:{inputs:['a','b'],outputs:['out']},
  DFF:{inputs:['d','clk','rst'],outputs:['out']},
  RAM:{inputs:['addr','din','we','clk'],outputs:['out']},
  PROBE:{inputs:['in'],outputs:[]}
};

const FIXED_PORT_W = {
  MUX:{s:1},
  TRI:{en:1},
  DFF:{clk:1,rst:1},
  RAM:{addr:4,we:1,clk:1}
};

function getPortWidth(nodeType, portName, nodeWidth){
  if(FIXED_PORT_W[nodeType] && FIXED_PORT_W[nodeType][portName] !== undefined) return FIXED_PORT_W[nodeType][portName];
  return nodeWidth;
}

function getNodeHeight(nodeType){
  const n = PORT_DEFS[nodeType].inputs.length;
  return 30 + Math.max(1, n) * PORT_SPACING;
}

// ===== STATE =====
let doc = {nodes:[], wires:[]};
let sim = {tick:0, outputs:{}, memory:{}, clocks:{}, probes:{}};
let view = {x:50, y:50, scale:1};
let selection = null;
let running = false;
let historyStack = [];
let historyIdx = -1;
let idCounter = 0;
let runRAF = null;
let lastRunTime = 0;
let saveTimer = null;

// ===== ID GENERATION =====
function genId(prefix){
  let id;
  do { id = prefix + (idCounter++); } while(nodeExists(id) || wireExists(id));
  return id;
}
function nodeExists(id){ return doc.nodes.some(n=>n.id===id); }
function wireExists(id){ return doc.wires.some(w=>w.id===id); }

// ===== DOCUMENT VALIDATION =====
function validateDocument(d){
  if(!d || typeof d !== 'object') return 'Invalid document: not an object';
  if(d.version !== 1) return 'Invalid document: version must be 1';
  if(!Array.isArray(d.nodes) || !Array.isArray(d.wires)) return 'Invalid document: nodes and wires must be arrays';
  const idRe = /^[A-Za-z0-9_-]+$/;
  const nodeIds = new Set();
  const wireIds = new Set();
  for(const n of d.nodes){
    if(!n.id || typeof n.id !== 'string' || !idRe.test(n.id)) return 'Invalid node ID: ' + (n.id||'undefined');
    if(nodeIds.has(n.id)) return 'Duplicate node ID: ' + n.id;
    nodeIds.add(n.id);
    if(!n.type || !PORT_DEFS[n.type]) return 'Invalid node type: ' + n.type;
    if(typeof n.x !== 'number' || !isFinite(n.x)) return 'Node ' + n.id + ': x must be finite';
    if(typeof n.y !== 'number' || !isFinite(n.y)) return 'Node ' + n.id + ': y must be finite';
    if(!Number.isInteger(n.width) || n.width < 1 || n.width > 8) return 'Node ' + n.id + ': width must be integer 1-8';
    if(n.type === 'INPUT'){
      if(typeof n.value !== 'string' || n.value.length !== n.width) return 'Node ' + n.id + ': INPUT value must be exactly width chars';
      if(!/^[01XZ]+$/.test(n.value)) return 'Node ' + n.id + ': INPUT value must be 0,1,X,Z chars';
    }
    if(n.type === 'CLOCK'){
      if(n.width !== 1) return 'Node ' + n.id + ': CLOCK must have width 1';
      if(!Number.isInteger(n.period) || n.period < 1 || n.period > 32) return 'Node ' + n.id + ': CLOCK period must be integer 1-32';
    }
  }
  for(const w of d.wires){
    if(!w.id || typeof w.id !== 'string' || !idRe.test(w.id)) return 'Invalid wire ID: ' + (w.id||'undefined');
    if(wireIds.has(w.id)) return 'Duplicate wire ID: ' + w.id;
    wireIds.add(w.id);
    if(!w.from || !w.to) return 'Wire ' + w.id + ': must have from and to';
    if(!nodeIds.has(w.from.node)) return 'Wire ' + w.id + ': source node not found: ' + w.from.node;
    if(!nodeIds.has(w.to.node)) return 'Wire ' + w.id + ': dest node not found: ' + w.to.node;
    if(w.from.port !== 'out') return 'Wire ' + w.id + ': source port must be "out"';
    const srcNode = d.nodes.find(n=>n.id===w.from.node);
    const dstNode = d.nodes.find(n=>n.id===w.to.node);
    if(!PORT_DEFS[srcNode.type].outputs.includes('out')) return 'Wire ' + w.id + ': source node has no output';
    if(!PORT_DEFS[dstNode.type].inputs.includes(w.to.port)) return 'Wire ' + w.id + ': dest port not found: ' + w.to.port;
    const sw = getPortWidth(srcNode.type, 'out', srcNode.width);
    const dw = getPortWidth(dstNode.type, w.to.port, dstNode.width);
    if(sw !== dw) return 'Wire ' + w.id + ': width mismatch (' + sw + ' vs ' + dw + ')';
    const dup = d.wires.some(w2 => w2.from.node===w.from.node && w2.from.port===w.from.port && w2.to.node===w.to.node && w2.to.port===w.to.port);
    if(dup) return 'Wire ' + w.id + ': duplicate connection';
  }
  return null;
}

// ===== SIMULATION =====
function createSimState(d){
  const s = {tick:0, outputs:{}, memory:{}, clocks:{}, probes:{}};
  for(const n of d.nodes){
    if(n.type === 'PROBE') continue;
    if(n.type === 'INPUT') s.outputs[n.id] = n.value;
    else if(n.type === 'CLOCK') s.outputs[n.id] = '0';
    else if(n.type === 'DFF'){ s.outputs[n.id] = '0'.repeat(n.width); s.clocks[n.id] = '0'; }
    else if(n.type === 'RAM'){ s.outputs[n.id] = '0'.repeat(n.width); s.clocks[n.id] = '0'; s.memory[n.id] = Array(16).fill('0'.repeat(n.width)); }
    else s.outputs[n.id] = 'X'.repeat(n.width);
  }
  for(const n of d.nodes.filter(n=>n.type==='PROBE')){
    s.probes[n.id] = resolveInput(n.id, 'in', s.outputs, d.wires, n.width);
  }
  return s;
}

function resetSim(){
  sim = createSimState(doc);
  running = false;
  stopRun();
  updateRunButton();
}

function resolveInput(nodeId, portName, outputs, wires, width){
  const drivers = wires.filter(w => w.to.node === nodeId && w.to.port === portName);
  if(drivers.length === 0) return 'Z'.repeat(width);
  const result = [];
  for(let i=0; i<width; i++){
    const bits = drivers.map(w => (outputs[w.from.node] || 'X'.repeat(width))[i]);
    const nonZ = bits.filter(b => b !== 'Z');
    if(nonZ.length === 0) result.push('Z');
    else if(nonZ.includes('X')) result.push('X');
    else if(nonZ.includes('0') && nonZ.includes('1')) result.push('X');
    else result.push(nonZ[0]);
  }
  return result.join('');
}

function gateNOT(inp){
  return inp.split('').map(c => c==='0'?'1':c==='1'?'0':'X').join('');
}
function gateAND(a,b){
  const r=[];
  for(let i=0;i<a.length;i++){
    const x=a[i]==='Z'?'X':a[i], y=b[i]==='Z'?'X':b[i];
    if(x==='0'||y==='0') r.push('0');
    else if(x==='1'&&y==='1') r.push('1');
    else r.push('X');
  }
  return r.join('');
}
function gateOR(a,b){
  const r=[];
  for(let i=0;i<a.length;i++){
    const x=a[i]==='Z'?'X':a[i], y=b[i]==='Z'?'X':b[i];
    if(x==='1'||y==='1') r.push('1');
    else if(x==='0'&&y==='0') r.push('0');
    else r.push('X');
  }
  return r.join('');
}
function gateXOR(a,b){
  const r=[];
  for(let i=0;i<a.length;i++){
    const x=a[i]==='Z'?'X':a[i], y=b[i]==='Z'?'X':b[i];
    if((x==='0'||x==='1')&&(y==='0'||y==='1')) r.push(x===y?'0':'1');
    else r.push('X');
  }
  return r.join('');
}
function gateADD(a,b,w){
  if(a.includes('X')||a.includes('Z')||b.includes('X')||b.includes('Z')) return 'X'.repeat(w);
  const va=parseInt(a,2), vb=parseInt(b,2);
  return ((va+vb)%(1<<w)).toString(2).padStart(w,'0');
}
function gateMUX(a,b,s){
  if(s==='0') return a;
  if(s==='1') return b;
  const r=[];
  for(let i=0;i<a.length;i++) r.push(a[i]===b[i]?a[i]:'X');
  return r.join('');
}
function gateTRI(inp,en){
  if(en==='0') return 'Z'.repeat(inp.length);
  if(en==='1') return inp;
  const r=[];
  for(let i=0;i<inp.length;i++) r.push(inp[i]==='Z'?'Z':'X');
  return r.join('');
}

function doTick(){
  const tickBefore = sim.tick;
  const snap = {};
  for(const id in sim.outputs) snap[id] = sim.outputs[id];

  const newOutputs = {};
  const newMemory = {};
  const newClocks = {};
  const newTick = tickBefore + 1;

  for(const node of doc.nodes){
    if(node.type === 'PROBE') continue;
    if(node.type === 'INPUT'){
      newOutputs[node.id] = node.value;
    } else if(node.type === 'CLOCK'){
      newOutputs[node.id] = (Math.floor(newTick / node.period) % 2 === 0) ? '0' : '1';
    } else if(node.type === 'NOT'){
      const inp = resolveInput(node.id, 'in', snap, doc.wires, node.width);
      newOutputs[node.id] = gateNOT(inp);
    } else if(node.type === 'AND'){
      const a = resolveInput(node.id, 'a', snap, doc.wires, node.width);
      const b = resolveInput(node.id, 'b', snap, doc.wires, node.width);
      newOutputs[node.id] = gateAND(a, b);
    } else if(node.type === 'OR'){
      const a = resolveInput(node.id, 'a', snap, doc.wires, node.width);
      const b = resolveInput(node.id, 'b', snap, doc.wires, node.width);
      newOutputs[node.id] = gateOR(a, b);
    } else if(node.type === 'XOR'){
      const a = resolveInput(node.id, 'a', snap, doc.wires, node.width);
      const b = resolveInput(node.id, 'b', snap, doc.wires, node.width);
      newOutputs[node.id] = gateXOR(a, b);
    } else if(node.type === 'MUX'){
      const a = resolveInput(node.id, 'a', snap, doc.wires, node.width);
      const b = resolveInput(node.id, 'b', snap, doc.wires, node.width);
      const s = resolveInput(node.id, 's', snap, doc.wires, 1);
      newOutputs[node.id] = gateMUX(a, b, s);
    } else if(node.type === 'TRI'){
      const inp = resolveInput(node.id, 'in', snap, doc.wires, node.width);
      const en = resolveInput(node.id, 'en', snap, doc.wires, 1);
      newOutputs[node.id] = gateTRI(inp, en);
    } else if(node.type === 'ADD'){
      const a = resolveInput(node.id, 'a', snap, doc.wires, node.width);
      const b = resolveInput(node.id, 'b', snap, doc.wires, node.width);
      newOutputs[node.id] = gateADD(a, b, node.width);
    } else if(node.type === 'DFF'){
      const d = resolveInput(node.id, 'd', snap, doc.wires, node.width);
      const clkRaw = resolveInput(node.id, 'clk', snap, doc.wires, 1);
      const rstRaw = resolveInput(node.id, 'rst', snap, doc.wires, 1);
      const clk = clkRaw === 'Z' ? 'X' : clkRaw;
      const old = (sim.clocks[node.id] || '0') === 'Z' ? 'X' : (sim.clocks[node.id] || '0');
      const prevOut = snap[node.id] || '0'.repeat(node.width);

      let output;
      if(rstRaw === '1'){
        output = '0'.repeat(node.width);
      } else if(rstRaw === 'X' || rstRaw === 'Z'){
        output = 'X'.repeat(node.width);
      } else {
        const definite = (old === '0' && clk === '1');
        const possible = (old !== '1' && clk !== '0') && !definite;
        if(definite){
          output = d.split('').map(c => c==='Z'?'X':c).join('');
        } else if(possible){
          output = 'X'.repeat(node.width);
        } else {
          output = prevOut;
        }
      }
      newOutputs[node.id] = output;
      newClocks[node.id] = clk;
    } else if(node.type === 'RAM'){
      const addrRaw = resolveInput(node.id, 'addr', snap, doc.wires, 4);
      const dinRaw = resolveInput(node.id, 'din', snap, doc.wires, node.width);
      const weRaw = resolveInput(node.id, 'we', snap, doc.wires, 1);
      const clkRaw = resolveInput(node.id, 'clk', snap, doc.wires, 1);
      const clk = clkRaw === 'Z' ? 'X' : clkRaw;
      const old = (sim.clocks[node.id] || '0') === 'Z' ? 'X' : (sim.clocks[node.id] || '0');
      const prevOut = snap[node.id] || '0'.repeat(node.width);
      const mem = sim.memory[node.id] || Array(16).fill('0'.repeat(node.width));
      const newMem = [...mem];

      const definite = (old === '0' && clk === '1');
      const possible = (old !== '1' && clk !== '0') && !definite;
      const isBinAddr = /^[01]+$/.test(addrRaw);
      const dinNorm = dinRaw.split('').map(c => c==='Z'?'X':c).join('');

      let output;
      if(definite){
        if(!isBinAddr) output = 'X'.repeat(node.width);
        else output = newMem[parseInt(addrRaw,2)];
      } else if(possible){
        output = 'X'.repeat(node.width);
      } else {
        output = prevOut;
      }

      if(weRaw !== '0'){
        if(definite && isBinAddr && weRaw === '1'){
          newMem[parseInt(addrRaw,2)] = dinNorm;
        } else if((definite || possible) && weRaw !== '0'){
          if(isBinAddr){
            const idx = parseInt(addrRaw,2);
            newMem[idx] = mergeWords(newMem[idx], dinNorm);
          } else {
            for(let i=0;i<16;i++) newMem[i] = mergeWords(newMem[i], dinNorm);
          }
        }
      }

      newOutputs[node.id] = output;
      newMemory[node.id] = newMem;
      newClocks[node.id] = clk;
    }
  }

  sim.outputs = newOutputs;
  sim.memory = newMemory;
  sim.clocks = newClocks;
  sim.tick = newTick;

  sim.probes = {};
  for(const node of doc.nodes.filter(n=>n.type==='PROBE')){
    sim.probes[node.id] = resolveInput(node.id, 'in', newOutputs, doc.wires, node.width);
  }
}

function mergeWords(a, b){
  const r=[];
  for(let i=0;i<a.length;i++) r.push(a[i]===b[i]?a[i]:'X');
  return r.join('');
}

// ===== HISTORY =====
function pushHistory(){
  historyStack = historyStack.slice(0, historyIdx + 1);
  historyStack.push(deepCopy(doc));
  if(historyStack.length > 100) historyStack.shift();
  historyIdx = historyStack.length - 1;
  resetSim();
  scheduleSave();
}

function undo(){
  if(historyIdx <= 0) return;
  historyIdx--;
  doc = deepCopy(historyStack[historyIdx]);
  selection = null;
  resetSim();
  render();
  scheduleSave();
}

function redo(){
  if(historyIdx >= historyStack.length - 1) return;
  historyIdx++;
  doc = deepCopy(historyStack[historyIdx]);
  selection = null;
  resetSim();
  render();
  scheduleSave();
}

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

// ===== RENDERING =====
const svg = document.getElementById('workspace');
const scene = document.getElementById('scene');
const container = document.getElementById('workspace-container');

function worldToScreen(wx, wy){
  return {x: view.x + wx * view.scale, y: view.y + wy * view.scale};
}
function screenToWorld(sx, sy){
  return {x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale};
}

function getPortPos(node, portName, isOutput){
  const h = getNodeHeight(node.type);
  const inputs = PORT_DEFS[node.type].inputs;
  if(isOutput){
    return {x: node.x + NODE_W, y: node.y + h/2};
  }
  const idx = inputs.indexOf(portName);
  const n = inputs.length;
  const y = node.y + h/2 + (idx - (n-1)/2) * PORT_SPACING;
  return {x: node.x, y: y};
}

function signalColor(val){
  if(!val) return '#777';
  if(val.includes('X')) return '#ff6644';
  if(val.includes('Z')) return '#777788';
  if(val.includes('1') && val.includes('0')) return '#ffaa44';
  if(val === '1'.repeat(val.length)) return '#4aff6a';
  if(val === '0'.repeat(val.length)) return '#4a9eff';
  return '#4aff6a';
}

function charClass(c){ return 'c' + c; }

function render(){
  scene.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.scale})`);
  renderWires();
  renderNodes();
  renderInspector();
  document.getElementById('tick').textContent = sim.tick;
}

function renderWires(){
  const wireGroup = document.getElementById('wire-group');
  if(wireGroup) wireGroup.remove();
  const wg = document.createElementNS('http://www.w3.org/2000/svg','g');
  wg.id = 'wire-group';
  scene.insertBefore(wg, scene.firstChild);

  for(const w of doc.wires){
    const srcNode = doc.nodes.find(n=>n.id===w.from.node);
    const dstNode = doc.nodes.find(n=>n.id===w.to.node);
    if(!srcNode || !dstNode) continue;
    const sp = getPortPos(srcNode, 'out', true);
    const dp = getPortPos(dstNode, w.to.port, false);
    const color = signalColor(sim.outputs[srcNode.id] || 'X');

    const dx = Math.max(40, Math.abs(dp.x - sp.x) * 0.4);
    const d = `M ${sp.x} ${sp.y} C ${sp.x+dx} ${sp.y}, ${dp.x-dx} ${dp.y}, ${dp.x} ${dp.y}`;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'wire-path');
    path.setAttribute('stroke', color);
    path.setAttribute('data-wire', w.id);
    wg.appendChild(path);

    const arrowX = dp.x - 6;
    const arrowY = dp.y;
    const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arrow.setAttribute('points', `${arrowX},${arrowY-4} ${arrowX+8},${arrowY} ${arrowX},${arrowY+4}`);
    arrow.setAttribute('fill', color);
    wg.appendChild(arrow);
  }
}

function renderNodes(){
  const nodeGroup = document.getElementById('node-group');
  if(nodeGroup) nodeGroup.remove();
  const ng = document.createElementNS('http://www.w3.org/2000/svg','g');
  ng.id = 'node-group';
  scene.appendChild(ng);

  for(const node of doc.nodes){
    const h = getNodeHeight(node.type);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-node', node.id);
    g.setAttribute('aria-selected', selection === node.id ? 'true' : 'false');

    const body = document.createElementNS('http://www.w3.org/2000/svg','rect');
    body.setAttribute('x', node.x);
    body.setAttribute('y', node.y);
    body.setAttribute('width', NODE_W);
    body.setAttribute('height', h);
    body.setAttribute('rx', 6);
    body.setAttribute('class', 'node-body' + (selection === node.id ? ' selected' : ''));
    body.setAttribute('data-title', '');
    g.appendChild(body);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', node.x + 8);
    label.setAttribute('y', node.y + 14);
    label.setAttribute('class', 'node-label');
    label.textContent = node.type;
    g.appendChild(label);

    const val = node.type === 'PROBE' ? (sim.probes[node.id] || 'Z'.repeat(node.width)) : (sim.outputs[node.id] || 'X'.repeat(node.width));
    const valText = document.createElementNS('http://www.w3.org/2000/svg','text');
    valText.setAttribute('x', node.x + NODE_W/2);
    valText.setAttribute('y', node.y + h - 10);
    valText.setAttribute('class', 'node-value ' + charClass(val[0]||'X'));
    valText.setAttribute('data-value', node.id);
    valText.textContent = val;
    g.appendChild(valText);

    const inputs = PORT_DEFS[node.type].inputs;
    for(let i=0;i<inputs.length;i++){
      const pn = inputs[i];
      const pp = getPortPos(node, pn, false);
      const pw = getPortWidth(node.type, pn, node.width);
      const pwPx = 4 + pw * 2;
      const port = document.createElementNS('http://www.w3.org/2000/svg','rect');
      port.setAttribute('x', pp.x - pwPx/2);
      port.setAttribute('y', pp.y - 5);
      port.setAttribute('width', pwPx);
      port.setAttribute('height', 10);
      port.setAttribute('rx', 2);
      port.setAttribute('fill', '#5555aa');
      port.setAttribute('stroke', '#7777cc');
      port.setAttribute('stroke-width', '1');
      port.setAttribute('data-port', pn);
      port.setAttribute('data-node-ref', node.id);
      port.setAttribute('class', 'port-ind');
      g.appendChild(port);
    }

    if(PORT_DEFS[node.type].outputs.includes('out')){
      const pp = getPortPos(node, 'out', true);
      const pw = getPortWidth(node.type, 'out', node.width);
      const pwPx = 4 + pw * 2;
      const port = document.createElementNS('http://www.w3.org/2000/svg','rect');
      port.setAttribute('x', pp.x - pwPx/2);
      port.setAttribute('y', pp.y - 5);
      port.setAttribute('width', pwPx);
      port.setAttribute('height', 10);
      port.setAttribute('rx', 2);
      port.setAttribute('fill', '#55aa55');
      port.setAttribute('stroke', '#77cc77');
      port.setAttribute('stroke-width', '1');
      port.setAttribute('data-port', 'out');
      port.setAttribute('data-node-ref', node.id);
      port.setAttribute('class', 'port-ind');
      g.appendChild(port);
    }

    ng.appendChild(g);
  }
}

function renderInspector(){
  const el = document.getElementById('inspector-content');
  if(!selection){
    el.innerHTML = '<span style="color:#555">Select a node</span>';
    return;
  }
  const node = doc.nodes.find(n=>n.id===selection);
  if(!node){ el.innerHTML = '<span style="color:#555">Select a node</span>'; return; }

  let html = `<div class="node-type">${node.type}</div>`;
  html += `<div class="node-id">ID: ${node.id}</div>`;
  html += `<label>Width</label><input type="number" id="node-width" value="${node.width}" min="1" max="8">`;
  if(node.type === 'INPUT'){
    html += `<label>Value</label><input type="text" id="node-value" value="${node.value}" maxlength="8">`;
  }
  if(node.type === 'CLOCK'){
    html += `<label>Period</label><input type="number" id="node-period" value="${node.period}" min="1" max="32">`;
  }
  const val = node.type === 'PROBE' ? (sim.probes[node.id]||'') : (sim.outputs[node.id]||'');
  html += `<label>Output</label><div style="font-family:monospace;font-size:14px;color:${signalColor(val)}">${val}</div>`;
  if(node.type === 'RAM' && sim.memory[node.id]){
    html += `<label>Memory</label><div style="font-family:monospace;font-size:10px;max-height:120px;overflow-y:auto">`;
    for(let i=0;i<16;i++) html += `<span class="${charClass(sim.memory[node.id][i][0]||'0')}">${i.toString(2).padStart(4,'0')}: ${sim.memory[node.id][i]}</span> `;
    html += `</div>`;
  }
  el.innerHTML = html;

  const widthInput = document.getElementById('node-width');
  if(widthInput){
    widthInput.addEventListener('change', onInspectorChange);
    widthInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') onInspectorChange(e); });
  }
  const valInput = document.getElementById('node-value');
  if(valInput){
    valInput.addEventListener('change', onInspectorChange);
    valInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') onInspectorChange(e); });
  }
  const periodInput = document.getElementById('node-period');
  if(periodInput){
    periodInput.addEventListener('change', onInspectorChange);
    periodInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') onInspectorChange(e); });
  }
}

function onInspectorChange(e){
  e.preventDefault();
  if(!selection) return;
  const node = doc.nodes.find(n=>n.id===selection);
  if(!node) return;

  const widthInput = document.getElementById('node-width');
  const valInput = document.getElementById('node-value');
  const periodInput = document.getElementById('node-period');

  if(widthInput && widthInput.dataset.dirty !== '1'){
    const newW = parseInt(widthInput.value);
    if(Number.isInteger(newW) && newW >= 1 && newW <= 8 && newW !== node.width){
      const oldW = node.width;
      if(node.type === 'INPUT'){
        const oldVal = node.value;
        if(newW < oldW) node.value = oldVal.substring(oldW - newW);
        else node.value = '0'.repeat(newW - oldW) + oldVal;
      }
      node.width = newW;
      removeIncompatibleWires(node);
      pushHistory();
      render();
    }
  }
  if(valInput && valInput.dataset.dirty !== '1'){
    const v = valInput.value;
    if(node.type === 'INPUT' && /^[01XZ]+$/.test(v) && v.length === node.width){
      node.value = v;
      pushHistory();
      render();
    }
  }
  if(periodInput && periodInput.dataset.dirty !== '1'){
    const p = parseInt(periodInput.value);
    if(node.type === 'CLOCK' && Number.isInteger(p) && p >= 1 && p <= 32 && p !== node.period){
      node.period = p;
      pushHistory();
      render();
    }
  }
}

function removeIncompatibleWires(node){
  const toRemove = [];
  for(const w of doc.wires){
    if(w.from.node === node.id){
      const sw = getPortWidth(node.type, 'out', node.width);
      const dstNode = doc.nodes.find(n=>n.id===w.to.node);
      if(dstNode){
        const dw = getPortWidth(dstNode.type, w.to.port, dstNode.width);
        if(sw !== dw) toRemove.push(w.id);
      }
    }
    if(w.to.node === node.id){
      const dw = getPortWidth(node.type, w.to.port, node.width);
      const srcNode = doc.nodes.find(n=>n.id===w.from.node);
      if(srcNode){
        const sw = getPortWidth(srcNode.type, 'out', srcNode.width);
        if(sw !== dw) toRemove.push(w.id);
      }
    }
  }
  doc.wires = doc.wires.filter(w => !toRemove.includes(w.id));
}

// ===== INTERACTION =====
let dragState = null;
let wireDrag = null;
let panState = null;

svg.addEventListener('mousedown', onMouseDown);
svg.addEventListener('mousemove', onMouseMove);
svg.addEventListener('mouseup', onMouseUp);
svg.addEventListener('wheel', onWheel, {passive:false});

function getSVGPoint(e){
  const rect = svg.getBoundingClientRect();
  return {x: e.clientX - rect.left, y: e.clientY - rect.top};
}

function onMouseDown(e){
  const pt = getSVGPoint(e);
  const wp = screenToWorld(pt.x, pt.y);

  if(e.altKey && !e.target.closest('[data-node]')){
    panState = {startX: e.clientX, startY: e.clientY, viewX: view.x, viewY: view.y};
    return;
  }

  const portEl = e.target.closest('[data-port]');
  if(portEl){
    const nodeRef = portEl.getAttribute('data-node-ref');
    const portName = portEl.getAttribute('data-port');
    const node = doc.nodes.find(n=>n.id===nodeRef);
    if(node && portName === 'out'){
      wireDrag = {fromNode: nodeRef, fromPort: 'out', startPt: wp};
      return;
    }
  }

  const nodeEl = e.target.closest('[data-node]');
  if(nodeEl){
    const nodeId = nodeEl.getAttribute('data-node');
    selection = nodeId;
    const node = doc.nodes.find(n=>n.id===nodeId);
    if(node){
      dragState = {nodeId: nodeId, startWX: wp.x, startWY: wp.y, nodeOX: node.x, nodeOY: node.y, moved: false};
    }
    render();
  }
}

function onMouseMove(e){
  if(panState){
    view.x = panState.viewX + (e.clientX - panState.startX);
    view.y = panState.viewY + (e.clientY - panState.startY);
    render();
    return;
  }
  if(dragState){
    const pt = getSVGPoint(e);
    const wp = screenToWorld(pt.x, pt.y);
    const node = doc.nodes.find(n=>n.id===dragState.nodeId);
    if(node){
      node.x = dragState.nodeOX + (wp.x - dragState.startWX);
      node.y = dragState.nodeOY + (wp.y - dragState.startWY);
      dragState.moved = true;
      render();
    }
    return;
  }
  if(wireDrag){
    const pt = getSVGPoint(e);
    const wp = screenToWorld(pt.x, pt.y);
    renderWirePreview(wp);
    return;
  }
}

function onMouseUp(e){
  if(panState){
    panState = null;
    scheduleSave();
    return;
  }
  if(dragState){
    if(dragState.moved){
      pushHistory();
    }
    dragState = null;
    render();
    return;
  }
  if(wireDrag){
    const pt = getSVGPoint(e);
    const wp = screenToWorld(pt.x, pt.y);
    removeWirePreview();

    const portEl = document.elementFromPoint(e.clientX, e.clientY);
    if(portEl){
      const pEl = portEl.closest('[data-port]');
      if(pEl){
        const targetNode = pEl.getAttribute('data-node-ref');
        const targetPort = pEl.getAttribute('data-port');
        if(targetPort !== 'out'){
          tryCreateWire(wireDrag.fromNode, 'out', targetNode, targetPort);
        }
      }
    }
    wireDrag = null;
    return;
  }
}

function tryCreateWire(fromNode, fromPort, toNode, toPort){
  const src = doc.nodes.find(n=>n.id===fromNode);
  const dst = doc.nodes.find(n=>n.id===toNode);
  if(!src || !dst) return;
  const sw = getPortWidth(src.type, 'out', src.width);
  const dw = getPortWidth(dst.type, toPort, dst.width);
  if(sw !== dw){
    setStatus(`Width mismatch: source ${sw} vs dest ${dw}`, '');
    return;
  }
  const dup = doc.wires.some(w => w.from.node===fromNode && w.from.port===fromPort && w.to.node===toNode && w.to.port===toPort);
  if(dup){
    setStatus('Duplicate connection', '');
    return;
  }
  const id = genId('w');
  doc.wires.push({id, from:{node:fromNode, port:fromPort}, to:{node:toNode, port:toPort}});
  pushHistory();
  render();
  setStatus('Wire created: ' + id, '');
}

function renderWirePreview(wp){
  removeWirePreview();
  const src = doc.nodes.find(n=>n.id===wireDrag.fromNode);
  if(!src) return;
  const sp = getPortPos(src, 'out', true);
  const dx = Math.max(40, Math.abs(wp.x - sp.x) * 0.4);
  const d = `M ${sp.x} ${sp.y} C ${sp.x+dx} ${sp.y}, ${wp.x-dx} ${wp.y}, ${wp.x} ${wp.y}`;
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', d);
  path.setAttribute('class', 'wire-preview');
  path.setAttribute('stroke', '#6a8aff');
  path.setAttribute('id', 'wire-preview');
  scene.appendChild(path);
}

function removeWirePreview(){
  const el = document.getElementById('wire-preview');
  if(el) el.remove();
}

function onWheel(e){
  e.preventDefault();
  const pt = getSVGPoint(e);
  const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
  const newScale = Math.max(0.25, Math.min(4, view.scale * factor));
  const wx = (pt.x - view.x) / view.scale;
  const wy = (pt.y - view.y) / view.scale;
  view.x = pt.x - wx * newScale;
  view.y = pt.y - wy * newScale;
  view.scale = newScale;
  render();
  scheduleSave();
}

// ===== ZOOM =====
function zoomIn(){
  const cx = container.clientWidth/2, cy = container.clientHeight/2;
  const wx = (cx - view.x)/view.scale, wy = (cy - view.y)/view.scale;
  view.scale = Math.min(4, view.scale * 1.25);
  view.x = cx - wx * view.scale;
  view.y = cy - wy * view.scale;
  render();
  scheduleSave();
}
function zoomOut(){
  const cx = container.clientWidth/2, cy = container.clientHeight/2;
  const wx = (cx - view.x)/view.scale, wy = (cy - view.y)/view.scale;
  view.scale = Math.max(0.25, view.scale / 1.25);
  view.x = cx - wx * view.scale;
  view.y = cy - wy * view.scale;
  render();
  scheduleSave();
}
function fitView(){
  if(doc.nodes.length === 0){ view.x=50; view.y=50; view.scale=1; render(); scheduleSave(); return; }
  const margin = 60;
  const minX = Math.min(...doc.nodes.map(n=>n.x)) - margin;
  const maxX = Math.max(...doc.nodes.map(n=>n.x + NODE_W)) + margin;
  const minY = Math.min(...doc.nodes.map(n=>n.y)) - margin;
  const maxY = Math.max(...doc.nodes.map(n=>n.y + getNodeHeight(n.type))) + margin;
  const w = maxX - minX, h = maxY - minY;
  const sw = container.clientWidth, sh = container.clientHeight;
  view.scale = Math.max(0.25, Math.min(4, Math.min(sw/w, sh/h)));
  view.x = (sw - w*view.scale)/2 - minX*view.scale;
  view.y = (sh - h*view.scale)/2 - minY*view.scale;
  render();
  scheduleSave();
}

// ===== SIMULATION CONTROLS =====
function stepForward(){
  if(running) return;
  const n = Math.max(1, Math.min(4096, parseInt(document.getElementById('step-count').value)||1));
  for(let i=0;i<n;i++) doTick();
  render();
}

function startRun(){
  if(running) return;
  running = true;
  updateRunButton();
  lastRunTime = performance.now();
  runLoop();
}
function stopRun(){
  if(!running) return;
  running = false;
  updateRunButton();
  if(runRAF) cancelAnimationFrame(runRAF);
  runRAF = null;
}
function toggleRun(){
  if(running) stopRun(); else startRun();
}
function runLoop(){
  if(!running) return;
  const now = performance.now();
  const elapsed = now - lastRunTime;
  const ticks = Math.floor(elapsed / 100);
  if(ticks > 0){
    for(let i=0;i<ticks;i++) doTick();
    lastRunTime = now;
    render();
  }
  runRAF = requestAnimationFrame(runLoop);
}
function resetState(){
  stopRun();
  resetSim();
  render();
}
function updateRunButton(){
  document.getElementById('run').setAttribute('aria-pressed', running ? 'true' : 'false');
  document.getElementById('run').textContent = running ? 'Pause' : 'Run';
}

// ===== DOCUMENT OPERATIONS =====
function newCircuit(){
  doc = {nodes:[], wires:[]};
  selection = null;
  pushHistory();
  render();
  setStatus('New circuit', '');
}

function deleteSelected(){
  if(!selection) return;
  const isEditing = isEditingContext();
  if(isEditing) return;
  doc.wires = doc.wires.filter(w => w.from.node !== selection && w.to.node !== selection);
  doc.nodes = doc.nodes.filter(n => n.id !== selection);
  selection = null;
  pushHistory();
  render();
  setStatus('Deleted node', '');
}

function isEditingContext(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName.toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
}

// ===== IMPORT/EXPORT =====
function doImport(){
  const text = document.getElementById('json').value.trim();
  let parsed;
  try{ parsed = JSON.parse(text); } catch(e){
    setStatus('Import error: Invalid JSON - ' + e.message, 'import');
    return;
  }
  const err = validateDocument(parsed);
  if(err){
    setStatus('Import error: ' + err, 'import');
    return;
  }
  doc = deepCopy(parsed);
  selection = null;
  pushHistory();
  render();
  setStatus('Import successful', '');
}

function doExport(){
  const exportDoc = {
    version: 1,
    nodes: doc.nodes.map(n => {
      const o = {id:n.id, type:n.type, x:n.x, y:n.y, width:n.width};
      if(n.type === 'INPUT') o.value = n.value;
      if(n.type === 'CLOCK') o.period = n.period;
      return o;
    }),
    wires: doc.wires.map(w => ({id:w.id, from:{node:w.from.node, port:w.from.port}, to:{node:w.to.node, port:w.to.port}}))
  };
  document.getElementById('json').value = JSON.stringify(exportDoc, null, 2);
  setStatus('Exported to textarea', '');
}

// ===== TRUTH TABLE =====
function doTruthTable(){
  const inputNodes = doc.nodes.filter(n=>n.type==='INPUT').sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  const probeNodes = doc.nodes.filter(n=>n.type==='PROBE').sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  const memNodes = doc.nodes.filter(n=>n.type==='CLOCK'||n.type==='DFF'||n.type==='RAM');

  if(inputNodes.length < 1){ setStatus('Truth table: need at least 1 INPUT', 'truth-unsupported'); return; }
  if(probeNodes.length < 1){ setStatus('Truth table: need at least 1 PROBE', 'truth-unsupported'); return; }
  if(probeNodes.length > 16){ setStatus('Truth table: max 16 probes', 'truth-unsupported'); return; }
  if(memNodes.length > 0){ setStatus('Truth table: no CLOCK, DFF, or RAM allowed', 'truth-unsupported'); return; }

  const totalBits = inputNodes.reduce((s,n)=>s+n.width, 0);
  if(totalBits > 8){ setStatus('Truth table: max 8 input bits', 'truth-unsupported'); return; }

  // Check for cycles
  if(hasCycle()){
    setStatus('Truth table: circuit has a directed cycle', 'truth-unsupported');
    return;
  }

  const rows = [];
  const total = 1 << totalBits;
  for(let i=0;i<total;i++){
    const assignment = i.toString(2).padStart(totalBits, '0');
    let bitPos = 0;
    const modDoc = deepCopy(doc);
    for(const node of inputNodes){
      const nNode = modDoc.nodes.find(n=>n.id===node.id);
      nNode.value = assignment.substring(bitPos, bitPos + node.width);
      bitPos += node.width;
    }
    const s = createSimState(modDoc);
    for(let t=0;t<64;t++) doTickOnState(s, modDoc);
    rows.push({assignment, probes: s.probes});
  }

  renderTruthTable(rows, inputNodes, probeNodes);
  setStatus('Truth table generated: ' + total + ' rows', '');
}

function doTickOnState(s, d){
  const snap = {};
  for(const id in s.outputs) snap[id] = s.outputs[id];
  const newOutputs = {};
  const newMemory = {};
  const newClocks = {};
  const newTick = s.tick + 1;

  for(const node of d.nodes){
    if(node.type === 'PROBE') continue;
    if(node.type === 'INPUT') newOutputs[node.id] = node.value;
    else if(node.type === 'CLOCK') newOutputs[node.id] = (Math.floor(newTick/node.period)%2===0)?'0':'1';
    else if(node.type === 'NOT') newOutputs[node.id] = gateNOT(resolveInput(node.id,'in',snap,d.wires,node.width));
    else if(node.type === 'AND') newOutputs[node.id] = gateAND(resolveInput(node.id,'a',snap,d.wires,node.width), resolveInput(node.id,'b',snap,d.wires,node.width));
    else if(node.type === 'OR') newOutputs[node.id] = gateOR(resolveInput(node.id,'a',snap,d.wires,node.width), resolveInput(node.id,'b',snap,d.wires,node.width));
    else if(node.type === 'XOR') newOutputs[node.id] = gateXOR(resolveInput(node.id,'a',snap,d.wires,node.width), resolveInput(node.id,'b',snap,d.wires,node.width));
    else if(node.type === 'MUX') newOutputs[node.id] = gateMUX(resolveInput(node.id,'a',snap,d.wires,node.width), resolveInput(node.id,'b',snap,d.wires,node.width), resolveInput(node.id,'s',snap,d.wires,1));
    else if(node.type === 'TRI') newOutputs[node.id] = gateTRI(resolveInput(node.id,'in',snap,d.wires,node.width), resolveInput(node.id,'en',snap,d.wires,1));
    else if(node.type === 'ADD') newOutputs[node.id] = gateADD(resolveInput(node.id,'a',snap,d.wires,node.width), resolveInput(node.id,'b',snap,d.wires,node.width), node.width);
    else if(node.type === 'DFF'){
      const d_=resolveInput(node.id,'d',snap,d.wires,node.width);
      const clkR=resolveInput(node.id,'clk',snap,d.wires,1);
      const rstR=resolveInput(node.id,'rst',snap,d.wires,1);
      const clk=clkR==='Z'?'X':clkR;
      const old=(s.clocks[node.id]||'0')==='Z'?'X':(s.clocks[node.id]||'0');
      const prev=snap[node.id]||'0'.repeat(node.width);
      let out;
      if(rstR==='1') out='0'.repeat(node.width);
      else if(rstR==='X'||rstR==='Z') out='X'.repeat(node.width);
      else{
        const def=(old==='0'&&clk==='1');
        const poss=(old!=='1'&&clk!=='0')&&!def;
        if(def) out=d_.split('').map(c=>c==='Z'?'X':c).join('');
        else if(poss) out='X'.repeat(node.width);
        else out=prev;
      }
      newOutputs[node.id]=out;
      newClocks[node.id]=clk;
    } else if(node.type === 'RAM'){
      const addr=resolveInput(node.id,'addr',snap,d.wires,4);
      const din=resolveInput(node.id,'din',snap,d.wires,node.width);
      const we=resolveInput(node.id,'we',snap,d.wires,1);
      const clkR=resolveInput(node.id,'clk',snap,d.wires,1);
      const clk=clkR==='Z'?'X':clkR;
      const old=(s.clocks[node.id]||'0')==='Z'?'X':(s.clocks[node.id]||'0');
      const prev=snap[node.id]||'0'.repeat(node.width);
      const mem=s.memory[node.id]||Array(16).fill('0'.repeat(node.width));
      const nm=[...mem];
      const def=(old==='0'&&clk==='1');
      const poss=(old!=='1'&&clk!=='0')&&!def;
      const binA=/^[01]+$/.test(addr);
      const dn=din.split('').map(c=>c==='Z'?'X':c).join('');
      let out;
      if(def){ out=binA?nm[parseInt(addr,2)]:'X'.repeat(node.width); }
      else if(poss) out='X'.repeat(node.width);
      else out=prev;
      if(we!=='0'){
        if(def&&binA&&we==='1') nm[parseInt(addr,2)]=dn;
        else if((def||poss)&&we!=='0'){
          if(binA) nm[parseInt(addr,2)]=mergeWords(nm[parseInt(addr,2)],dn);
          else for(let i=0;i<16;i++) nm[i]=mergeWords(nm[i],dn);
        }
      }
      newOutputs[node.id]=out;
      newMemory[node.id]=nm;
      newClocks[node.id]=clk;
    }
  }
  s.outputs=newOutputs;
  s.memory=newMemory;
  s.clocks=newClocks;
  s.tick=newTick;
  s.probes={};
  for(const node of d.nodes.filter(n=>n.type==='PROBE')){
    s.probes[node.id]=resolveInput(node.id,'in',newOutputs,d.wires,node.width);
  }
}

function hasCycle(){
  const adj = {};
  for(const n of doc.nodes) adj[n.id] = [];
  for(const w of doc.wires) adj[w.from.node].push(w.to.node);
  const visited = {};
  const inStack = {};
  function dfs(node){
    visited[node] = true;
    inStack[node] = true;
    for(const next of (adj[node]||[])){
      if(inStack[next]) return true;
      if(!visited[next] && dfs(next)) return true;
    }
    inStack[node] = false;
    return false;
  }
  for(const n of doc.nodes){
    if(!visited[n.id] && dfs(n.id)) return true;
  }
  return false;
}

function renderTruthTable(rows, inputNodes, probeNodes){
  const table = document.getElementById('truth-table');
  let html = '<thead><tr><th>Assignment</th>';
  for(const p of probeNodes) html += `<th>${p.id}</th>`;
  html += '</tr></thead><tbody>';
  for(const row of rows){
    html += `<tr data-assignment="${row.assignment}"><td>${row.assignment}</td>`;
    for(const p of probeNodes){
      const val = row.probes[p.id] || '';
      html += `<td data-probe="${p.id}" class="${charClass(val[0]||'X')}">${val}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

// ===== STATUS =====
function setStatus(msg, errorType){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.setAttribute('data-error', errorType || '');
}

// ===== PERSISTENCE =====
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}
function save(){
  try{
    const data = {
      doc: doc,
      view: view
    };
    localStorage.setItem('flux_state', JSON.stringify(data));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('flux_state');
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.doc && Array.isArray(data.doc.nodes) && Array.isArray(data.doc.wires)){
      const err = validateDocument(data.doc);
      if(!err){
        doc = data.doc;
        idCounter = Math.max(idCounter, ...doc.nodes.map(n=>parseInt(n.id.replace(/\D/g,''))||0), ...doc.wires.map(w=>parseInt(w.id.replace(/\D/g,''))||0), 0) + 1;
      }
    }
    if(data.view && typeof data.view.x === 'number'){
      view = data.view;
    }
  }catch(e){
    doc = {nodes:[], wires:[]};
    view = {x:50, y:50, scale:1};
  }
}

// ===== API =====
window.__arena = {
  snapshot: function(){
    const outputs = {};
    for(const n of doc.nodes){
      if(n.type !== 'PROBE') outputs[n.id] = {out: sim.outputs[n.id] || 'X'.repeat(n.width)};
    }
    const probes = {};
    for(const n of doc.nodes.filter(n=>n.type==='PROBE')){
      probes[n.id] = sim.probes[n.id] || 'Z'.repeat(n.width);
    }
    const memory = {};
    for(const n of doc.nodes.filter(n=>n.type==='RAM')){
      memory[n.id] = sim.memory[n.id] || Array(16).fill('0'.repeat(n.width));
    }
    const clocks = {};
    for(const n of doc.nodes.filter(n=>n.type==='DFF'||n.type==='RAM')){
      clocks[n.id] = sim.clocks[n.id] || '0';
    }
    const circuit = {
      version: 1,
      nodes: doc.nodes.map(n=>{
        const o = {id:n.id, type:n.type, x:n.x, y:n.y, width:n.width};
        if(n.type==='INPUT') o.value = n.value;
        if(n.type==='CLOCK') o.period = n.period;
        return o;
      }),
      wires: doc.wires.map(w=>({id:w.id, from:{node:w.from.node, port:w.from.port}, to:{node:w.to.node, port:w.to.port}}))
    };
    return {
      circuit: circuit,
      tick: sim.tick,
      outputs: outputs,
      probes: probes,
      memory: memory,
      clocks: clocks,
      selection: selection,
      view: {x: view.x, y: view.y, scale: view.scale},
      running: running
    };
  }
};

// ===== KEYBOARD =====
document.addEventListener('keydown', (e)=>{
  if(isEditingContext()) return;
  if(e.key === ' '){
    e.preventDefault();
    toggleRun();
  } else if(e.key === 'Delete' || e.key === 'Backspace'){
    e.preventDefault();
    deleteSelected();
  } else if(e.key === 'Escape'){
    selection = null;
    render();
  } else if((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey){
    e.preventDefault();
    undo();
  } else if((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey){
    e.preventDefault();
    redo();
  }
});

    const type = btn.getAttribute('data-add');
    const id = genId('n');
    const cx = container.clientWidth/2;
    const cy = container.clientHeight/2;

  });
});
